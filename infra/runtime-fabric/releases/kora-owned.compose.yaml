services:
  kora-tv:
    build:
      context: ./kora-tv-source/kora-network
      dockerfile: Dockerfile
    image: izakhono/kora-tv:owned
    container_name: izakhono-kora-tv
    restart: unless-stopped
    env_file:
      - ./kora-owned.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:8300:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
