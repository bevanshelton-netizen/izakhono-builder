options {
  directory "/var/cache/bind";
  listen-on { any; };
  listen-on-v6 { any; };
  recursion no;
  allow-query { any; };
  allow-query-cache { none; };
  version "IZAKHONO DNS SECONDARY";
};

zone "izakhono.africa" IN {
  type secondary;
  file "/var/lib/bind/izakhono.africa.zone";
  primaries { 172.30.0.10; };
};

# Retained legacy portfolio zone. It is separate from izakhono.africa.
zone "izakhonoafrica.co.za" IN {
  type secondary;
  file "/var/lib/bind/izakhonoafrica.co.za.zone";
  primaries { 172.30.0.10; };
};
