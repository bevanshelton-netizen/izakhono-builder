services:
  dns-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PDNS_DB_NAME:-powerdns}
      POSTGRES_USER: ${PDNS_DB_USER:-powerdns}
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD:?set PDNS_DB_PASSWORD}
    volumes:
      - pdns-db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-powerdns.sql:ro
    networks: [dns]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDNS_DB_USER:-powerdns} -d ${PDNS_DB_NAME:-powerdns}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pdns-primary:
    image: powerdns/pdns-auth-49:latest
    restart: unless-stopped
    depends_on:
      dns-db:
        condition: service_healthy
    environment:
      PDNS_API_KEY: ${PDNS_API_KEY:?set PDNS_API_KEY}
      PDNS_DB_PASSWORD: ${PDNS_DB_PASSWORD:?set PDNS_DB_PASSWORD}
      PRIMARY_NS_FQDN: ${PRIMARY_NS_FQDN:?set PRIMARY_NS_FQDN}
      SECONDARY_NS_FQDN: ${SECONDARY_NS_FQDN:?set SECONDARY_NS_FQDN}
      AXFR_ALLOWED_NETS: ${AXFR_ALLOWED_NETS:-0.0.0.0/0}
    volumes:
      - ./pdns-primary.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:8081/tcp"
    networks: [dns]

  pdns-secondary:
    image: powerdns/pdns-auth-49:latest
    restart: unless-stopped
    depends_on:
      dns-db:
        condition: service_healthy
    environment:
      PDNS_API_KEY: ${PDNS_API_KEY:?set PDNS_API_KEY}
      PDNS_DB_PASSWORD: ${PDNS_DB_PASSWORD:?set PDNS_DB_PASSWORD}
      PRIMARY_NS_FQDN: ${PRIMARY_NS_FQDN:?set PRIMARY_NS_FQDN}
      SECONDARY_NS_FQDN: ${SECONDARY_NS_FQDN:?set SECONDARY_NS_FQDN}
      AXFR_ALLOWED_NETS: ${AXFR_ALLOWED_NETS:-0.0.0.0/0}
    volumes:
      - ./pdns-secondary.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    networks: [dns]

networks:
  dns:
    driver: bridge

volumes:
  pdns-db:
