services:
  crm:
    build:
      context: ../../products/izakhono-crm
      dockerfile: Dockerfile
    image: izakhono/crm:local
    container_name: izakhono-crm
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      CRM_DATA_FILE: /data/crm.json
      CRM_ADMIN_TOKEN: ${CRM_ADMIN_TOKEN}
      CRM_INGEST_TOKEN: ${CRM_INGEST_TOKEN}
      CRM_STAFF_JSON: ${CRM_STAFF_JSON:-}
      CRM_ALLOW_INSECURE_LOCAL: "false"
    volumes:
      - crm_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  revenue:
    build:
      context: ../../products/izakhono-revenue
      dockerfile: Dockerfile
    image: izakhono/revenue:local
    container_name: izakhono-revenue
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8795"
      REVENUE_DATA_FILE: /data/revenue.json
      REVENUE_FLOW_TOKEN: ${REVENUE_FLOW_TOKEN}
      REVENUE_ALLOW_INSECURE_LOCAL: "false"
    volumes:
      - revenue_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8795/health').then(r=>r.json()).then(v=>{if(!v.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tasks:
    build:
      context: ../../products/izakhono-tasks
      dockerfile: Dockerfile
    image: izakhono/tasks:local
    container_name: izakhono-tasks
    restart: unless-stopped
    environment:
      IZAKHONO_TASKS_HOST: 0.0.0.0
      IZAKHONO_TASKS_PORT: "9991"
      IZAKHONO_TASKS_DB: /data/izakhono-tasks.db
      IZAKHONO_TASKS_TOKEN: ${IZAKHONO_TASKS_TOKEN}
      IZAKHONO_TASKS_FLOW_TOKEN: ${IZAKHONO_TASKS_FLOW_TOKEN}
      IZAKHONO_TASKS_RUNNER_URL: ${IZAKHONO_TASKS_RUNNER_URL:-}
      IZAKHONO_TASKS_RUNNER_SECRET: ${IZAKHONO_TASKS_RUNNER_SECRET:-}
    volumes:
      - tasks_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD","python","-c","import json,urllib.request; v=json.load(urllib.request.urlopen('http://127.0.0.1:9991/healthz',timeout=3)); raise SystemExit(0 if v.get('ok') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  flow:
    build:
      context: ../../products/izakhono-flow
      dockerfile: Dockerfile
    image: izakhono/flow:local
    container_name: izakhono-flow
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8794"
      FLOW_DATA_FILE: /data/flow.json
      FLOW_ADMIN_TOKEN: ${FLOW_ADMIN_TOKEN:-}
      FLOW_INGEST_TOKEN: ${FLOW_INGEST_TOKEN:-}
      FLOW_ADAPTERS_JSON: ${FLOW_ADAPTERS_JSON:-}
      FLOW_ALLOW_INSECURE_LOCAL: "false"
    volumes:
      - flow_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8794/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  fabric:
    build:
      context: ../../products/izakhono-fabric/gateway
      dockerfile: Dockerfile
    image: izakhono/app-fabric-gateway:local
    container_name: izakhono-app-fabric-gateway
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      IZAKHONO_CRM_URL: http://crm:8080
      IZAKHONO_CRM_INGEST_TOKEN: ${CRM_INGEST_TOKEN}
      IZAKHONO_FABRIC_INTERNAL_TOKEN: ${IZAKHONO_FABRIC_INTERNAL_TOKEN}
      IZAKHONO_FABRIC_PUBLIC_INTAKE: ${IZAKHONO_FABRIC_PUBLIC_INTAKE:-false}
      IZAKHONO_FABRIC_ALLOWED_ORIGINS: ${IZAKHONO_FABRIC_ALLOWED_ORIGINS:-}
      IZAKHONO_FABRIC_ALLOW_ORIGINLESS: ${IZAKHONO_FABRIC_ALLOW_ORIGINLESS:-false}
      FABRIC_OUTBOX_FILE: /data/outbox.json
    volumes:
      - fabric_outbox:/data
    depends_on:
      crm:
        condition: service_healthy
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  crm_data:
    name: izakhono_crm_data
  revenue_data:
    name: izakhono_revenue_data
  tasks_data:
    name: izakhono_tasks_data
  flow_data:
    name: izakhono_flow_data
  fabric_outbox:
    name: izakhono_fabric_outbox

networks:
  public:
    external: true
    name: izakhono_public
  private:
    external: true
    name: izakhono_private
