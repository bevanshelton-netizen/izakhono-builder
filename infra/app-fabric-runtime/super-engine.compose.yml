services:
  super_engine:
    build:
      context: ../..
      dockerfile: products/izakhono-super-engine/Dockerfile
    image: izakhono/super-engine:${IZAKHONO_SUPER_ENGINE_TAG:-current}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8787
    expose:
      - "8787"
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  private:
    external: true
    name: izakhono_private
