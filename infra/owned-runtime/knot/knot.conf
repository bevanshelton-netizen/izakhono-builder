server:
  rundir: /run/knot
  user: knot:knot
  listen: [0.0.0.0@53, ::@53]

log:
  - target: stderr
    any: info

zone:
  - domain: izakhono.africa
    file: /var/lib/knot/zones/izakhono.africa.zone
    semantic-checks: on
    zonefile-sync: -1
    zonefile-load: difference-no-serial

  # Customer/application zones are added here only after registrar delegation
  # and external authority tests are ready.
