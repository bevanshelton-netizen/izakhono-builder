name: izakhono-node01

networks:
  izakhono-internal:
    external: true
  izakhono-edge:
    external: true

services:
  node-build-support:
    image: docker:27-cli
    restart: unless-stopped
    command: ["sh","-lc","while true; do sleep 3600; done"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/izakhono-node:/var/lib/izakhono-node
    networks:
      - izakhono-internal
    profiles: ["build-support"]

# NODE and CONTROL remain WSL system services.
# Docker is the workload engine; WSL is the sovereign control host.
