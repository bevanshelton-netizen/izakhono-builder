services:
  nav:
    build:
      context: ../../apps/izakhono-nav
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      IZAKHONO_RELEASE: ${IZAKHONO_RELEASE:-owned-nav-main}
      IZAKHONO_AI_CHAT_ENDPOINT: ${IZAKHONO_AI_CHAT_ENDPOINT:-}
      IZAKHONO_AI_API_KEY: ${IZAKHONO_AI_API_KEY:-}
      IZAKHONO_AI_MODEL: ${IZAKHONO_AI_MODEL:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nav]

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      nav:
        condition: service_healthy
    environment:
      NAV_DOMAIN: ${NAV_DOMAIN:-nav.izakhono.africa}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nav-Caddyfile:/etc/caddy/Caddyfile:ro
      - nav-caddy-data:/data
      - nav-caddy-config:/config
    networks: [nav]

networks:
  nav:
    driver: bridge

volumes:
  nav-caddy-data:
  nav-caddy-config:
