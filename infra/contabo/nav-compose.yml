services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      NAV_DOMAIN: ${NAV_DOMAIN:-nav.izakhono.africa}
    volumes:
      - ./nav-Caddyfile:/etc/caddy/Caddyfile:ro
      - nav-caddy-data:/data
      - nav-caddy-config:/config

volumes:
  nav-caddy-data:
  nav-caddy-config:
