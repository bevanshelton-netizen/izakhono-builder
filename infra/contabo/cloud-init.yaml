#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-transport-https
  - software-properties-common

write_files:
  - path: /etc/sysctl.d/99-izakhono-hardening.conf
    permissions: '0644'
    content: |
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1
      net.ipv4.icmp_echo_ignore_broadcasts=1
      net.ipv4.conf.all.accept_source_route=0
      net.ipv4.conf.default.accept_source_route=0
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0
      kernel.dmesg_restrict=1
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
      findtime = 10m

runcmd:
  - sysctl --system
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -lc 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo ${VERSION_CODENAME}) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - bash -lc 'RUNTIME_USER=admin; id "$RUNTIME_USER" >/dev/null 2>&1 || RUNTIME_USER=ubuntu; usermod -aG docker "$RUNTIME_USER"'
  - install -d -m 0750 /opt/izakhono/{releases,current,backups,run,config,logs}
  - install -d -m 0750 /var/lib/izakhono
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - bash -lc 'printf "IZAKHONO node bootstrap complete: %s\n" "$(date -Is)" > /opt/izakhono/bootstrap-complete.txt'

final_message: 'IZAKHONO node bootstrap completed.'
