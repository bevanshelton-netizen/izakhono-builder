services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: izakhono-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - izakhono_public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: izakhono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - izakhono_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    image: izakhono/core:0.1.0
    container_name: izakhono-core
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: "8787"
      IZAKHONO_CORE_JWT_SECRET: ${IZAKHONO_CORE_JWT_SECRET}
      IZAKHONO_CORE_ADMIN_TOKEN: ${IZAKHONO_CORE_ADMIN_TOKEN}
      IZAKHONO_CORE_ALLOWED_ORIGINS: ${IZAKHONO_CORE_ALLOWED_ORIGINS:-}
      IZAKHONO_CORE_TRUST_PROXY: "true"
      IZAKHONO_CORE_STORAGE_DIR: /data/storage
    volumes:
      - core_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izakhono_public
      - izakhono_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2.8.3
    container_name: izakhono-registry
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - izakhono_private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
    name: izakhono_caddy_data
  caddy_config:
    name: izakhono_caddy_config
  postgres_data:
    name: izakhono_postgres_data
  core_storage:
    name: izakhono_core_storage
  registry_data:
    name: izakhono_registry_data

networks:
  izakhono_public:
    name: izakhono_public
  izakhono_private:
    name: izakhono_private
    internal: true
