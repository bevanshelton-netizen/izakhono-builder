services:
  control:
    build: .
    container_name: izakhono-containers-control
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - registry
  registry:
    image: registry:2
    container_name: izakhono-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
volumes:
  registry-data:
