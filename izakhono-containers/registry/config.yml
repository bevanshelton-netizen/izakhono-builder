version: 0.1
log:
  fields:
    service: izakhono-registry

auth:
  htpasswd:
    realm: IZAKHONO Registry
    path: /auth/htpasswd

storage:
  delete:
    enabled: true
  filesystem:
    rootdirectory: /var/lib/registry

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
