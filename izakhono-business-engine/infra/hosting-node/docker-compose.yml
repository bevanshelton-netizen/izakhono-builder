services:
  hosting-node:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOSTING_NODE_BIND:-127.0.0.1}:${HOSTING_NODE_PORT:-8787}:8787"
    volumes:
      - ./data:/var/lib/izakhono-node
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
