name: IZAKHONO MARKETING OS CI

on:
  pull_request:
    paths:
      - "products/izakhono-marketing-os/**"
      - ".github/workflows/izakhono-marketing-os.yml"
  push:
    branches: [main]
    paths:
      - "products/izakhono-marketing-os/**"
      - ".github/workflows/izakhono-marketing-os.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate campaign engine
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/campaign-engine.test.ts
      - name: Validate Social Command distribution layer
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/social-command.test.ts
      - name: Validate execution orchestration
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-orchestrator.test.ts
      - name: Validate controlled adapter execution
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/adapter-execution.test.ts
      - name: Validate execution reliability
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-reliability.test.ts
      - name: Validate reliable dispatch boundary
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/reliable-dispatch.test.ts
      - name: Validate execution recovery
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-recovery.test.ts
      - name: Validate execution runtime
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-runtime.test.ts
      - name: Validate execution persistence boundary
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-persistence.test.ts
      - name: Validate measurement feedback loop
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/measurement-feedback.test.ts
      - name: Validate optimization orchestration
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/optimization-orchestrator.test.ts
      - name: Validate closed-loop optimization execution
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/optimization-execution.test.ts
      - name: Typecheck Marketing OS core
        run: npx --yes typescript@5.9.2 --noEmit --target ES2022 --module ESNext products/izakhono-marketing-os/src/campaign-engine.ts products/izakhono-marketing-os/src/metricool-adapter.ts products/izakhono-marketing-os/src/social-command.ts products/izakhono-marketing-os/src/execution-orchestrator.ts products/izakhono-marketing-os/src/adapter-execution.ts products/izakhono-marketing-os/src/execution-reliability.ts products/izakhono-marketing-os/src/reliable-dispatch.ts products/izakhono-marketing-os/src/execution-recovery.ts products/izakhono-marketing-os/src/execution-runtime.ts products/izakhono-marketing-os/src/execution-persistence.ts products/izakhono-marketing-os/src/measurement-feedback.ts products/izakhono-marketing-os/src/optimization-orchestrator.ts products/izakhono-marketing-os/src/optimization-execution.ts
