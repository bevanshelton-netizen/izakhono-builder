name: IZAKHONO DNS Bootstrap CI

on:
  push:
    paths:
      - 'products/izakhono-dns/**'
      - '.github/workflows/izakhono-dns-bootstrap-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-dns/**'
      - '.github/workflows/izakhono-dns-bootstrap-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n products/izakhono-dns/bootstrap/install-authoritative.sh
          bash -n products/izakhono-dns/bootstrap/install-secondary.sh
      - name: Reject documentation-only production IPs
        run: |
          set -euo pipefail
          ! grep -R -E '(^|[^0-9])(192\.0\.2\.|198\.51\.100\.|203\.0\.113\.)' products/izakhono-dns/bootstrap/install-*.sh
      - name: Check authoritative hardening markers
        run: |
          set -euo pipefail
          grep -q 'recursion no' products/izakhono-dns/bootstrap/install-authoritative.sh
          grep -q 'allow-transfer { none; }' products/izakhono-dns/bootstrap/install-authoritative.sh
