name: IZAKHONO Alpha Core Self Test

# The safety preflight lives inside the reusable Builder workflow. Caller repositories
# provide only the declarative manifest and build context; they do not supply preflight code.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-build-to-alpha.yml'
      - '.github/workflows/izakhono-alpha-self-test.yml'
      - 'fixtures/smoke/**'
      - 'fixtures/studypal-canary/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-build-to-alpha.yml'
      - '.github/workflows/izakhono-alpha-self-test.yml'
      - 'fixtures/smoke/**'
      - 'fixtures/studypal-canary/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-core:
    uses: ./.github/workflows/izakhono-build-to-alpha.yml
    with:
      manifest_path: fixtures/smoke/.izakhono.json

  studypal-canary:
    uses: ./.github/workflows/izakhono-build-to-alpha.yml
    with:
      manifest_path: fixtures/studypal-canary/.izakhono.json
