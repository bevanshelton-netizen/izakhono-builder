name: IZAKHONO Digital Finance External Resilience

on:
  push:
    branches:
      - main
    paths:
      - "apps/izakhono-digital-finance/**"
      - ".github/workflows/izakhono-digital-finance-external-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izakhono-digital-finance-external-resilience
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect optional Cloudflare deployment credentials
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "DIGITAL_FINANCE_CLOUDFLARE_GATE=READY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DIGITAL_FINANCE_CLOUDFLARE_GATE=SKIPPED_USING_VERIFIED_VERCEL_ROUTE"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage public-only resilience assets
        shell: bash
        working-directory: apps/izakhono-digital-finance
        run: |
          set -euo pipefail
          python verify.py
          rm -rf public-fallback
          mkdir -p public-fallback
          cp index.html styles.css app.js curriculum.json platform.json institutions.json locales.json institutional-offers.json automation.json assessment-blueprint.json external-status.json EXTERNAL-LIVE-EVIDENCE.json healthz public-fallback/
          cp -R assets public-fallback/assets
          test ! -f public-fallback/engine.py
          test ! -f public-fallback/automation_store.py
          test ! -f public-fallback/learner_access.py
          test ! -f public-fallback/credential_service.py

      - name: Verify fail-closed external boundary
        shell: python
        working-directory: apps/izakhono-digital-finance
        run: |
          from pathlib import Path
          worker = Path("external-worker.js").read_text(encoding="utf-8")
          assert "protected_owned_engine_required" in worker
          assert "/api/v1/admin/" in worker
          assert "/api/v1/learner/" in worker
          assert "/api/v1/automation/evaluate" in worker
          assert "learner_writes: false" in worker
          print("DIGITAL_FINANCE_EXTERNAL_BOUNDARY=PASS")

      - name: Deploy optional Cloudflare resilience route
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        working-directory: apps/izakhono-digital-finance
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler-fallback.jsonc 2>&1 | tee /tmp/digital-finance-wrangler.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/digital-finance-wrangler.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "Could not determine workers.dev route from deploy output."
            cat /tmp/digital-finance-wrangler.log
            exit 21
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "DIGITAL_FINANCE_EXTERNAL_URL=$URL"

      - name: Preserve verified Vercel route when Cloudflare is unavailable
        id: fallback
        if: steps.gate.outputs.ready != 'true'
        shell: bash
        run: |
          echo "url=https://izakhono-digital-finance.vercel.app" >> "$GITHUB_OUTPUT"
          echo "DIGITAL_FINANCE_EXTERNAL_URL=https://izakhono-digital-finance.vercel.app"

      - name: Independently verify HTTPS experience
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.url || steps.fallback.outputs.url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$PUBLIC_URL/healthz" | grep -qx "OK"; then
              break
            fi
            sleep 3
          done
          test "$(curl -fsS --max-time 15 "$PUBLIC_URL/healthz")" = "OK"
          curl -fsS --max-time 15 "$PUBLIC_URL/" > /tmp/home.html
          grep -q "IZAKHONO DIGITAL FINANCE" /tmp/home.html
          curl -fsS --max-time 15 "$PUBLIC_URL/api/v1/status" > /tmp/status.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          assert d["engine"] == "external-static-resilience"
          assert d["learner_writes"] is False
          assert d["tracking"] is False
          PY
          STATUS="$(curl -sS -o /tmp/protected.json -w '%{http_code}' -X POST "$PUBLIC_URL/api/v1/automation/evaluate" -H 'Content-Type: application/json' -d '{"learner_ref":"probe"}')"
          case "$STATUS" in
            404|503) ;;
            *) echo "Protected automation route did not fail closed: HTTP $STATUS"; cat /tmp/protected.json; exit 22 ;;
          esac
          echo "DIGITAL_FINANCE_EXTERNAL_HTTPS_VERIFY=PASS"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Record evidence
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.url || steps.fallback.outputs.url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## IZAKHONO Digital Finance external resilience
          - Public route: $PUBLIC_URL
          - HTTPS root: PASS
          - /healthz: PASS
          - Product marker: PASS
          - Tracking disabled: PASS
          - Premium visual asset: packaged
          - Protected learner/admin writes fail closed: PASS
          - Evidence label: EXTERNAL LIVE VERIFIED
          - Owned NODE01 route: still requires independent owner-machine + DNS/TLS acceptance
          EOF
