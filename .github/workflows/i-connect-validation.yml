name: I-CONNECT Automation Validation

on:
  pull_request:
    paths:
      - 'products/i-connect/**'
      - '.github/workflows/i-connect-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install I-CONNECT dependencies
        working-directory: products/i-connect
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: products/i-connect
        run: npm run check:syntax
      - name: Run workflow and webhook adapter tests
        working-directory: products/i-connect
        run: npm run test:workflow-engine
