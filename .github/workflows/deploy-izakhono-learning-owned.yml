name: Deploy IZAKHONO Learning — Owned Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-learning/**'
      - '.github/workflows/deploy-izakhono-learning-owned.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izakhono-learning-owned-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: products/izakhono-learning
        run: npm install --no-audit --no-fund

      - name: Build learning platform
        working-directory: products/izakhono-learning
        run: npm run build

      - name: Verify production artifact
        working-directory: products/izakhono-learning
        run: test -s dist/index.html

      - name: Verify owned deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy through IZAKHONO owned Worker
        working-directory: products/izakhono-learning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.127.1 deploy --config wrangler.jsonc

      - name: Record deployment target
        run: |
          echo "Worker: izakhono-learning"
          echo "Engine: IZAKHONO Builder + Cloudflare Worker Assets"
          echo "Custom-domain cutover remains a separate acceptance gate."
