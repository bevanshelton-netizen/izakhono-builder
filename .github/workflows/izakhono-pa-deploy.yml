name: Deploy IZAKHONO Executive PA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-pa/**'
      - 'migrations/0006_pa_commercial_core.sql'
      - '.github/workflows/izakhono-pa-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate
        run: |
          npx tsc --noEmit --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext products/izakhono-pa/src/index.ts
          node products/izakhono-pa/scripts/validate-pa.mjs
          npx wrangler deploy --dry-run --config products/izakhono-pa/wrangler.jsonc
      - name: Apply D1 migration
        run: npx wrangler d1 migrations apply DB --remote --config products/izakhono-pa/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --config products/izakhono-pa/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
