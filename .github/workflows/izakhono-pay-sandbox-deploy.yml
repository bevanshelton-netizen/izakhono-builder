name: Deploy IZAKHONO PAY Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-pay/**'
      - '.github/workflows/izakhono-pay-sandbox-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-pay-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: izakhono-pay-sandbox
    defaults:
      run:
        working-directory: products/izakhono-pay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SECRET: ${{ secrets.IZAKHONO_PAY_ADMIN_SECRET }}
      # Official public PayFast sandbox credentials. These never move real money.
      PAYFAST_MERCHANT_ID: '10004002'
      PAYFAST_MERCHANT_KEY: 'q1cd2rdny4a53'
      PAYFAST_PASSPHRASE: 'payfast'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sandbox deploy tooling
        run: npm install --no-audit --no-fund

      - name: Verify payment core before deployment
        run: npm run check

      - name: Prepare sandbox admin secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_SECRET:-}" ]; then
            generated="$(openssl rand -hex 32)"
            echo "::add-mask::$generated"
            echo "ADMIN_SECRET=$generated" >> "$GITHUB_ENV"
            echo 'Using an ephemeral sandbox admin secret for this proof run.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select Cloudflare deployment mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'DEPLOY_FLAGS=' >> "$GITHUB_ENV"
            echo 'D1_FLAGS=--remote' >> "$GITHUB_ENV"
            echo 'TEMPORARY_DEPLOY=false' >> "$GITHUB_ENV"
            echo 'Using the connected permanent Cloudflare account.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'DEPLOY_FLAGS=--temporary' >> "$GITHUB_ENV"
            echo 'D1_FLAGS=--remote --temporary' >> "$GITHUB_ENV"
            echo 'TEMPORARY_DEPLOY=true' >> "$GITHUB_ENV"
            echo 'No permanent Cloudflare credentials found; using a temporary Cloudflare preview account for sandbox proof.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bootstrap Worker and auto-provision sandbox D1
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy ${DEPLOY_FLAGS:-} --config wrangler.sandbox.jsonc \
            --var ADMIN_SECRET:"$ADMIN_SECRET" \
            --var PAYFAST_MERCHANT_ID:"$PAYFAST_MERCHANT_ID" \
            --var PAYFAST_MERCHANT_KEY:"$PAYFAST_MERCHANT_KEY" \
            --var PAYFAST_PASSPHRASE:"$PAYFAST_PASSPHRASE")"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          claim="$(printf '%s\n' "$output" | grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' | tail -1 || true)"
          if [ -n "$claim" ]; then echo "::add-mask::$claim"; fi
          printf '%s\n' "$output" | sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<temporary-claim-url-masked>#g'
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        shell: bash
        run: npx wrangler d1 migrations apply DB ${D1_FLAGS:- --remote} --config wrangler.sandbox.jsonc

      - name: Provision ephemeral KORA sandbox merchant
        shell: bash
        run: |
          set -euo pipefail
          key="izp_sandbox_$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          hash="$(printf '%s' "$key" | sha256sum | awk '{print $1}')"
          sql="UPDATE merchant_apps SET api_key_hash='$hash', status='active', return_origin='https://kora-network.vercel.app', updated_at=CURRENT_TIMESTAMP WHERE slug='kora' AND status IN ('staged','active');"
          npx wrangler d1 execute DB ${D1_FLAGS:- --remote} --config wrangler.sandbox.jsonc --command "$sql"
          echo "KORA_SANDBOX_KEY=$key" >> "$GITHUB_ENV"
          echo 'KORA activated in sandbox only with an ephemeral merchant key and approved return origin.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install server-only payment secrets on permanent account
        if: env.TEMPORARY_DEPLOY == 'false'
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.sandbox.jsonc >/dev/null
          }
          put_secret ADMIN_SECRET "$ADMIN_SECRET"
          put_secret PAYFAST_MERCHANT_ID "$PAYFAST_MERCHANT_ID"
          put_secret PAYFAST_MERCHANT_KEY "$PAYFAST_MERCHANT_KEY"
          put_secret PAYFAST_PASSPHRASE "$PAYFAST_PASSPHRASE"

      - name: Final sandbox deployment
        id: final
        shell: bash
        run: |
          set -euo pipefail
          if [ "${TEMPORARY_DEPLOY:-false}" = 'true' ]; then
            output="$(npx wrangler deploy --temporary --config wrangler.sandbox.jsonc \
              --var ADMIN_SECRET:"$ADMIN_SECRET" \
              --var PAYFAST_MERCHANT_ID:"$PAYFAST_MERCHANT_ID" \
              --var PAYFAST_MERCHANT_KEY:"$PAYFAST_MERCHANT_KEY" \
              --var PAYFAST_PASSPHRASE:"$PAYFAST_PASSPHRASE")"
          else
            output="$(npx wrangler deploy --config wrangler.sandbox.jsonc)"
          fi
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          claim="$(printf '%s\n' "$output" | grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' | tail -1 || true)"
          if [ -n "$claim" ]; then echo "::add-mask::$claim"; fi
          printf '%s\n' "$output" | sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<temporary-claim-url-masked>#g'
          if [ -z "$url" ]; then url='${{ steps.bootstrap.outputs.worker_url }}'; fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## IZAKHONO PAY Sandbox'
            echo
            echo 'PayFast-first proof mode: no real money.'
            if [ -n "$url" ]; then echo "Sandbox URL: $url"; fi
            if [ "${TEMPORARY_DEPLOY:-false}" = 'true' ]; then
              echo 'Temporary Cloudflare account used for this proof; it is not approved for real-money traffic.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify hosted sandbox health
        if: steps.final.outputs.worker_url != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "${{ steps.final.outputs.worker_url }}/api/health" | tee /tmp/izakhono-pay-health.json
          grep -q '"service":"IZAKHONO PAY"' /tmp/izakhono-pay-health.json

      - name: Prove KORA routes to PayFast sandbox
        if: steps.final.outputs.worker_url != ''
        env:
          IZAKHONO_PAY_URL: ${{ steps.final.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.IZAKHONO_PAY_URL;
          const key = process.env.KORA_SANDBOX_KEY;
          if (!url || !key) throw new Error('Sandbox URL or ephemeral KORA key is missing');

          const response = await fetch(`${url}/api/v1/intents`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-izakhono-app': 'kora',
              'x-izakhono-key': key,
              'idempotency-key': `kora-proof-${Date.now()}`
            },
            body: JSON.stringify({
              amount_minor: 500,
              currency: 'ZAR',
              email: 'sandbox-proof@izakhono.invalid',
              description: 'KORA IZAKHONO PAY sandbox proof',
              provider: 'payfast',
              return_url: 'https://kora-network.vercel.app/?payment=return',
              cancel_url: 'https://kora-network.vercel.app/?payment=cancelled'
            })
          });
          const data = await response.json().catch(() => null);
          if (!response.ok || !data?.ok) throw new Error(`Intent creation failed (${response.status})`);
          const intent = data.intent || {};
          if (intent.routed_provider !== 'payfast') throw new Error('KORA did not route to PayFast');
          if (intent.checkout_method !== 'form_post') throw new Error('PayFast checkout method is not form_post');
          if (intent.checkout_url !== 'https://sandbox.payfast.co.za/eng/process') throw new Error('Checkout is not pointing at PayFast sandbox');
          if (!intent.form_fields?.signature || intent.form_fields?.merchant_id !== '10004002') throw new Error('Signed PayFast form fields were not generated');
          console.log(JSON.stringify({
            ok: true,
            app: 'kora',
            amount: 'R5.00',
            provider: intent.routed_provider,
            checkout_method: intent.checkout_method,
            checkout_url: intent.checkout_url,
            intent_id: intent.id,
            reference: intent.reference
          }));
          NODE
          echo 'KORA → IZAKHONO PAY → PayFast sandbox checkout initialization passed.' >> "$GITHUB_STEP_SUMMARY"
