name: Deploy IZAKHONO PAY Sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-pay/**'
      - '.github/workflows/izakhono-pay-sandbox-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-pay-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: izakhono-pay-sandbox
    defaults:
      run:
        working-directory: products/izakhono-pay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SECRET: ${{ secrets.IZAKHONO_PAY_ADMIN_SECRET }}
      # Official public PayFast sandbox credentials. These never move real money.
      PAYFAST_MERCHANT_ID: '10004002'
      PAYFAST_MERCHANT_KEY: 'q1cd2rdny4a53'
      PAYFAST_PASSPHRASE: 'payfast'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sandbox deploy tooling
        run: npm install --no-audit --no-fund

      - name: Verify payment core before deployment
        run: npm run check

      - name: Prepare sandbox admin secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_SECRET:-}" ]; then
            generated="$(openssl rand -hex 32)"
            echo "::add-mask::$generated"
            echo "ADMIN_SECRET=$generated" >> "$GITHUB_ENV"
            echo 'Using an ephemeral sandbox admin secret for this proof run.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require Cloudflare deployment connection
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Cloudflare secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Add the two Cloudflare GitHub Actions secrets, then re-run this sandbox workflow.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Bootstrap Worker and auto-provision sandbox D1
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --yes --config wrangler.sandbox.jsonc

      - name: Install server-only payment secrets
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.sandbox.jsonc >/dev/null
          }
          put_secret ADMIN_SECRET "$ADMIN_SECRET"
          put_secret PAYFAST_MERCHANT_ID "$PAYFAST_MERCHANT_ID"
          put_secret PAYFAST_MERCHANT_KEY "$PAYFAST_MERCHANT_KEY"
          put_secret PAYFAST_PASSPHRASE "$PAYFAST_PASSPHRASE"

      - name: Final sandbox deployment
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.sandbox.jsonc)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          {
            echo '## IZAKHONO PAY Sandbox'
            echo
            echo 'PayFast-first proof mode: card/EFT integration path, no real money.'
            if [ -n "$url" ]; then
              echo "Sandbox URL: $url"
            else
              echo 'Deployment completed. Open the Wrangler deployment output above for the workers.dev URL.'
            fi
            echo
            echo 'Next gate: provision KORA merchant credentials, run one PayFast sandbox checkout, verify ITN/ledger paid status, then prepare live merchant credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
