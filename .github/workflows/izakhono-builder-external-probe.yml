name: IZAKHONO BUILDER External SUPER APP Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  pull_request:
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IZAKHONO ONE HUB health and manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub'
          health_code="$(curl -sS -L --max-time 20 -o /tmp/one-health.json -w '%{http_code}' "$BASE/health")"
          test "$health_code" = "200"
          grep -q '"service":"IZAKHONO ONE HUB"' /tmp/one-health.json
          grep -q '"status":"healthy"' /tmp/one-health.json
          manifest_code="$(curl -sS -L --max-time 20 -o /tmp/one-manifest.json -w '%{http_code}' "$BASE/manifest")"
          test "$manifest_code" = "200"
          grep -q '"identity":"IZAKHONO ONE"' /tmp/one-manifest.json
          grep -q '"slug":"search"' /tmp/one-manifest.json
          grep -q '"slug":"fortress"' /tmp/one-manifest.json
          echo "IZAKHONO_ONE_HUB_HEALTH=PASS"
          echo "IZAKHONO_ONE_HUB_MANIFEST=PASS"

      - name: Probe ONE foundation API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub/api/foundation'
          code="$(curl -sS -L --max-time 20 -o /tmp/one-foundation.json -w '%{http_code}' "$URL")"
          test "$code" = "200"
          grep -q '"serviceBus":{"status":"ready"' /tmp/one-foundation.json
          grep -q '"security":{"status":"ready"' /tmp/one-foundation.json
          grep -q '"parallelPillars":7' /tmp/one-foundation.json
          echo "IZAKHONO_ONE_FOUNDATION_API=PASS"
