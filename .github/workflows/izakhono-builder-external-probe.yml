name: IZAKHONO ONE External Hub Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  pull_request:
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live IZAKHONO ONE public hub
        shell: bash
        run: |
          set -euo pipefail
          HUB='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub'
          code="$(curl -sS -L --max-time 20 -o /tmp/one-hub.json -w '%{http_code}' "$HUB")"
          test "$code" = "200"
          grep -q '"service":"IZAKHONO ONE HUB"' /tmp/one-hub.json
          grep -q '"identity":"IZAKHONO ONE"' /tmp/one-hub.json
          grep -q '"controlPlane":"ONE HUB"' /tmp/one-hub.json
          grep -q '"slug":"fortress"' /tmp/one-hub.json
          echo "IZAKHONO_ONE_HUB_EXTERNAL_HTTPS_200=PASS"
          echo "IZAKHONO_ONE_HUB_ARCHITECTURE_IDENTITY=PASS"
          echo "IZAKHONO_BUILDER_PUBLIC_ROUTE=GATED_UNTIL_INDEPENDENTLY_VERIFIED"
