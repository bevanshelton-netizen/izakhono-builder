name: IZAKHONO ONE External Hub Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  pull_request:
    paths:
      - '.github/workflows/izakhono-builder-external-probe.yml'
      - 'products/izakhono-one/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live IZAKHONO ONE hub health
        shell: bash
        run: |
          set -euo pipefail
          HUB='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub'
          code="$(curl -sS -L --max-time 20 -o /tmp/one-health.json -w '%{http_code}' "$HUB/health")"
          test "$code" = "200"
          node -e "const x=require('/tmp/one-health.json'); if(x.ok!==true||x.service!=='IZAKHONO ONE HUB'||x.status!=='healthy') process.exit(1)"
          echo "IZAKHONO_ONE_HUB_HEALTH=PASS"

      - name: Probe live hub manifest and architecture identity
        shell: bash
        run: |
          set -euo pipefail
          HUB='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub'
          code="$(curl -sS -L --max-time 20 -o /tmp/one-manifest.json -w '%{http_code}' "$HUB/manifest")"
          test "$code" = "200"
          node -e "const x=require('/tmp/one-manifest.json'); if(x.ok!==true||x.architecture?.identity!=='IZAKHONO ONE'||x.architecture?.controlPlane!=='ONE HUB'||!Array.isArray(x.pillars)||x.pillars.length!==7) process.exit(1)"
          echo "IZAKHONO_ONE_HUB_MANIFEST=PASS"
          echo "IZAKHONO_BUILDER_PUBLIC_ROUTE=GATED_UNTIL_INDEPENDENTLY_VERIFIED"
