name: IZAKHONO Logical Runtime Acceptance Collector

on:
  pull_request:
    paths:
      - 'infra/app-fabric-runtime/node01-physical-acceptance.sh'
      - 'infra/app-fabric-runtime/test-node01-physical-acceptance.sh'
      - 'infra/app-fabric-runtime/runtime-binding.example.json'
      - '.github/workflows/node01-physical-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'infra/app-fabric-runtime/node01-physical-acceptance.sh'
      - 'infra/app-fabric-runtime/test-node01-physical-acceptance.sh'
      - 'infra/app-fabric-runtime/runtime-binding.example.json'
      - '.github/workflows/node01-physical-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify logical runtime acceptance contract
        run: bash infra/app-fabric-runtime/test-node01-physical-acceptance.sh
