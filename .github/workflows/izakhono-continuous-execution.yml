name: IZAKHONO Continuous Execution

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'autonomy/state.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

# Serialize with Continuous Autopilot because both update autonomy/state.json.
concurrency:
  group: izakhono-autonomy-state
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Enforce credits-free native execution
        run: npm run credits-free:guard

      - name: Verify native-only Builder routing
        run: npm run builder:adapter:test

      - name: Validate owned local model runtime contract
        run: npm run model-runtime:validate

      - name: Test owned model runtime provisioner
        run: npm run model-runtime:test

      - name: Run native Builder end-to-end tests
        run: npm run ai-agent:test

      - name: Validate NODE registry freshness
        run: npm run node-registry:test

      - name: Validate owned NODE failover
        run: npm run node-failover:test

      - name: Run continuous execution engine
        id: selector
        continue-on-error: true
        run: |
          set -o pipefail
          node autonomy/runner.mjs | tee "$RUNNER_TEMP/izakhono-autonomy-result.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/izakhono-autonomy-result.json','utf8')); if (r.status === 'blocked_or_waiting') { console.error('Continuous execution is blocked: inspect remaining tasks and adapter evidence.'); process.exit(1); }"

      - name: Persist execution state
        if: always()
        run: |
          if [ ! -s autonomy/state.json ]; then
            echo 'No execution state was produced.'
            exit 0
          fi
          git add -f autonomy/state.json
          if git diff --cached --quiet -- autonomy/state.json; then
            echo 'No execution-state change.'
            exit 0
          fi
          git config user.name 'IZAKHONO Continuous Execution'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(autonomy): persist continuous execution state'
          git push

      - name: Fail when autonomous execution is blocked
        if: steps.selector.outcome == 'failure'
        run: |
          echo 'Continuous execution did not complete its selected work. State has been persisted for recovery.'
          exit 1
