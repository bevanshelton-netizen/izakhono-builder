name: IZAKHONO CODE CI
on:
  pull_request:
    paths: ['products/izakhono-code/**','.github/workflows/izakhono-code-ci.yml']
  push:
    branches: [main]
    paths: ['products/izakhono-code/**','.github/workflows/izakhono-code-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm test
      - name: Smoke test local owner node
        run: |
          IZAKHONO_CODE_DATA="$RUNNER_TEMP/izakhono-code" IZAKHONO_CODE_OWNER_TOKEN=ci-owner-token node src/server.mjs &
          pid=$!
          trap 'kill $pid' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4177/health && break; sleep 1; done
          curl -fsS -H 'x-izakhono-owner-token: ci-owner-token' http://127.0.0.1:4177/api/state
