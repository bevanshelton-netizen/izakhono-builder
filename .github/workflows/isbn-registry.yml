name: ISBN Registry Checks

on:
  pull_request:
    paths:
      - "products/izakhono-isbn/**"
      - "autonomy/software-node.mjs"
      - "autonomy/software-node.test.mjs"
      - "package.json"
      - ".github/workflows/isbn-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isbn-registry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard JavaScript syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("products/izakhono-isbn/public/index.html","utf8"); const start=html.indexOf("<script>"); const end=html.indexOf("</script>",start); if (start < 0 || end < 0) throw new Error("Dashboard script missing"); new Function(html.slice(start+8,end)); console.log("Dashboard JavaScript syntax passed");'
      - name: Run NODE01 software-node lifecycle tests
        run: node autonomy/software-node.test.mjs
      - name: Run ISBN-13 validation tests
        run: npx --yes tsx@4.20.3 products/izakhono-isbn/src/index.test.ts
      - name: Run D1 SQLite migration integrity tests
        run: node --experimental-sqlite products/izakhono-isbn/src/migrations.test.mjs
      - name: Test PostgreSQL compatibility adapter
        run: npx --yes tsx@4.20.3 products/izakhono-isbn/src/postgresql-adapter.test.ts
      - name: Verify PostgreSQL target schema and provider-neutral contract
        run: node products/izakhono-isbn/src/postgresql-contract.test.mjs
      - name: Check self-hosted runtime server syntax
        run: node --check products/izakhono-isbn/runtime/server.mjs
