name: IZAKHONO SPORTS API

on:
  push:
    paths:
      - 'products/izakhono-sports/apps/api/**'
      - 'products/izakhono-sports/security.sql'
      - '.github/workflows/izakhono-sports-api.yml'
  pull_request:
    paths:
      - 'products/izakhono-sports/apps/api/**'
      - 'products/izakhono-sports/security.sql'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-sports/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/izakhono-sports/apps/api/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test
