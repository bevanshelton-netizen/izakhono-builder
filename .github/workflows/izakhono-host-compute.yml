name: IZAKHONO HOST — Compute Fabric CI
on:
  push:
    branches:
      - feat/izakhono-sovereign-compute-fabric-v1
    paths:
      - "products/izakhono-host/**"
      - ".github/workflows/izakhono-host-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/izakhono-host/**"
      - ".github/workflows/izakhono-host-compute.yml"
permissions:
  contents: read
concurrency:
  group: izakhono-host-compute-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compute-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test native HOST runtime
        working-directory: products/izakhono-host/runtime/control-plane
        run: node smoke.mjs
      - name: Validate compute and remote-node scripts
        run: |
          node --check products/izakhono-host/runtime/compute-manager/server.mjs
          node --check products/izakhono-host/runtime/compute-worker/worker.mjs
          node --check products/izakhono-host/runtime/compute-manager/smoke.mjs
          bash -n products/izakhono-host/COMPUTE-ONLY-ACTIVATE.sh
          bash -n products/izakhono-host/ENROLL-COMPUTE-NODE.sh
          bash -n products/izakhono-host/worker-node/ACTIVATE-WORKER.sh
          python3 -m py_compile products/izakhono-host/generate-env-secrets.py
      - name: Install compute manager runtime dependency
        working-directory: products/izakhono-host/runtime/compute-manager
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Test compute manager and real worker
        working-directory: products/izakhono-host/runtime/compute-manager
        run: node smoke.mjs
      - name: Validate owned Docker Compose configuration
        working-directory: products/izakhono-host
        run: |
          docker compose --env-file .env.example -f docker-compose.owned.yml config --quiet
          docker compose --env-file worker-node/.env.example -f worker-node/docker-compose.yml config --quiet
