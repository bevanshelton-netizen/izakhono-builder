name: IZAKHONO NAV Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/izakhono-nav/**'
      - 'infra/contabo/**'
      - 'infra/node01/**'
      - '.github/workflows/izakhono-nav-ci.yml'
  pull_request:
    paths:
      - 'apps/izakhono-nav/**'
      - 'infra/contabo/**'
      - 'infra/node01/**'
      - '.github/workflows/izakhono-nav-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izakhono-nav-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-validation:
    name: NAV runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/izakhono-nav
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check production-smoke-test.js
          node --check driver-companion-ai-provider.js
          node --check driver-companion-ai-route.js
          node --check hey-nav-runtime.js
      - name: Start owned NAV runtime
        run: |
          node server.js > /tmp/izakhono-nav.log 2>&1 &
          echo $! > /tmp/izakhono-nav.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
      - name: Run production smoke test
        run: node production-smoke-test.js http://127.0.0.1:8080
      - name: Validate PWA assets
        run: |
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(m.name!=='IZAKHONO NAV'||m.start_url!=='./'||m.display!=='standalone') process.exit(1); console.log('PWA manifest OK')"
      - name: Validate Docker build
        run: docker build --pull -t izakhono-nav-ci .
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/izakhono-nav.log || true
      - name: Stop runtime
        if: always()
        run: kill $(cat /tmp/izakhono-nav.pid) 2>/dev/null || true

  infrastructure-validation:
    name: Owned infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment assets
        run: |
          test -f apps/izakhono-nav/Dockerfile
          test -f infra/contabo/nav-compose.yml
          test -f infra/contabo/nav-Caddyfile
          test -f infra/contabo/preflight-nav.sh
          test -f infra/contabo/deploy-nav.sh
          test -f infra/contabo/nav-smoke-test.sh
          test -f infra/contabo/verify-nav.sh
          test -f infra/contabo/production-verify-nav.js
          test -f infra/node01/deploy-nav-node01.sh
          test -f infra/node01/verify-node01-nav.sh
          test -f infra/node01/node01-release-manifest.json
          test -f infra/node01/node01-release-receipt.sh
          test -f infra/node01/node01-deploy-guard.sh
          test -f infra/node01/GITHUB-RUNNER-SETUP.md
          echo 'Owned deployment assets present'
      - name: Validate production verifier syntax
        run: node --check infra/contabo/production-verify-nav.js
      - name: Validate NODE01 release manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('infra/node01/node01-release-manifest.json','utf8'));
          if (m.platform !== 'IZAKHONO NAV') throw new Error('Unexpected platform');
          if (m.runtime_target !== 'NODE01') throw new Error('Unexpected runtime target');
          if (m.ownership !== 'IZAKHONO-owned') throw new Error('Unexpected ownership');
          if (!Array.isArray(m.prohibited_runtime_dependencies)) throw new Error('Missing prohibited dependency list');
          if (!m.prohibited_runtime_dependencies.includes('Vercel')) throw new Error('Vercel prohibition missing');
          if (!m.prohibited_runtime_dependencies.includes('Netlify')) throw new Error('Netlify prohibition missing');
          console.log('NODE01 release manifest OK');
          NODE
      - name: Validate compose configuration
        run: docker compose -f infra/contabo/nav-compose.yml config --quiet
      - name: Validate shell scripts
        run: |
          bash -n infra/contabo/preflight-nav.sh
          bash -n infra/contabo/deploy-nav.sh
          bash -n infra/contabo/nav-smoke-test.sh
          bash -n infra/contabo/verify-nav.sh
          bash -n infra/node01/deploy-nav-node01.sh
          bash -n infra/node01/verify-node01-nav.sh
          bash -n infra/node01/node01-release-receipt.sh
          bash -n infra/node01/node01-deploy-guard.sh
          echo 'Infrastructure scripts valid'
