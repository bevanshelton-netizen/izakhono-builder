name: Deploy IZAKHONO PAY Production

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Type IZAKHONO PAY LIVE to deploy the production payment service'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: izakhono-pay-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: izakhono-pay-production
    defaults:
      run:
        working-directory: products/izakhono-pay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SECRET: ${{ secrets.IZAKHONO_PAY_ADMIN_SECRET }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_LIVE_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_LIVE_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_LIVE_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require explicit live confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.confirm_live }}' != 'IZAKHONO PAY LIVE' ]; then
            echo 'Live deployment confirmation did not match.' >&2
            exit 1
          fi

      - name: Install deploy tooling
        run: npm install --no-audit --no-fund

      - name: Verify payment core before production deployment
        run: npm run check

      - name: Require production infrastructure and provider secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_SECRET PAYFAST_MERCHANT_ID PAYFAST_MERCHANT_KEY PAYFAST_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Bootstrap production Worker and D1 fail-closed
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc

      - name: Apply production D1 migrations
        shell: bash
        run: npx wrangler d1 migrations apply izakhono-pay --remote --config wrangler.production.jsonc

      - name: Install server-only live PayFast secrets
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.production.jsonc >/dev/null
          }
          put_secret ADMIN_SECRET "$ADMIN_SECRET"
          put_secret PAYFAST_MERCHANT_ID "$PAYFAST_MERCHANT_ID"
          put_secret PAYFAST_MERCHANT_KEY "$PAYFAST_MERCHANT_KEY"
          put_secret PAYFAST_PASSPHRASE "$PAYFAST_PASSPHRASE"

      - name: Final production deployment
        id: final
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.jsonc)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## IZAKHONO PAY Production'
            echo
            if [ -n "$url" ]; then echo "Production service URL: $url"; fi
            echo 'Live PayFast credentials are installed server-side.'
            echo 'All merchant applications remain staged/fail-closed until individually provisioned and approved.'
            echo 'No customer payment should be solicited until payout-bank verification and the controlled live transaction are completed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health and PayFast capability
        if: steps.final.outputs.worker_url != ''
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.final.outputs.worker_url }}'
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/health" | tee /tmp/izp-health.json
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/v1/capabilities" | tee /tmp/izp-capabilities.json
          grep -q '"service":"IZAKHONO PAY"' /tmp/izp-health.json
          grep -q '"mode":"live"' /tmp/izp-health.json
          grep -q '"payfast"' /tmp/izp-capabilities.json
          grep -q '"configured":true' /tmp/izp-capabilities.json

      - name: Confirm merchant gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute izakhono-pay --remote --config wrangler.production.jsonc --command "SELECT COUNT(*) AS active_merchants FROM merchant_apps WHERE status='active';")"
          printf '%s\n' "$result"
          if ! printf '%s\n' "$result" | grep -Eq '"active_merchants"[[:space:]]*:[[:space:]]*0'; then
            echo 'Production deployment aborted: one or more merchant apps are active before the controlled merchant activation step.' >&2
            exit 1
          fi
