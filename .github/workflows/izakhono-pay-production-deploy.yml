name: Deploy IZAKHONO PAY Production

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Type IZAKHONO PAY PRODUCTION to deploy the production service with payment routing disabled'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: izakhono-pay-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: izakhono-pay-production
    defaults:
      run:
        working-directory: products/izakhono-pay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SECRET: ${{ secrets.IZAKHONO_PAY_ADMIN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require explicit production deployment confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.confirm_live }}' != 'IZAKHONO PAY PRODUCTION' ]; then
            echo 'Production deployment confirmation did not match.' >&2
            exit 1
          fi

      - name: Install deploy tooling
        run: npm install --no-audit --no-fund

      - name: Verify payment core before production deployment
        run: npm run check

      - name: Require production infrastructure secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Require a provisioned production D1 database ID
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.production.jsonc', 'utf8');
          const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, '').replace(/,\s*([}\]])/g, '$1'));
          const database = (config.d1_databases || []).find((entry) => entry.binding === 'DB');
          if (!database?.database_id || !/^[0-9a-f-]{36}$/i.test(database.database_id)) {
            throw new Error('Production D1 is not provisioned: set the verified database_id for binding DB before deployment. No Worker deployment or migration was attempted.');
          }
          console.log('Production D1 database binding is configured.');
          NODE

      - name: Bootstrap production Worker and D1 fail-closed
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc

      - name: Apply production D1 migrations
        shell: bash
        run: npx wrangler d1 migrations apply izakhono-pay --remote --config wrangler.production.jsonc

      - name: Final production deployment
        id: final
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.jsonc)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## IZAKHONO PAY Production'
            echo
            if [ -n "$url" ]; then echo "Production service URL: $url"; fi
            echo 'Production service is deployed with payment routing disabled. Provider credentials are intentionally not installed; provider routing remains disabled.'
            echo 'All merchant applications remain staged/fail-closed until individually provisioned and approved.'
            echo 'No customer payment should be solicited until payout-bank verification and the controlled live transaction are completed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health and iKhokha remains fail-closed
        if: steps.final.outputs.worker_url != ''
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.final.outputs.worker_url }}'
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/health" | tee /tmp/izp-health.json
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/v1/capabilities" | tee /tmp/izp-capabilities.json
          grep -q '"service":"IZAKHONO PAY"' /tmp/izp-health.json
          grep -q '"mode":"disabled"' /tmp/izp-health.json
          grep -q '"ikhokha"' /tmp/izp-capabilities.json
          grep -q '"enabled":false' /tmp/izp-capabilities.json

      - name: Confirm merchant gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute izakhono-pay --remote --config wrangler.production.jsonc --command "SELECT COUNT(*) AS active_merchants FROM merchant_apps WHERE status='active';")"
          printf '%s\n' "$result"
          if ! printf '%s\n' "$result" | grep -Eq '"active_merchants"[[:space:]]*:[[:space:]]*0'; then
            echo 'Production deployment aborted: one or more merchant apps are active before the controlled merchant activation step.' >&2
            exit 1
          fi
