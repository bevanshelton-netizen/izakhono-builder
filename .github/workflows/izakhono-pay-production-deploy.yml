name: Deploy IZAKHONO PAY Fail-Closed Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type IZAKHONO PAY PRODUCTION to deploy the production runtime with all payment providers disabled'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: izakhono-pay-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: izakhono-pay-production
    defaults:
      run:
        working-directory: products/izakhono-pay
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SECRET: ${{ secrets.IZAKHONO_PAY_ADMIN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require explicit fail-closed production confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PRODUCTION" != 'IZAKHONO PAY PRODUCTION' ]; then
            echo 'Production deployment confirmation did not match.' >&2
            exit 1
          fi

      - name: Install deploy tooling
        run: npm install --no-audit --no-fund

      - name: Verify payment core before production deployment
        run: npm run check

      - name: Require production infrastructure secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ADMIN_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Resolve existing production D1 binding without creating resources
        run: >-
          node scripts/resolve-d1-binding.mjs
          --config wrangler.production.jsonc
          --output wrangler.production.resolved.jsonc
          --database izakhono-pay
          --binding DB

      - name: Bootstrap fail-closed production Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.resolved.jsonc

      - name: Apply production D1 migrations
        shell: bash
        run: npx wrangler d1 migrations apply izakhono-pay --remote --config wrangler.production.resolved.jsonc

      - name: Install server-only operator secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET --config wrangler.production.resolved.jsonc >/dev/null

      - name: Final fail-closed production deployment
        id: final
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler deploy --config wrangler.production.resolved.jsonc)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)"
          if [ -z "$url" ]; then
            echo 'Worker deployment did not return a workers.dev URL.' >&2
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## IZAKHONO PAY — Fail-Closed Production Runtime'
            echo
            echo "Production service URL: $url"
            echo 'All payment providers remain disabled. No live payment can be initiated.'
            echo 'Merchant applications remain staged until individually verified and approved.'
            echo 'The custom-domain cutover and real-money activation are separate release gates.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health and all providers remain disabled
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.final.outputs.worker_url }}'
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/health" | tee /tmp/izp-health.json
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$base/api/v1/capabilities" | tee /tmp/izp-capabilities.json
          grep -q '"service":"IZAKHONO PAY"' /tmp/izp-health.json
          grep -q '"mode":"live"' /tmp/izp-health.json
          grep -q '"ikhokha":{"enabled":false,"configured":false}' /tmp/izp-capabilities.json
          grep -q '"paystack":{"enabled":false,"configured":false}' /tmp/izp-capabilities.json
          grep -q '"payfast":{"enabled":false,"configured":false' /tmp/izp-capabilities.json

      - name: Confirm merchant gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute izakhono-pay --remote --config wrangler.production.resolved.jsonc --command "SELECT COUNT(*) AS active_merchants FROM merchant_apps WHERE status='active';")"
          printf '%s\n' "$result"
          if ! printf '%s\n' "$result" | grep -Eq '"active_merchants"[[:space:]]*:[[:space:]]*0'; then
            echo 'Production deployment aborted: one or more merchant apps are active before the controlled merchant activation step.' >&2
            exit 1
          fi
