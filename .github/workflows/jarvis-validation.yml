name: JARVIS validation

on:
  pull_request:
    paths:
      - "src/jarvis.ts"
      - "src/sovereign.ts"
      - "public/jarvis/**"
      - "products/izakhono-jarvis/**"
      - "package.json"
      - ".github/workflows/jarvis-validation.yml"
  push:
    branches:
      - "feature/izakhono-jarvis-foundation"
    paths:
      - "src/jarvis.ts"
      - "src/sovereign.ts"
      - "public/jarvis/**"
      - "products/izakhono-jarvis/**"
      - "package.json"
      - ".github/workflows/jarvis-validation.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check JARVIS API
        run: npm run jarvis:typecheck
      - name: Validate browser JavaScript syntax
        run: node --check public/jarvis/jarvis.js
