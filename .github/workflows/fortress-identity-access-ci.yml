name: fortress-identity-access-ci

on:
  push:
    paths:
      - 'products/fortress-security/src/access-control.ts'
      - 'products/fortress-security/src/access-control.test.ts'
      - 'products/fortress-security/src/audit-log.ts'
      - 'products/fortress-identity/**'
      - '.github/workflows/fortress-identity-access-ci.yml'
  pull_request:
    paths:
      - 'products/fortress-security/src/access-control.ts'
      - 'products/fortress-security/src/access-control.test.ts'
      - 'products/fortress-security/src/audit-log.ts'
      - 'products/fortress-identity/**'
      - '.github/workflows/fortress-identity-access-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4.20.3 products/fortress-security/src/access-control.test.ts
      - name: Test FORTRESS DEPLOY capability routes and D1 audit rollback
        run: npx --yes tsx@4.20.3 products/fortress-identity/test/deploy-access.test.mjs
      - name: Validate FORTRESS DEPLOY capability D1 migration
        run: python3 -m unittest discover -s products/fortress-identity/test -p 'test_migration.py' -v
