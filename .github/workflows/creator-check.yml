name: IZAKHONO Creator Check

on:
  push:
    paths:
      - 'products/izakhono-creator/**'
  pull_request:
    paths:
      - 'products/izakhono-creator/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit --skipLibCheck --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext --moduleResolution bundler products/izakhono-creator/src/index.ts products/izakhono-creator/src/cinematic-production-graph.ts products/izakhono-creator/src/cinematic-brief-compiler.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-creator/src/cinematic-production-graph.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-creator/src/cinematic-brief-compiler.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-creator/src/one-workflow.test.ts
