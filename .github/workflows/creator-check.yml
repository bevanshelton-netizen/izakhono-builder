name: IZAKHONO Creator Check

on:
  push:
    paths:
      - 'products/izakhono-creator/**'
  pull_request:
    paths:
      - 'products/izakhono-creator/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext products/izakhono-creator/src/index.ts
