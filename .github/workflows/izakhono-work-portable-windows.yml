name: IZAKHONO WORK Portable Windows

on:
  pull_request:
    paths:
      - 'products/izakhono-work/app.py'
      - 'products/izakhono-work/builder_core.py'
      - 'products/izakhono-work/portable-windows/**'
      - '.github/workflows/izakhono-work-portable-windows.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-work/app.py'
      - 'products/izakhono-work/builder_core.py'
      - 'products/izakhono-work/portable-windows/**'
      - '.github/workflows/izakhono-work-portable-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official portable Python
        shell: pwsh
        run: |
          $url = 'https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath bundle

      - name: Add IZAKHONO WORK runtime
        shell: pwsh
        run: |
          Copy-Item products/izakhono-work/app.py bundle/app.py
          Copy-Item products/izakhono-work/builder_core.py bundle/builder_core.py
          Copy-Item products/izakhono-work/portable-windows/START-IZAKHONO-WORK.ps1 bundle/START-IZAKHONO-WORK.ps1
          Copy-Item products/izakhono-work/portable-windows/START-IZAKHONO-WORK.cmd bundle/START-IZAKHONO-WORK.cmd
          Copy-Item products/izakhono-work/portable-windows/VERIFY-OWNER-NODE.ps1 bundle/VERIFY-OWNER-NODE.ps1
          Copy-Item products/izakhono-work/portable-windows/VERIFY-OWNER-NODE.cmd bundle/VERIFY-OWNER-NODE.cmd
          Copy-Item products/izakhono-work/portable-windows/IZAKHONO-WORK-ONE-CLICK.cmd bundle/IZAKHONO-WORK-ONE-CLICK.cmd

      - name: Smoke test portable Python and builder
        shell: pwsh
        run: |
          Push-Location bundle
          .\python.exe -c "import sqlite3, json, pathlib; import app, builder_core; assert app.WORK_VERSION == '0.2.2'; print('IZAKHONO_PORTABLE_IMPORT=PASS')"
          .\python.exe ..\products\izakhono-work\test_builder.py
          Pop-Location

      - name: Validate one-click bootstrap contract
        shell: pwsh
        run: |
          $cmd = Get-Content products/izakhono-work/portable-windows/IZAKHONO-WORK-ONE-CLICK.cmd -Raw
          if ($cmd -notmatch '67b976b5427656f81f7ac76a00301f41d8879368') { throw 'One-click source is not commit-pinned.' }
          if ($cmd -notmatch 'VERIFY-OWNER-NODE.ps1') { throw 'One-click verifier handoff is missing.' }
          if ($cmd -match 'Add-MpPreference|Set-MpPreference|exclusion|DisableRealtimeMonitoring') { throw 'Security bypass detected.' }
          Write-Host 'IZAKHONO_ONE_CLICK_CONTRACT=PASS'

      - name: Create portable owner ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path bundle\* -DestinationPath IZAKHONO-WORK-PORTABLE-OWNER-0.2.2.zip -CompressionLevel Optimal

      - name: Upload portable owner bundle
        uses: actions/upload-artifact@v4
        with:
          name: IZAKHONO-WORK-PORTABLE-OWNER-0.2.2
          path: IZAKHONO-WORK-PORTABLE-OWNER-0.2.2.zip
          if-no-files-found: error
          retention-days: 30
