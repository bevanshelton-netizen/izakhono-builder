name: PocketPOS Controlled Pilot Deploy

on:
  push:
    branches:
      - feat/izakhono-pocket-pos
    paths:
      - 'apps/izakhono-pocket-pos/**'
      - '.github/workflows/pocketpos-pilot-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketpos-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deployment credential gate
        id: gate
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "POCKETPOS_DEPLOY_GATE=READY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "POCKETPOS_DEPLOY_GATE=BLOCKED_CLOUDFLARE_CREDENTIALS"
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: steps.gate.outputs.ready == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate PocketPOS
        if: steps.gate.outputs.ready == 'true'
        run: |
          node --check apps/izakhono-pocket-pos/src/worker.mjs
          node --check apps/izakhono-pocket-pos/public/sw.js
          node apps/izakhono-pocket-pos/test.mjs
          sqlite3 /tmp/pocketpos.db < apps/izakhono-pocket-pos/migrations/0001_pocketpos.sql
          test "$(sqlite3 /tmp/pocketpos.db 'PRAGMA integrity_check;')" = "ok"

      - name: Find or create isolated D1 database
        if: steps.gate.outputs.ready == 'true'
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=x.find(v=>v.name==='izakhono-pocket-pos');if(d)process.stdout.write(d.uuid||d.id||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create izakhono-pocket-pos
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=x.find(v=>v.name==='izakhono-pocket-pos');if(d)process.stdout.write(d.uuid||d.id||'')")"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve PocketPOS D1 database id."
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved isolated PocketPOS D1 database."

      - name: Build ephemeral deploy config
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        working-directory: apps/izakhono-pocket-pos
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const id=process.env.DB_ID;
          const src=fs.readFileSync('wrangler.jsonc','utf8');
          if(!src.includes('POCKETPOS_D1_ID')) throw new Error('D1 placeholder missing');
          fs.writeFileSync('.wrangler.deploy.jsonc',src.replace('POCKETPOS_D1_ID',id));
          NODE

      - name: Apply PocketPOS D1 migration
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/izakhono-pocket-pos
        run: npx wrangler d1 migrations apply DB --remote -c .wrangler.deploy.jsonc

      - name: Deploy independent PocketPOS engine
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        shell: bash
        working-directory: apps/izakhono-pocket-pos
        run: |
          set -o pipefail
          npx wrangler deploy -c .wrangler.deploy.jsonc 2>&1 | tee /tmp/pocketpos-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/pocketpos-deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "Deployment completed but workers.dev URL could not be parsed."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PocketPOS candidate URL: $URL"

      - name: External HTTPS health probe
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/api/health" || true)"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(!x.ok||x.service!=='IZAKHONO PocketPOS Engine')process.exit(1)"
              echo "POCKETPOS_HTTPS_HEALTH=VERIFIED"
              exit 0
            fi
            sleep 5
          done
          echo "PocketPOS HTTPS health probe failed."
          exit 1

      - name: Deployment evidence
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## IZAKHONO PocketPOS pilot deployment"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Isolated D1: configured"
            echo "- Worker URL: $URL"
            echo "- HTTPS health: verified"
            echo "- Merchant activation: not performed by CI"
            echo "- iKhokha production credentials/payment acceptance: not assumed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record blocked deployment
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "PocketPOS deployment was not attempted because Cloudflare repository credentials are unavailable."
