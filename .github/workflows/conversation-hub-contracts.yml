name: IZAKHONO Conversation Hub Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'products/izakhono-communications/**'
      - 'docs/communications/**'
      - '.github/workflows/conversation-hub-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-communications/**'
      - 'docs/communications/**'
      - '.github/workflows/conversation-hub-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Conversation Hub contracts
        run: npx --yes tsx@4.20.3 products/izakhono-communications/src/conversation-hub-contracts.test.ts
      - name: Typecheck Conversation Hub contracts
        run: npx --yes --package typescript@5.9.2 tsc --noEmit --target ES2022 --lib ES2022,DOM --module NodeNext --moduleResolution NodeNext products/izakhono-communications/src/conversation-hub-contracts.ts products/izakhono-communications/src/conversation-hub-contracts.test.ts
