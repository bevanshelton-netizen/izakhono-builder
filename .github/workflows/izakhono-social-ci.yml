name: CONNECTA CI

on:
  push:
    branches:
      - 'product/connecta-*'
    paths:
      - 'products/izakhono-social/**'
      - '.github/workflows/izakhono-social-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-social/**'
      - '.github/workflows/izakhono-social-ci.yml'

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-social
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/izakhono-social/package.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck
      - name: Production build web
        run: npm run build

  verify-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-social/engine
    env:
      CONNECTA_REGISTER_RATE_LIMIT: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engine dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build sovereign engine image
        working-directory: products/izakhono-social
        run: docker build -f engine/Dockerfile -t connecta-engine:ci .
      - name: Validate owned and portable compose stacks
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: |
          docker compose -f docker-compose.owned.yml config
          docker compose -f docker-compose.portable.yml config
      - name: Boot owned CONNECTA stack
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
          CONNECTA_PORT: '3080'
        run: docker compose -f docker-compose.owned.yml up -d --build postgres engine web
      - name: Verify CONNECTA ENGINE health
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.owned.yml exec -T engine node -e "fetch('http://127.0.0.1:4100/health').then(async r=>{if(!r.ok)process.exit(1); const j=await r.json(); if(j.database!=='ok'||j.storage!=='ok'||j.providerIndependent!==true||j.productEngine!=='CONNECTA'||j.dependsOnAnotherProductEngine!==false||j.externalServicesReplaceableAdaptersOnly!==true||j.behaviouralTracking!==false) process.exit(1)})"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.owned.yml logs engine postgres
          exit 1
      - name: Verify engine-owned schema bootstrap
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: |
          FILES=$(find db -maxdepth 1 -type f -name '[0-9]*.sql' | wc -l | tr -d '[:space:]')
          APPLIED=$(docker compose -f docker-compose.owned.yml exec -T postgres psql -U connecta -d connecta -Atc "select count(*) from connecta_schema_migrations;" | tr -d '[:space:]')
          test "$APPLIED" = "$FILES"
          TABLES=$(docker compose -f docker-compose.owned.yml exec -T postgres psql -U connecta -d connecta -Atc "select count(*) from information_schema.tables where table_schema='public';" | tr -d '[:space:]')
          test "$TABLES" -ge 20
      - name: Verify web-to-engine secure runtime
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
          CONNECTA_WEB_URL: http://127.0.0.1:3080
        run: |
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:3080/health >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-web-runtime.mjs
      - name: Verify recovery scripts
        working-directory: products/izakhono-social
        run: bash -n ops/backup.sh ops/restore-test.sh ops/restore.sh
      - name: Prove non-destructive backup and restore
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
          CONNECTA_COMPOSE_PROJECT: izakhono-social
        run: |
          rm -rf /tmp/connecta-ci-backups
          mkdir -p /tmp/connecta-ci-backups
          bash ops/backup.sh /tmp/connecta-ci-backups | tee /tmp/connecta-backup.log
          BACKUP_DIR="$(tail -n 1 /tmp/connecta-backup.log)"
          test -d "$BACKUP_DIR"
          bash ops/restore-test.sh "$BACKUP_DIR"
      - name: Exercise growth flywheel
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml exec -T engine node scripts/smoke-growth.js
      - name: Exercise zero-tolerance safety
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml exec -T engine node scripts/smoke-safety.js
      - name: Exercise content-owner alerts
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml exec -T engine node scripts/smoke-content-alerts.js
      - name: Exercise evidence-backed business verification
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml exec -T engine node scripts/smoke-business-verification.js
      - name: Exercise altered-image owner protection
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml exec -T engine node scripts/smoke-perceptual-media.js
      - name: Show logs on failure
        if: failure()
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml logs engine postgres || true
      - name: Stop owned stack
        if: always()
        working-directory: products/izakhono-social
        env:
          CONNECTA_DB_PASSWORD: ci-only-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f docker-compose.owned.yml down -v || true
