name: J.A.R.V.I.S. isolated validation

on:
  push:
    branches: [release/jarvis-mainline-port]
    paths:
      - "products/izakhono-jarvis/**"
      - "src/sovereign.ts"
      - "public/jarvis/**"
      - ".github/workflows/jarvis-mainline-validation.yml"
  pull_request:
    paths:
      - "products/izakhono-jarvis/**"
      - "src/sovereign.ts"
      - ".github/workflows/jarvis-mainline-validation.yml"

permissions:
  contents: read

jobs:
  jarvis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/api.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/agents.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/tasks.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/context.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/approvals.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/workspace.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/orchestration.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/reasoning.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/mainframe.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/briefing.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/conversations.test.ts
      - run: npx --yes tsx@4.20.3 products/izakhono-jarvis/src/workforce.test.ts
      - run: node products/izakhono-jarvis/runner/worker.test.mjs
      - run: node products/izakhono-jarvis/runner/supervisor.test.mjs
      - run: node --check products/izakhono-jarvis/runner/worker.mjs
      - run: node --check public/jarvis/app.js
      - run: npx --yes -p typescript@5.9.2 tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext products/izakhono-jarvis/src/api.ts products/izakhono-jarvis/src/agents.ts products/izakhono-jarvis/src/tasks.ts products/izakhono-jarvis/src/context.ts products/izakhono-jarvis/src/approvals.ts products/izakhono-jarvis/src/workspace.ts products/izakhono-jarvis/src/orchestration.ts products/izakhono-jarvis/src/reasoning.ts products/izakhono-jarvis/src/mainframe.ts products/izakhono-jarvis/src/briefing.ts products/izakhono-jarvis/src/conversations.ts products/izakhono-jarvis/src/workforce.ts
      - name: Validate J.A.R.V.I.S. D1 migration sequence and SQL
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(pathlib.Path("migrations").glob("00[2-3]*_jarvis_*.sql"))
          expected = [f"{n:04d}" for n in range(25, 32)]
          actual = [p.name[:4] for p in migrations]
          if actual != expected:
              raise SystemExit(f"Expected J.A.R.V.I.S. migration versions {expected}, found {actual}")
          for migration in migrations:
              db.executescript(migration.read_text())
              print(f"PASS {migration.name}")
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"jarvis_tasks","jarvis_context_items","jarvis_task_context","jarvis_action_proposals","jarvis_proposal_decisions","jarvis_audit_events","jarvis_conversations","jarvis_messages","jarvis_orchestration_runs","jarvis_orchestration_steps"}
          missing = required - tables
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))
          columns = {r[1] for r in db.execute("PRAGMA table_info(jarvis_orchestration_steps)")}
          required_columns = {"attempts","max_attempts","lease_owner","lease_until","last_error","evidence_json","updated_at","owner_verification","owner_review_note","reviewed_at"}
          if required_columns - columns:
              raise SystemExit("Missing workforce columns: " + ", ".join(sorted(required_columns-columns)))
          print("PASS all seven J.A.R.V.I.S. migrations applied in order")
          PY
      - name: Check production configuration presence without exposing values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JARVIS_OWNER_SECRET: ${{ secrets.JARVIS_OWNER_SECRET }}
          JARVIS_EXECUTOR_URL: ${{ secrets.JARVIS_EXECUTOR_URL }}
          JARVIS_EXECUTOR_TOKEN: ${{ secrets.JARVIS_EXECUTOR_TOKEN }}
          JARVIS_EXECUTOR_ALLOWED_HOSTS: ${{ vars.JARVIS_EXECUTOR_ALLOWED_HOSTS }}
          IZAKHONO_SUPER_AI_URL: ${{ secrets.IZAKHONO_SUPER_AI_URL }}
          IZAKHONO_SUPER_AI_INTERNAL_KEY: ${{ secrets.IZAKHONO_SUPER_AI_INTERNAL_KEY }}
          IZAKHONO_SUPER_AI_WORKFLOW_KEY: ${{ secrets.IZAKHONO_SUPER_AI_WORKFLOW_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JARVIS_OWNER_SECRET JARVIS_EXECUTOR_URL JARVIS_EXECUTOR_TOKEN JARVIS_EXECUTOR_ALLOWED_HOSTS IZAKHONO_SUPER_AI_URL IZAKHONO_SUPER_AI_INTERNAL_KEY IZAKHONO_SUPER_AI_WORKFLOW_KEY; do
            if [ -n "${!name}" ]; then echo "$name=present"; else echo "$name=missing"; fi
          done
      - name: Verify Cloudflare Worker bundle
        run: npx --yes wrangler@4.127.1 deploy --dry-run
      - name: Inspect remote D1 migration state (read-only)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.1 d1 migrations list DB --remote
