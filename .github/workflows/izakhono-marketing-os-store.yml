name: IZAKHONO MARKETING OS STORE CI

on:
  pull_request:
    paths:
      - "products/izakhono-marketing-os/src/execution-store.ts"
      - "products/izakhono-marketing-os/src/execution-store.test.ts"
      - "products/izakhono-marketing-os/src/execution-recovery.ts"
      - "products/izakhono-marketing-os/src/execution-reliability.ts"
      - ".github/workflows/izakhono-marketing-os-store.yml"
  push:
    branches: [main]
    paths:
      - "products/izakhono-marketing-os/src/execution-store.ts"
      - "products/izakhono-marketing-os/src/execution-store.test.ts"
      - "products/izakhono-marketing-os/src/execution-recovery.ts"
      - "products/izakhono-marketing-os/src/execution-reliability.ts"
      - ".github/workflows/izakhono-marketing-os-store.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate execution store
        run: npx --yes tsx@4.20.3 products/izakhono-marketing-os/src/execution-store.test.ts
      - name: Typecheck execution persistence boundary
        run: npx --yes typescript@5.9.2 --noEmit --target ES2022 --module ESNext products/izakhono-marketing-os/src/execution-reliability.ts products/izakhono-marketing-os/src/execution-recovery.ts products/izakhono-marketing-os/src/execution-store.ts
