name: CONNECTA Engine Image

on:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-social/engine/**'
      - 'products/izakhono-social/db/**'
      - 'products/izakhono-social/engine/Dockerfile'
      - '.github/workflows/connecta-engine-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: connecta-engine-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CONNECTA ENGINE
        id: image
        uses: docker/build-push-action@v6
        with:
          context: products/izakhono-social
          file: products/izakhono-social/engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/connecta-engine:0.3.0
            ghcr.io/${{ github.repository_owner }}/connecta-engine:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Render digest-matched K3s runtime release bundle
        shell: bash
        env:
          CONNECTA_ENGINE_IMAGE: ghcr.io/${{ github.repository_owner }}/connecta-engine:0.3.0@${{ steps.image.outputs.digest }}
        run: bash infra/node-cluster/RENDER-CONNECTA-RUNTIME-RELEASE.sh dist/connecta-runtime-release

      - name: Publish immutable runtime release bundle
        uses: actions/upload-artifact@v4
        with:
          name: connecta-runtime-release-${{ github.sha }}
          path: dist/connecta-runtime-release/
          if-no-files-found: error
          retention-days: 30
