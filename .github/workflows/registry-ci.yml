name: IZAKHONO Registry CI
on:
  push:
    paths:
      - "registry/**"
      - "migrations/**"
      - "package.json"
      - "tsconfig.json"
      - "registry/wrangler.jsonc"
  pull_request:
    paths:
      - "registry/**"
      - "migrations/0008_registry_core.sql"
      - "package.json"
      - "tsconfig.json"
      - "registry/wrangler.jsonc"
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run registry:typecheck
      - run: npm run registry:dry
