name: IZAKHONO Continuous Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Both schedulers mutate autonomy/state.json. Serialize them against one another.
concurrency:
  group: izakhono-autonomy-state
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('autonomy/engine-manifest.json','utf8')); console.log('manifest valid')"

      - name: Run continuous selector
        id: selector
        continue-on-error: true
        run: |
          set -o pipefail
          node autonomy/runner.mjs | tee "$RUNNER_TEMP/izakhono-autonomy-result.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/izakhono-autonomy-result.json','utf8')); if (r.status === 'blocked_or_waiting') { console.error('Autopilot is blocked: inspect remaining tasks and adapter evidence.'); process.exit(1); }"

      - name: Persist execution state
        if: always()
        run: |
          if [ ! -s autonomy/state.json ]; then
            echo 'No execution state was produced.'
            exit 0
          fi
          git add -f autonomy/state.json autonomy/agent-state.json autonomy/agent-queue.json
          if git diff --cached --quiet -- autonomy/state.json autonomy/agent-state.json autonomy/agent-queue.json; then
            echo 'No execution-state change.'
            exit 0
          fi
          git config user.name 'IZAKHONO Autopilot'
          git config user.email 'autopilot@izakhono.africa'
          git commit -m 'chore: persist IZAKHONO autonomous execution state'
          git push

      - name: Fail when autonomous execution is blocked
        if: steps.selector.outcome == 'failure'
        run: |
          echo 'Autonomous execution did not complete its selected work. State has been persisted for recovery.'
          exit 1
