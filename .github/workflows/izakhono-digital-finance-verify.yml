name: IZAKHONO Digital Finance Verify

on:
  pull_request:
    paths:
      - "apps/izakhono-digital-finance/**"
      - ".github/workflows/izakhono-digital-finance-verify.yml"
  push:
    branches:
      - main
    paths:
      - "apps/izakhono-digital-finance/**"
      - ".github/workflows/izakhono-digital-finance-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/izakhono-digital-finance
    steps:
      - uses: actions/checkout@v4

      - name: Verify product contract and privacy boundary
        run: |
          python verify.py
          python test_automation.py
          python test_automation_store.py
          python test_zero_touch.py

      - name: Start independent engine
        run: |
          cat > /tmp/izakhono-df-question-bank.json <<'JSON'
          {
            "schema":"izakhono.digital.finance.question-bank.v1",
            "assessments":[
              {
                "id":"baseline",
                "title":"Synthetic CI baseline",
                "type":"baseline",
                "questions":[
                  {"id":"q1","domain":"payments","prompt":"Synthetic CI question","options":["A","B"],"correct_option":"B"}
                ]
              }
            ]
          }
          JSON
          IZAKHONO_DF_ADMIN_TOKEN=ci-admin-token \
          IZAKHONO_DF_LEARNER_SIGNING_KEY=ci-learner-signing-key \
          IZAKHONO_DF_CREDENTIAL_SIGNING_KEY=ci-credential-signing-key \
          IZAKHONO_DF_QUESTION_BANK=/tmp/izakhono-df-question-bank.json \
          IZAKHONO_DF_STATE_DB=/tmp/izakhono-df-ci.sqlite3 \
          python engine.py > /tmp/izakhono-df.log 2>&1 &
          echo $! > /tmp/izakhono-df.pid

      - name: Smoke test owned-engine routes
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "OK"
          curl -fsS http://127.0.0.1:8080/api/v1/status | python -m json.tool
          curl -fsS http://127.0.0.1:8080/api/v1/catalog | python -m json.tool > /tmp/catalog.json
          curl -fsS http://127.0.0.1:8080/api/v1/institutions | python -m json.tool > /tmp/institutions.json
          curl -fsS http://127.0.0.1:8080/api/v1/locales | python -m json.tool > /tmp/locales.json
          curl -fsS http://127.0.0.1:8080/api/v1/offers | python -m json.tool > /tmp/offers.json
          curl -fsS http://127.0.0.1:8080/api/v1/automation | python -m json.tool > /tmp/automation.json
          curl -fsS http://127.0.0.1:8080/api/v1/assessment-blueprint | python -m json.tool > /tmp/assessment-blueprint.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/automation/evaluate             -H 'Content-Type: application/json'             -d '{"learner_ref":"ci-demo","stage":"baseline","role":"compliance_risk","baseline_score":55}'             | python -m json.tool > /tmp/automation-decision.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/automation/evaluate             -H 'Content-Type: application/json'             -d '{"learner_ref":"ci-review","stage":"learning","exception_codes":["SECURITY_OR_FRAUD_SIGNAL"]}'             | python -m json.tool > /tmp/governance-decision.json
          grep -q '"engine":"independent"' <(curl -fsS http://127.0.0.1:8080/api/v1/status)
          grep -q 'IZAKHONO Digital Finance Academy' /tmp/catalog.json
          grep -q 'Banks & Payment Institutions' /tmp/institutions.json
          grep -q '"ar"' /tmp/locales.json
          grep -q 'Institutional Workforce Academy' /tmp/offers.json
          grep -q 'automated_normal_path_human_governance_exceptions' /tmp/automation.json
          grep -q '"path": "foundation"' /tmp/automation-decision.json
          grep -q '"decision": "human_review"' /tmp/governance-decision.json
          test "$(curl -s -o /tmp/noauth.json -w '%{http_code}' 'http://127.0.0.1:8080/api/v1/admin/automation/report?institution_ref=ci-bank')" = "401"
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/admin/automation/event -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' -d '{"institution_ref":"ci-bank","learner_ref":"ci-employee","stage":"learning","role":"representative_adviser","completed_modules":1,"total_modules":4}' | python -m json.tool > /tmp/stateful-decision.json
          curl -fsS -H 'Authorization: Bearer ci-admin-token' 'http://127.0.0.1:8080/api/v1/admin/automation/report?institution_ref=ci-bank' | python -m json.tool > /tmp/institution-report.json
          curl -fsS -H 'Authorization: Bearer ci-admin-token' 'http://127.0.0.1:8080/api/v1/admin/automation/outbox?institution_ref=ci-bank' | python -m json.tool > /tmp/outbox.json
          grep -q '"learners": 1' /tmp/institution-report.json
          grep -q '"stage": "learning"' /tmp/stateful-decision.json
          grep -q 'schedule_reminder_event' /tmp/outbox.json
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/admin/institution/license \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d '{"institution_ref":"ci-zero-touch-bank","active":true,"seat_limit":2,"product_id":"fais-employee-empowerment","price_per_employee":1000}' \
            | python -m json.tool > /tmp/license.json
          grep -q '"price_per_employee": 1000' /tmp/license.json

          curl -fsS -X POST http://127.0.0.1:8080/api/v1/admin/roster/provision \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d '{"institution_ref":"ci-zero-touch-bank","learners":[{"learner_ref":"ci-learner-1","role":"representative_adviser"}]}' \
            | python -m json.tool > /tmp/roster.json
          grep -q '"provisioned": 1' /tmp/roster.json

          curl -fsS -X POST http://127.0.0.1:8080/api/v1/admin/learner/access-token \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d '{"institution_ref":"ci-zero-touch-bank","learner_ref":"ci-learner-1","ttl_seconds":3600}' \
            > /tmp/access-token.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/access-token.json"))
          assert d["ok"] is True and d["access_token"]
          open("/tmp/access-token.txt","w").write(d["access_token"])
          PY
          ACCESS_TOKEN="$(cat /tmp/access-token.txt)"

          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            'http://127.0.0.1:8080/api/v1/learner/me' \
            | python -m json.tool > /tmp/learner-me.json
          grep -q '"learner_ref": "ci-learner-1"' /tmp/learner-me.json

          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            'http://127.0.0.1:8080/api/v1/learner/assessment?assessment_id=baseline' \
            | python -m json.tool > /tmp/baseline.json
          grep -q 'Synthetic CI question' /tmp/baseline.json
          test "$(grep -c 'correct_option' /tmp/baseline.json)" = "0"

          curl -fsS -X POST http://127.0.0.1:8080/api/v1/learner/assessment/submit \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"assessment_id":"baseline","answers":{"q1":"B"}}' \
            | python -m json.tool > /tmp/scored-baseline.json
          grep -q '"percent": 100' /tmp/scored-baseline.json
          grep -q '"decision": "assign_learning_path"' /tmp/scored-baseline.json

          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            'http://127.0.0.1:8080/api/v1/learner/actions' \
            | python -m json.tool > /tmp/learner-actions.json
          grep -q 'learner_provisioned' /tmp/learner-actions.json

          test "$(curl -s -o /tmp/pii-reject.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/admin/roster/provision \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d '{"institution_ref":"ci-zero-touch-bank","learners":[{"learner_ref":"ci-learner-pii","role":"general_employee","email":"forbidden@example.com"}]}')" = "400"
          grep -q 'roster_accepts_learner_ref_and_role_only' /tmp/pii-reject.json

      - name: Stop engine
        if: always()
        run: |
          if [ -f /tmp/izakhono-df.pid ]; then
            kill "$(cat /tmp/izakhono-df.pid)" || true
          fi
          cat /tmp/izakhono-df.log || true
