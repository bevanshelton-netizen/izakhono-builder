name: IZAKHONO SIGN Final Activation CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.ps1'
      - 'products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.cmd'
      - 'products/izakhono-sign/owner-node/FINAL-ACTIVATION.md'
      - '.github/workflows/sign-final-activation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.ps1'
      - 'products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.cmd'
      - 'products/izakhono-sign/owner-node/FINAL-ACTIVATION.md'
      - '.github/workflows/sign-final-activation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse final activation PowerShell
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.ps1',
            [ref]$null,[ref]$errors
          ) | Out-Null
          if($errors.Count){
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify activation safety contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.ps1').read_text()
          required=[
            "BLOCKED_SMTP_CONFIGURATION_REQUIRED",
            "READY_FOR_EDGE_APPLY",
            "PUBLIC_VERIFY_FAILED_KEEP_FALLBACK",
            "PUBLIC_OPERATIONAL_GATES_PASS",
            "deploy-mail-sign.sh",
            "STAGE-SIGN-EDGE.ps1",
            "ACTIVATE-SIGN-EDGE.ps1",
            "VERIFY-SIGN-PUBLIC.ps1",
            "smtp_configured",
            "FallbackUrl",
            "ApplyEdge",
            "VerifyPublic",
          ]
          for x in required:
            assert x in p, x
          assert "DNS" not in p or "VERIFY-SIGN-PUBLIC.ps1" in p
          cmd=Path('products/izakhono-sign/owner-node/FINALIZE-IZAKHONO-SIGN-PUBLIC.cmd').read_text()
          assert "set /p SIGN_HOSTNAME" in cmd
          assert "set /p FALLBACK_URL" in cmd
          print('[PASS] Final activation remains evidence-gated and requires operator-supplied hostname/fallback.')
          PY
