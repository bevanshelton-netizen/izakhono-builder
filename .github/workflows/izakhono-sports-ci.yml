name: IZAKHONO SPORTS CI

on:
  push:
    paths:
      - 'products/izakhono-sports/**'
      - '.github/workflows/izakhono-sports-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-sports/**'
      - '.github/workflows/izakhono-sports-ci.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-sports/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validation-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f products/izakhono-sports/docker-compose.yml config
