name: IZAKHONO Creator Controlled Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CREATOR_D1_DATABASE_ID: ${{ secrets.CREATOR_D1_DATABASE_ID }}
      CREATOR_GENERATION_SECRET: ${{ secrets.CREATOR_GENERATION_SECRET }}
      MEDIA_FABRIC_URL: ${{ secrets.MEDIA_FABRIC_URL }}
      MEDIA_FABRIC_KEY: ${{ secrets.MEDIA_FABRIC_KEY }}
    steps:
      - name: Require approved production configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CREATOR_D1_DATABASE_ID CREATOR_GENERATION_SECRET MEDIA_FABRIC_URL MEDIA_FABRIC_KEY; do
            if [ -z "${!key}" ]; then
              echo "Deployment blocked: required GitHub secret $key is not configured."
              exit 1
            fi
          done
          echo "Creator deployment configuration gate: PASS"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Creator source and tests
        run: |
          npx tsc --noEmit --skipLibCheck --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext --moduleResolution bundler products/izakhono-creator/src/index.ts products/izakhono-creator/src/cinematic-production-graph.ts products/izakhono-creator/src/cinematic-brief-compiler.ts products/izakhono-creator/src/cinematic-api.ts
          npx --yes tsx@4.20.3 products/izakhono-creator/src/cinematic-production-graph.test.ts
          npx --yes tsx@4.20.3 products/izakhono-creator/src/cinematic-brief-compiler.test.ts
          npx --yes tsx@4.20.3 products/izakhono-creator/src/cinematic-api.test.ts
          npx --yes tsx@4.20.3 products/izakhono-creator/src/one-workflow.test.ts

      - name: Create deployment config from approved bindings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            name: 'izakhono-creator',
            main: 'products/izakhono-creator/src/one-entry.ts',
            compatibility_date: '2026-10-11',
            workers_dev: true,
            d1_databases: [{
              binding: 'DB',
              database_name: 'izakhono-creator',
              database_id: process.env.CREATOR_D1_DATABASE_ID
            }],
            r2_buckets: [{
              binding: 'ASSETS',
              bucket_name: 'izakhono-creator-assets'
            }]
          };
          fs.writeFileSync('.wrangler-creator-release.json', JSON.stringify(config, null, 2), { mode: 0o600 });
          NODE

      - name: Configure server-side Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CREATOR_GENERATION_SECRET" | npx wrangler secret put CREATOR_GENERATION_SECRET --config .wrangler-creator-release.json
          printf '%s' "$MEDIA_FABRIC_URL" | npx wrangler secret put MEDIA_FABRIC_URL --config .wrangler-creator-release.json
          printf '%s' "$MEDIA_FABRIC_KEY" | npx wrangler secret put MEDIA_FABRIC_KEY --config .wrangler-creator-release.json

      - name: Deploy IZAKHONO Creator Worker
        run: npx wrangler deploy --config .wrangler-creator-release.json

      - name: Record release boundary
        run: |
          echo "IZAKHONO_CREATOR_DEPLOY_COMMAND=SUCCESS"
          echo "END_TO_END_GPU_AND_MEDIA_FABRIC_ACCEPTANCE=REQUIRES_RUNTIME_HEALTH_AND_REAL_JOB_EVIDENCE"
