name: IZAKHONO Launch Stack CI

on:
  pull_request:
    paths:
      - 'infra/launch-stack/**'
      - 'scripts/launch-stack/**'
      - 'scripts/install-sovereign-deploy.sh'
      - 'products/izakhono-core/**'
      - 'products/izakhono-control/**'
      - 'products/izakhono-node/**'
      - 'products/izakhono-code/**'
      - 'docs/LAUNCH-STACK-V1.md'
      - '.github/workflows/launch-stack-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/launch-stack/**'
      - 'scripts/launch-stack/**'
      - 'scripts/install-sovereign-deploy.sh'
      - 'products/izakhono-core/**'
      - 'products/izakhono-control/**'
      - 'products/izakhono-node/**'
      - 'products/izakhono-code/**'
      - 'docs/LAUNCH-STACK-V1.md'
      - '.github/workflows/launch-stack-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          set -euo pipefail
          for script in scripts/launch-stack/*.sh scripts/install-sovereign-deploy.sh products/izakhono-node/deploy.sh products/izakhono-code/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done
          python3 -m py_compile products/izakhono-control/control.py products/izakhono-node/node_agent.py

      - name: PowerShell owner-host syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/launch-stack/windows-owner-host.ps1',
            'scripts/launch-stack/tap-into-our-infrastructure.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
          $launcher = Get-Content -Raw 'scripts/launch-stack/START-IZAKHONO-OWNER-HOST.cmd'
          if ($launcher -notmatch 'windows-owner-host\.ps1' -or $launcher -notmatch 'AttemptRouterMapping') {
            throw 'Windows one-click launcher is not wired to the reviewed owner-host script.'
          }
          $tapLauncher = Get-Content -Raw 'scripts/launch-stack/TAP-INTO-OUR-INFRASTRUCTURE.cmd'
          if ($tapLauncher -notmatch 'tap-into-our-infrastructure\.ps1') {
            throw 'Tap-in launcher is not wired to the reviewed IZAKHONO staging orchestrator.'
          }

      - name: Safety invariants
        run: |
          set -euo pipefail
          ! grep -R --line-number -E '(^|[[:space:]])eval([[:space:]]|$)' scripts/launch-stack scripts/install-sovereign-deploy.sh products/izakhono-control products/izakhono-node products/izakhono-code
          ! grep -R --line-number -E 'curl[^|]*\|[[:space:]]*(bash|sh)' scripts/launch-stack scripts/install-sovereign-deploy.sh products/izakhono-node products/izakhono-code
          ! grep -R --line-number -E 'chmod[[:space:]]+777|--privileged' scripts/launch-stack scripts/install-sovereign-deploy.sh infra/launch-stack products/izakhono-node products/izakhono-code
          grep -Fq '127.0.0.1:5000:5000' infra/launch-stack/docker-compose.yml
          grep -Fq 'internal: true' infra/launch-stack/docker-compose.yml
          grep -Fq 'container_name: izakhono-core' infra/launch-stack/docker-compose.yml
          grep -Fq 'izakhono_core_storage' infra/launch-stack/docker-compose.yml
          grep -Fq 'IZAKHONO_CORE_JWT_SECRET' scripts/launch-stack/init-stack.sh
          grep -Fq 'IZAKHONO_CORE_ADMIN_TOKEN' scripts/launch-stack/init-stack.sh
          grep -Fq 'scripts/install-sovereign-deploy.sh' scripts/launch-stack/first-host.sh
          grep -Fq 'IZAKHONO Code + Control + Node' scripts/launch-stack/first-host.sh
          grep -Fq 'izakhono-node' scripts/launch-stack/health-check.sh
          grep -Fq 'izakhono-control' scripts/launch-stack/health-check.sh
          grep -Fq 'http://127.0.0.1:9191/healthz' scripts/launch-stack/health-check.sh
          grep -Fq 'http://127.0.0.1:9292/healthz' scripts/launch-stack/health-check.sh
          grep -Fq 'IZAKHONO_NODE_SECRET' scripts/install-sovereign-deploy.sh
          grep -Fq 'IZAKHONO_CONTROL_TOKEN' scripts/install-sovereign-deploy.sh
          grep -Fq '127.0.0.1' scripts/install-sovereign-deploy.sh
          grep -Fq 'core-storage.tgz' scripts/launch-stack/backup-stack.sh
          grep -Fq -- '--require-public' scripts/launch-stack/deploy-app.sh
          grep -Fq 'refusing silent credential rotation' scripts/launch-stack/provision-project-db.sh
          grep -Fq '/opt/izakhono/bin' scripts/launch-stack/init-stack.sh
          grep -Fq 'PUBLIC_HTTPS_HEALTH_GATE=pass' scripts/launch-stack/launch-project.sh
          grep -Fq 'commercial.readiness_required' scripts/launch-stack/deploy-app.sh
          grep -Fq 'readiness_field must be a dotted JSON field path' scripts/launch-stack/deploy-app.sh
          grep -Fq 'Application commercial-readiness gate did not return true; reverting route.' scripts/launch-stack/deploy-app.sh
          grep -Fq 'APP_DECLARED_COMMERCIAL_READINESS=' scripts/launch-stack/launch-project.sh
          grep -Fq 'Microsoft-Windows-Subsystem-Linux' scripts/launch-stack/windows-owner-host.ps1
          grep -Fq 'VirtualMachinePlatform' scripts/launch-stack/windows-owner-host.ps1
          grep -Fq 'IZAKHONO HTTP' scripts/launch-stack/windows-owner-host.ps1
          grep -Fq 'IZAKHONO HTTPS' scripts/launch-stack/windows-owner-host.ps1
          grep -Fq 'Public launch will stay fail-closed' scripts/launch-stack/windows-owner-host.ps1
          ! grep -Fq -- '--privileged' scripts/launch-stack/windows-owner-host.ps1
          grep -Fq 'COMMERCIAL_PUBLICATION=false' scripts/launch-stack/stage-project.sh
          grep -Fq 'PUBLIC_HTTPS_GATE=not-run' scripts/launch-stack/stage-project.sh
          grep -Fq 'https://github.com/bevanshelton-netizen/*.git' scripts/launch-stack/stage-reviewed-public-project.sh
          grep -Fq 'A full immutable 40-character commit SHA is required.' scripts/launch-stack/stage-reviewed-public-project.sh
          grep -Fq '/opt/izakhono/bin/stage-project.sh' scripts/launch-stack/stage-reviewed-public-project.sh
          grep -Fq 'COMMERCIAL_PUBLICATION=false' scripts/launch-stack/stage-reviewed-public-project.sh
          grep -Fq "Slug = 'the-chancellor'" scripts/launch-stack/tap-into-our-infrastructure.ps1
          grep -Fq "Slug = 'allegro-vibez'" scripts/launch-stack/tap-into-our-infrastructure.ps1
          grep -Eq "Commit = '[0-9a-f]{40}'" scripts/launch-stack/tap-into-our-infrastructure.ps1
          grep -Fq 'stage-reviewed-public-project.sh' scripts/launch-stack/tap-into-our-infrastructure.ps1
          ! grep -Fq 'launch-project.sh' scripts/launch-stack/tap-into-our-infrastructure.ps1

      - name: Validate Docker Compose model
        env:
          POSTGRES_USER: izakhono_root
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: izakhono
          REGISTRY_HTTP_SECRET: ci-only-not-production
          IZAKHONO_CORE_JWT_SECRET: ci-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          IZAKHONO_CORE_ADMIN_TOKEN: ci-admin-token-0123456789-abcdefghijklmnopqrstuvwxyz
          IZAKHONO_CORE_ALLOWED_ORIGINS: https://example.test
        run: docker compose -f infra/launch-stack/docker-compose.yml config >/dev/null

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/launch-stack/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/infra/launch-stack/sites:/etc/caddy/sites:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate systemd automation units
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /opt/izakhono/bin
          for name in backup-stack.sh health-check.sh verify-latest-backup.sh; do
            sudo ln -sf /bin/true "/opt/izakhono/bin/$name"
          done
          systemd-analyze verify infra/launch-stack/systemd/*.service infra/launch-stack/systemd/*.timer
          systemd-analyze verify products/izakhono-control/izakhono-control.service products/izakhono-node/izakhono-node.service

      - name: Validate no production secrets are committed
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'POSTGRES_PASSWORD=[A-Fa-f0-9]{32,}|REGISTRY_HTTP_SECRET=[A-Fa-f0-9]{32,}|IZAKHONO_CORE_(JWT_SECRET|ADMIN_TOKEN)=[A-Fa-f0-9]{32,}|IZAKHONO_(NODE_SECRET|CONTROL_TOKEN)=[A-Fa-f0-9]{32,}' infra scripts docs products
          echo 'LAUNCH_STACK_VALIDATION=PASS'
