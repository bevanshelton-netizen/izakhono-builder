name: IZAKHONO HOST payment bridge

on:
  pull_request:
    paths:
      - 'products/izakhono-host/runtime/provisioner/**'
      - 'products/izakhono-host/migrations/**'
      - 'products/izakhono-super-engine/src/host-provisioner-adapter*'
      - 'products/izakhono-super-engine/src/checkout-order-store*'
      - 'products/izakhono-super-engine/migrations/**'
      - 'products/izakhono-super-engine/src/index.ts'
      - 'package.json'
      - '.github/workflows/izakhono-host-payment-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-host/runtime/provisioner/**'
      - 'products/izakhono-host/migrations/**'
      - 'products/izakhono-super-engine/src/checkout-order-store*'
      - 'products/izakhono-super-engine/migrations/**'
      - '.github/workflows/izakhono-host-payment-bridge.yml'

permissions:
  contents: read

jobs:
  paid-provisioning-bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: izakhono_test
          POSTGRES_USER: izakhono_test
          POSTGRES_PASSWORD: izakhono_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U izakhono_test -d izakhono_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOST_TEST_DATABASE_URL: postgres://izakhono_test:izakhono_test_password@localhost:5432/izakhono_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install focused TypeScript validation tools
        run: npm install --no-save --no-package-lock typescript@5.9.2 @types/node@22
      - name: Test Super Engine payment and immutable checkout orders
        run: |
          npm run super-engine:payment:test
          npx --yes tsx@4.20.3 products/izakhono-super-engine/src/checkout-order-store.test.ts
          npx tsc --noEmit --target ES2022 --lib ES2022,DOM,DOM.Iterable --types node --module NodeNext --moduleResolution NodeNext products/izakhono-super-engine/src/host-provisioner-adapter.ts products/izakhono-super-engine/src/checkout-order-store.ts
      - name: Test verified-payment provisioning bridge
        run: |
          node products/izakhono-host/runtime/provisioner/payment-bridge.test.mjs
          node products/izakhono-host/runtime/provisioner/postgres-provisioning-store.test.mjs
      - name: Test against real PostgreSQL
        run: |
          npm install --no-save --no-package-lock pg@8
          node products/izakhono-host/runtime/provisioner/postgres-provisioning-store.integration.test.mjs
