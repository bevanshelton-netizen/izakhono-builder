name: Edu-Build Public Gateway

on:
  pull_request:
    paths:
      - "apps/edubuild-public/**"
      - "public/ai-core/edubuild-info/**"
      - "src/sovereign.ts"
      - ".github/workflows/edubuild-public-gateway.yml"
  push:
    branches: [main]
    paths:
      - "apps/edubuild-public/**"
      - "public/ai-core/edubuild-info/**"
      - "src/sovereign.ts"
      - ".github/workflows/edubuild-public-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical qualification source
        run: node apps/edubuild-public/verify.mjs
      - name: Verify mounted AI Core public route
        run: |
          set -euo pipefail
          grep -q "'/edubuild-info': '/ai-core/edubuild-info/index.html'" src/sovereign.ts
          grep -q "SAQA 97542" public/ai-core/edubuild-info/index.html
          grep -q "131 credits" public/ai-core/edubuild-info/index.html
          ! grep -q "140 Credits" public/ai-core/edubuild-info/index.html
          grep -q "/ai-core/edubuild-info/styles.css" public/ai-core/edubuild-info/index.html
      - name: Typecheck and Cloudflare dry run
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npx wrangler deploy --dry-run
