name: IZAKHONO AI 20.0 Division Registry

on:
  push:
    branches:
      - feature/izakhono-ai-20-operating-system
    paths:
      - 'registry/divisions.ts'
      - 'registry/divisions.test.ts'
      - 'registry/workers.ts'
      - '.github/workflows/izakhono-ai-20-division-registry.yml'
  pull_request:
    paths:
      - 'registry/divisions.ts'
      - 'registry/divisions.test.ts'
      - 'registry/workers.ts'
      - '.github/workflows/izakhono-ai-20-division-registry.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-ai-20-division-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  division-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate division and worker registry
        run: npx --yes tsx@4.20.3 registry/divisions.test.ts
