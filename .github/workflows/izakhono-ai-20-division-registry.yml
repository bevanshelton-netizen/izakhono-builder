name: IZAKHONO AI 20.0 Division Registry

on:
  push:
    branches:
      - feature/izakhono-ai-20-operating-system
    paths:
      - 'registry/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/izakhono-ai-20-division-registry.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/izakhono-ai-20-division-registry.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-ai-20-division-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  division-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated validation toolchain
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2 @types/node@22.15.30 tsx@4.20.3
      - name: Validate division and worker registry
        run: npx tsx registry/divisions.test.ts
      - name: Validate supervisor and FORTRESS capability contracts
        run: npm run registry:supervisor-test
      - name: Typecheck registry
        run: npx tsc --noEmit --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext --moduleResolution Bundler --types node registry/*.ts
