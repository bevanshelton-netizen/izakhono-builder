name: Build IZAKHONO PDF Reader

on:
  push:
    paths:
      - 'apps/izakhono-pdf-reader/**'
      - '.github/workflows/build-izakhono-pdf-reader.yml'
  pull_request:
    paths:
      - 'apps/izakhono-pdf-reader/**'
      - '.github/workflows/build-izakhono-pdf-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: apps/izakhono-pdf-reader
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izakhono-pdf-reader-debug-apk
          path: apps/izakhono-pdf-reader/app/build/outputs/apk/debug/app-debug.apk
