name: IZAKHONO Owned Runtime Package Validation (Deployment Disabled)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to validate'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate runtime files
        run: |
          test -f infra/owned-runtime/docker-compose.yml
          test -f infra/owned-runtime/Caddyfile
          test -f infra/owned-runtime/knot/knot.conf
          test -f infra/owned-runtime/knot/zones/izakhono.africa.zone
          docker compose -f infra/owned-runtime/docker-compose.yml config >/dev/null
      - name: Enforce deployment hold
        run: |
          echo "Package validation only. Remote deployment is intentionally disabled."
          echo "No arbitrary host input, SSH key use, remote shell, or production mutation is permitted."
          echo "Deployment requires the approved owner-controlled executor and verified HOST/NODE01 authorization."
