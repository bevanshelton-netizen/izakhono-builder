name: IZAKHONO HOST CI

on:
  push:
    paths:
      - 'products/izakhono-host/**'
      - '.github/workflows/izakhono-host.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'products/izakhono-host/**'
      - '.github/workflows/izakhono-host.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck HOST
        run: npm run validate:host
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config products/izakhono-host/wrangler.jsonc
      - name: Validate shell gates
        shell: bash
        run: |
          bash -n products/izakhono-host/NODE-PREFLIGHT.sh
          bash -n products/izakhono-host/NODE01-ACTIVATE.sh
          bash -n products/izakhono-host/NODE-COMPLIANCE.sh
          bash -n products/izakhono-host/MAIL-ACCEPTANCE.sh
      - name: Mail gate dry run
        shell: bash
        run: MAIL_DOMAIN=example.com bash products/izakhono-host/MAIL-ACCEPTANCE.sh
      - name: Validate contact gateway
        shell: bash
        run: |
          node --check products/izakhono-host/runtime/contact-gateway/server.mjs
          node -e "JSON.parse(require('fs').readFileSync('products/izakhono-host/runtime/contact-gateway/package.json','utf8')); JSON.parse(require('fs').readFileSync('products/izakhono-host/runtime/contact-gateway/routes.json','utf8')); console.log('[PASS] Contact gateway config valid')"
      - name: Validate mail bridge
        shell: bash
        run: |
          node --check products/izakhono-host/runtime/mail-bridge/server.mjs
          node -e "JSON.parse(require('fs').readFileSync('products/izakhono-host/runtime/mail-bridge/package.json','utf8')); console.log('[PASS] Mail bridge config valid')"
      - name: Validate customer provisioning contract
        shell: bash
        run: |
          node --check products/izakhono-host/scripts/provision-customer.mjs
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('products/izakhono-host/customers/XQWAXQWAMILE-HOLDINGS.json','utf8')); if(m.customer_id!=='cus_xqwaxqwamile_001'||m.sites.length!==2||m.content.length!==1) process.exit(1); console.log('[PASS] XQ customer provisioning manifest valid')"
      - name: Validate owned Compose definition
        shell: bash
        env:
          HOST_RUNTIME_TOKEN: ci-host-runtime-token
          TLS_EMAIL: ci@example.com
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio-admin
          MINIO_ROOT_PASSWORD: ci-minio-password
          STALWART_RECOVERY_ADMIN: admin:ci-mail-admin-password
          IZAKHONO_MAIL_API_TOKEN: ci-mail-api-token
        run: docker compose -f products/izakhono-host/docker-compose.owned.yml config
      - name: Build owned runtime image
        run: docker build -t izakhono-host-runtime-ci products/izakhono-host/runtime/control-plane
      - name: Build contact gateway image
        run: docker build -t izakhono-contact-gateway-ci products/izakhono-host/runtime/contact-gateway
      - name: Build mail bridge image
        run: docker build -t izakhono-mail-bridge-ci products/izakhono-host/runtime/mail-bridge
      - name: Validate host contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path('products/izakhono-host/migrations/0001_host.sql').read_text()
          seed = Path('products/izakhono-host/migrations/0002_customer_001.sql').read_text()
          required = ['host_customers','host_domains','host_sites','host_dns_records','host_mailboxes','host_plans','host_subscriptions','host_invoices','host_jobs','host_audit_events']
          missing = [x for x in required if x not in sql]
          if missing: raise SystemExit('HOST schema missing: ' + ', '.join(missing))
          for x in ['xqwaxqwamile.com','cus_xqwaxqwamile_001','inv_xqwaxqwamile_001']:
            if x not in seed: raise SystemExit('Customer #001 bootstrap missing: ' + x)
          print('[PASS] IZAKHONO HOST schema and Customer #001 bootstrap contract validated.')
          PY
