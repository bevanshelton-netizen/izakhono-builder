name: HOST NAV workload lifecycle tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs'
      - 'products/izakhono-host/NAV-WORKLOAD-CONTRACT-V1.md'
      - '.github/workflows/host-nav-workload-tests.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs'
      - 'products/izakhono-host/NAV-WORKLOAD-CONTRACT-V1.md'
      - '.github/workflows/host-nav-workload-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workload-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Syntax-check lifecycle module
        run: node --check products/izakhono-host/runtime/provisioner/workload-state-machine.mjs

      - name: Run HOST NAV workload lifecycle tests
        run: node --test products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs
