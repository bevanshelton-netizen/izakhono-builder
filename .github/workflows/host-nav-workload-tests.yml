name: HOST NAV workload lifecycle tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-store.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-store.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-worker.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-worker.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/runtime-adapter-contract.mjs'
      - 'products/izakhono-host/runtime/provisioner/runtime-adapter-contract.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-pipeline.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-pipeline.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-job-store.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-worker.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-worker.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/provider-http-client.mjs'
      - 'products/izakhono-host/runtime/provisioner/provider-http-client.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/http-runtime-adapter.mjs'
      - 'products/izakhono-host/runtime/provisioner/http-runtime-adapter.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-http-adapter.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-http-adapter.test.mjs'
      - 'products/izakhono-host/runtime/control-plane/server.mjs'
      - 'products/izakhono-host/runtime/control-plane/smoke.mjs'
      - 'products/izakhono-host/runtime/control-plane/Dockerfile'
      - 'products/izakhono-host/docker-compose.owned.yml'
      - 'products/izakhono-host/NAV-WORKLOAD-CONTRACT-V1.md'
      - 'products/izakhono-host/NAV-RUNTIME-ADAPTER-CONTRACT-V1.md'
      - 'products/izakhono-host/NAV-WORKLOAD-API-V1.md'
      - '.github/workflows/host-nav-workload-tests.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-store.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-store.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-worker.mjs'
      - 'products/izakhono-host/runtime/provisioner/workload-worker.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/runtime-adapter-contract.mjs'
      - 'products/izakhono-host/runtime/provisioner/runtime-adapter-contract.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-pipeline.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-pipeline.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-job-store.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-worker.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-worker.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/provider-http-client.mjs'
      - 'products/izakhono-host/runtime/provisioner/provider-http-client.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/http-runtime-adapter.mjs'
      - 'products/izakhono-host/runtime/provisioner/http-runtime-adapter.test.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-http-adapter.mjs'
      - 'products/izakhono-host/runtime/provisioner/nav-data-http-adapter.test.mjs'
      - 'products/izakhono-host/runtime/control-plane/server.mjs'
      - 'products/izakhono-host/runtime/control-plane/smoke.mjs'
      - 'products/izakhono-host/runtime/control-plane/Dockerfile'
      - 'products/izakhono-host/docker-compose.owned.yml'
      - 'products/izakhono-host/NAV-WORKLOAD-CONTRACT-V1.md'
      - 'products/izakhono-host/NAV-RUNTIME-ADAPTER-CONTRACT-V1.md'
      - 'products/izakhono-host/NAV-WORKLOAD-API-V1.md'
      - '.github/workflows/host-nav-workload-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workload-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Syntax-check HOST workload modules
        run: |
          node --check products/izakhono-host/runtime/provisioner/workload-state-machine.mjs
          node --check products/izakhono-host/runtime/provisioner/workload-store.mjs
          node --check products/izakhono-host/runtime/provisioner/workload-worker.mjs
          node --check products/izakhono-host/runtime/provisioner/runtime-adapter-contract.mjs
          node --check products/izakhono-host/runtime/provisioner/nav-data-pipeline.mjs
          node --check products/izakhono-host/runtime/provisioner/nav-data-job-store.mjs
          node --check products/izakhono-host/runtime/provisioner/nav-data-worker.mjs
          node --check products/izakhono-host/runtime/provisioner/provider-http-client.mjs
          node --check products/izakhono-host/runtime/provisioner/http-runtime-adapter.mjs
          node --check products/izakhono-host/runtime/provisioner/nav-data-http-adapter.mjs
          node --check products/izakhono-host/runtime/control-plane/server.mjs

      - name: Run HOST NAV workload tests
        run: node --test products/izakhono-host/runtime/provisioner/workload-state-machine.test.mjs products/izakhono-host/runtime/provisioner/workload-store.test.mjs products/izakhono-host/runtime/provisioner/workload-worker.test.mjs products/izakhono-host/runtime/provisioner/runtime-adapter-contract.test.mjs products/izakhono-host/runtime/provisioner/nav-data-pipeline.test.mjs products/izakhono-host/runtime/provisioner/nav-data-worker.test.mjs products/izakhono-host/runtime/provisioner/provider-http-client.test.mjs products/izakhono-host/runtime/provisioner/http-runtime-adapter.test.mjs products/izakhono-host/runtime/provisioner/nav-data-http-adapter.test.mjs

      - name: Run HOST control-plane smoke test
        run: node products/izakhono-host/runtime/control-plane/smoke.mjs

      - name: Build HOST runtime image with NAV workload modules
        run: docker build -f products/izakhono-host/runtime/control-plane/Dockerfile -t izakhono-host-runtime:ci products/izakhono-host

      - name: Smoke-test packaged HOST runtime container
        run: |
          set -euo pipefail
          volume_name=izakhono-host-runtime-data-ci
          docker volume create "$volume_name" >/dev/null
          cleanup() {
            docker rm -f izakhono-host-runtime-ci >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name izakhono-host-runtime-ci -p 127.0.0.1:18081:8080 -e HOST_RUNTIME_TOKEN=ci-host-runtime-token -e DATA_DIR=/data -v "$volume_name:/data" izakhono-host-runtime:ci
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:18081';
          let healthy = false;
          for (let i = 0; i < 40; i++) {
            try {
              const response = await fetch(base + '/health');
              if (response.ok) { healthy = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (!healthy) throw new Error('HOST runtime container did not become healthy');
          const headers = { authorization: 'Bearer ci-host-runtime-token', 'content-type': 'application/json' };
          const spec = {
            workloadId: 'izakhono-nav',
            workloadClass: 'navigation-platform',
            logicalNodeId: 'NODE01',
            releaseDigest: 'e'.repeat(64),
            healthPath: '/health',
            internalPort: 8080,
            idempotencyKey: 'nav-container-ci-0001'
          };
          const response = await fetch(base + '/api/workloads', { method: 'POST', headers, body: JSON.stringify(spec) });
          const result = await response.json();
          if (response.status !== 202 || result.execution !== 'queued-awaiting-runtime-adapter' || result.workload?.state !== 'REQUESTED') {
            throw new Error('Packaged HOST workload API failed: ' + JSON.stringify(result));
          }
          const list = await fetch(base + '/api/workloads', { headers });
          const records = await list.json();
          if (!list.ok || records.workloads?.length !== 1) throw new Error('Packaged HOST workload persistence failed');
          console.log('Packaged HOST runtime workload API: PASS');
          NODE
