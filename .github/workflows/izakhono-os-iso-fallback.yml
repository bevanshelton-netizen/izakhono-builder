name: IZAKHONO OS ISO Fallback

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/izakhono-os-alpha"
    paths:
      - "products/izakhono-os/**"
      - ".github/workflows/izakhono-os-iso-fallback.yml"

permissions:
  contents: read

jobs:
  build-and-boot-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install live-image and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             live-build debootstrap squashfs-tools xorriso isolinux syslinux-common             qemu-system-x86 qemu-utils

      - name: Privacy and source gates
        working-directory: products/izakhono-os
        run: bash ./test-source.sh

      - name: Build IZAKHONO OS ISO
        working-directory: products/izakhono-os
        run: sudo bash ./build.sh

      - name: Normalize artifact names
        working-directory: products/izakhono-os
        run: |
          cp live-image-amd64.hybrid.iso IZAKHONO-OS-alpha-amd64.iso
          sha256sum IZAKHONO-OS-alpha-amd64.iso > IZAKHONO-OS-alpha-amd64.iso.sha256

      - name: Boot ISO in QEMU
        working-directory: products/izakhono-os
        run: |
          rm -f vm-serial.log
          timeout 180s qemu-system-x86_64             -m 2048             -smp 2             -cdrom IZAKHONO-OS-alpha-amd64.iso             -boot d             -display none             -serial file:vm-serial.log             -no-reboot || true

          echo "=== VM serial tail ==="
          tail -n 120 vm-serial.log || true

          if ! grep -q "IZAKHONO_VM_BOOT_OK" vm-serial.log; then
            echo "VM BOOT GATE: FAILED"
            exit 1
          fi

          echo "VM BOOT GATE: PASSED"

      - name: Stamp verified candidate status
        working-directory: products/izakhono-os
        run: |
          cat > BUILD-STATUS.txt <<'EOF'
          status=VM_BOOT_VERIFIED
          privacy_gate=passed
          vm_boot=passed
          hardware=not_yet_verified
          installer=not_yet_verified
          production_ready=no
          EOF

      - name: Upload VM-verified boot-image candidate
        uses: actions/upload-artifact@v4
        with:
          name: IZAKHONO-OS-alpha-amd64
          path: |
            products/izakhono-os/IZAKHONO-OS-alpha-amd64.iso
            products/izakhono-os/IZAKHONO-OS-alpha-amd64.iso.sha256
            products/izakhono-os/BUILD-STATUS.txt
            products/izakhono-os/vm-serial.log
          if-no-files-found: error
          retention-days: 7
