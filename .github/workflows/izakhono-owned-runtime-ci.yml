name: IZAKHONO Owned Runtime CI

on:
  push:
    paths:
      - 'products/izakhono-host/**'
      - '.github/workflows/izakhono-owned-runtime-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-host/**'
      - '.github/workflows/izakhono-owned-runtime-ci.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-host/runtime/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.mjs
      - name: Container build
        run: docker build -t izakhono-host-runtime:ci .
      - name: Smoke start
        run: |
          docker run -d --name izakhono-host-runtime-ci -e HOST_RUNTIME_TOKEN=ci-token -p 18080:8080 izakhono-host-runtime:ci
          trap 'docker rm -f izakhono-host-runtime-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs izakhono-host-runtime-ci
          exit 1
