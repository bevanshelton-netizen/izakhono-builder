name: Provisioner Runtime

on:
  push:
    branches: [main]
    paths:
      - 'infra/provisioner/**'
      - '.github/workflows/provisioner-runtime.yml'
  pull_request:
    paths:
      - 'infra/provisioner/**'
      - '.github/workflows/provisioner-runtime.yml'
  workflow_dispatch:

jobs:
  provisioner:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provisioner
          POSTGRES_PASSWORD: provisioner
          POSTGRES_DB: provisioner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U provisioner -d provisioner_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: infra/provisioner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check pyyaml 'psycopg[binary]'
      - name: Compile Provisioner runtime
        run: python -m compileall -q .
      - name: Run FORTRESS audit smoke
        run: python fortress_audit.py
      - name: Run reconciliation smoke
        run: python reconciliation.py
      - name: Run recovery orchestration smoke
        run: python recovery_orchestrator.py
      - name: Run recovery runtime smoke
        run: python recovery_runtime_smoke.py
      - name: Run handover store smoke
        run: python handover_store.py
      - name: Run production adapter contract smoke
        run: python production_adapter_contract.py
      - name: Run production adapter catalog smoke
        run: python production_adapter_catalog.py
      - name: Run canonical IZAKHONO PAY production adapter smoke
        run: python production_payment_adapter.py
      - name: Run canonical IZAKHONO PAY production adapter tests
        run: python production_payment_adapter_test.py
      - name: Run IZAKHONO DOMAIN production adapter smoke
        run: python domain_production_adapter.py
      - name: Run IZAKHONO DOMAIN production adapter tests
        run: python domain_production_adapter_test.py
      - name: Run acceptance simulation guard
        run: python acceptance_simulation_guard_test.py
      - name: Run registry loader smoke
        run: python adapter_registry_runtime.py
      - name: Run contract smoke
        run: python execution_contract.py
      - name: Run adapter executor smoke
        run: python adapter_executor.py
      - name: Run acceptance engine smoke
        run: python acceptance_engine.py
      - name: Run unified worker smoke
        run: python worker_runtime.py
      - name: Run PostgreSQL queue smoke
        run: python postgres_job_queue.py
      - name: Run durable worker smoke
        run: python durable_worker_runtime.py
      - name: Run deterministic runtime tests
        run: |
          python - <<'PY'
          from job_store import MemoryJobStore, utc_now
          from job_queue import JobQueue
          from state_machine import State
          from worker_runtime import ProvisionerWorker
          from adapter_catalog import build_catalog
          from adapter_registry_runtime import load_registry

          store = MemoryJobStore()
          queue = JobQueue(store)
          job, created = store.create_or_get('tenant-ci', 'idem-ci', 'prov-ci')
          assert created
          job.evidence[State.PAYMENT_VERIFIED.value] = {
              'evidence_id': 'payment-ci', 'observed_at': utc_now(),
              'verified': True, 'checks': ['payment.verified']
          }
          store.save(job); queue.enqueue(job)
          worker = ProvisionerWorker(store, queue, build_catalog(), load_registry())
          for _ in range(8): worker.run_once()
          assert job.state == State.HANDOVER_READY.value
          assert job.evidence[State.PAYMENT_VERIFIED.value]['verified'] is True
          print('DETERMINISTIC_RUNTIME: PASS')
          PY
      - name: Run PostgreSQL durability integration tests
        env:
          PROVISIONER_TEST_DSN: postgresql://provisioner:provisioner@127.0.0.1:5432/provisioner_test
        run: python durable_postgres_integration_test.py
      - name: Run service boundary smoke
        run: python service.py
      - name: Run PostgreSQL handover integration test
        env:
          PROVISIONER_TEST_DSN: postgresql://provisioner:provisioner@127.0.0.1:5432/provisioner_test
        run: |
          python - <<'PY'
          import os
          import psycopg
          from postgres_job_store import PostgresJobStore
          from handover_store import HandoverStore
          from job_store import utc_now

          dsn = os.environ['PROVISIONER_TEST_DSN']
          conn = psycopg.connect(dsn)
          store = PostgresJobStore(conn)
          store.initialize()
          handovers = HandoverStore(conn)
          handovers.initialize()
          job, created = store.create_or_get('tenant-handover', 'idem-handover', 'prov-handover')
          assert created
          states = ['PAYMENT_VERIFIED','TENANT_CREATED','DOMAIN_READY','DNS_READY','SITE_READY','TLS_READY','MAIL_READY','INTEGRATIONS_READY','ACCEPTANCE_PASSED']
          evidence = {'verified': True, 'evidence_id': 'accept-ci', 'observed_at': utc_now(), 'checks': ['site.ok','mail.ok']}
          record = handovers.create_or_get('handover_prov-handover', job.job_id, job.tenant_id, states, evidence)
          again = handovers.create_or_get('handover_prov-handover', job.job_id, job.tenant_id, states, evidence)
          assert record['handover_id'] == again['handover_id']
          assert again['status'] == 'HANDOVER_READY'
          assert handovers.get(job.job_id)['job_id'] == job.job_id
          print('POSTGRES_HANDOVER: PASS')
          conn.close()
          PY
