name: IZAKHONO IDENTITY validation

on:
  push:
    branches:
      - feature/izakhono-identity-v1
    paths:
      - 'products/izakhono-identity/**'
      - 'package.json'
      - 'src/index.ts'
      - 'src/sovereign.ts'
      - '.github/workflows/identity-validation.yml'
  pull_request:
    paths:
      - 'products/izakhono-identity/**'
      - 'package.json'
      - '.github/workflows/identity-validation.yml'

permissions:
  contents: read

jobs:
  identity-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check identity service
        run: npm run identity:typecheck
      - name: Builder integration type-check
        run: npm run typecheck
      - name: Check Builder route module syntax
        run: npx --yes -p typescript@5.9.2 tsc --noEmit --noCheck --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext --moduleResolution Bundler src/sovereign.ts
      - name: Run identity core tests
        run: npm run identity:test
