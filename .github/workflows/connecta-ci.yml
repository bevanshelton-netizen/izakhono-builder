name: CONNECTA CI

on:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-social/**'
      - 'infra/node-cluster/**'
      - 'infra/runtime-fabric/**'
      - '.github/workflows/connecta-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/izakhono-social/**'
      - 'infra/node-cluster/**'
      - 'infra/runtime-fabric/**'
      - '.github/workflows/connecta-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connecta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --prefix products/izakhono-social --ignore-scripts --no-audit --no-fund

      - name: Install engine dependencies
        run: npm install --prefix products/izakhono-social/engine --ignore-scripts --no-audit --no-fund

      - name: Typecheck CONNECTA web
        run: npm run typecheck --prefix products/izakhono-social

      - name: Build CONNECTA web
        run: npm run build --prefix products/izakhono-social

      - name: Check CONNECTA engine
        run: npm run check --prefix products/izakhono-social/engine

      - name: Test CONNECTA engine
        run: npm test --prefix products/izakhono-social/engine

      - name: Validate owned Compose topology
        env:
          CONNECTA_DB_PASSWORD: ci-only-db-password
          CONNECTA_OWNER_KEY: ci-only-owner-key
        run: docker compose -f products/izakhono-social/docker-compose.owned.yml config

      - name: Verify node-cluster gate fails closed without runtime evidence
        shell: bash
        run: |
          set +e
          bash infra/node-cluster/VERIFY-NODE-CLUSTER-EVIDENCE.sh /tmp/nonexistent-node-cluster-evidence.json
          code=$?
          set -e
          if [[ "$code" -ne 10 ]]; then
            echo "Expected fail-closed exit 10, got $code" >&2
            exit 1
          fi
          echo "[PASS] node-cluster gate fails closed without runtime evidence."

      - name: Enforce canonical CONNECTA runtime path
        shell: bash
        run: bash infra/node-cluster/VERIFY-CONNECTA-PRODUCTION-PATH.sh

      - name: Enforce no legacy NODE01 production dependency
        shell: bash
        run: bash infra/node-cluster/VERIFY-CONNECTA-NO-LEGACY-GATE.sh

      - name: Validate canonical runtime documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NODE01 → NODE02 → NODE03 → NODE04' infra/node-cluster/CONNECTA-RUNTIME-CERTIFICATION-README.md
          grep -q 'DEPRECATED / NOT A CONNECTA PRODUCTION GATE' infra/runtime-fabric/LEGACY-NODE01-WAVE1-DEPRECATION.md
          grep -q 'IZAKHONO-owned-node-cluster' products/izakhono-social/.izakhono.json
          echo "[PASS] canonical four-node runtime documentation is present."

      - name: Validate release identity
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('products/izakhono-social/.izakhono.json', 'utf8'));
          if (release.name !== 'CONNECTA') throw new Error('CONNECTA release identity missing');
          if (release.infrastructure.owned_target !== 'IZAKHONO-owned-node-cluster') throw new Error('Owned target must remain the IZAKHONO-owned node cluster');
          if (release.infrastructure.current_public_route !== 'NOT_YET_VERIFIED') throw new Error('Public route must remain unverified until independently proven');
          if (release.infrastructure.status_label !== 'NOT YET PUBLIC') throw new Error('CONNECTA must not claim public launch without verification');
          if (release.engine.version !== '0.3.0') throw new Error('CONNECTA ENGINE version mismatch');
          console.log('[PASS] CONNECTA release identity and truthful launch gate are intact.');
          NODE
