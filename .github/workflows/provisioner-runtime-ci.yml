name: Provisioner Runtime CI

on:
  push:
    paths:
      - 'infra/provisioner/**'
      - 'infra/runtime-fabric/**'
      - '.github/workflows/provisioner-runtime-ci.yml'
  pull_request:
    paths:
      - 'infra/provisioner/**'
      - 'infra/runtime-fabric/**'
      - '.github/workflows/provisioner-runtime-ci.yml'

jobs:
  provisioner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile Provisioner runtime
        run: python -m compileall -q infra/provisioner
      - name: Compile Runtime Fabric controller
        run: python -m compileall -q infra/runtime-fabric/controller
      - name: Run adapter catalog smoke
        working-directory: infra/provisioner
        run: python adapter_catalog.py
      - name: Run provider-neutral adapter smoke
        working-directory: infra/provisioner
        run: python provider_adapters.py
      - name: Run contract smoke
        working-directory: infra/provisioner
        run: python execution_contract.py
      - name: Run adapter executor smoke
        working-directory: infra/provisioner
        run: python adapter_executor.py
      - name: Run acceptance engine smoke
        working-directory: infra/provisioner
        run: python acceptance_engine.py
      - name: Run unified worker smoke
        working-directory: infra/provisioner
        run: python worker_runtime.py
      - name: Run deterministic runtime tests
        working-directory: infra/provisioner
        run: python test_worker_runtime.py
      - name: Run service boundary smoke
        working-directory: infra/provisioner
        run: python service.py
      - name: Run Runtime Fabric activation transaction tests
        working-directory: infra/runtime-fabric/controller
        run: |
          python test_activation_transaction.py
          python - <<'PY'
          from activation_transaction import run_transaction
          workload = {
              'workload': 'kora-mail',
              'runtime': {'preferred_nodes': ['node01', 'node02', 'node03', 'node04']},
          }
          result = run_transaction(
              workload,
              {'node01': False, 'node02': True, 'node03': True, 'node04': True},
              lambda node: node == 'node02',
              lambda node: node == 'node02',
          )
          assert result.status == 'READY_FOR_PROMOTION'
          assert result.node == 'node02'
          print('Runtime Fabric activation transaction smoke: PASS')
          PY
      - name: Validate KORA runtime-fabric contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('infra/runtime-fabric/workloads/kora-mail.json')
          data = json.loads(p.read_text())
          assert data['workload'] == 'kora-mail'
          assert data['runtime']['mode'] == 'node-agnostic'
          assert data['runtime']['preferred_nodes'] == ['node01', 'node02', 'node03', 'node04']
          assert data['runtime']['failover_order'] == ['node02', 'node03', 'node04', 'external-resilience']
          assert data['acceptance']['promotion'] == 'LIVE_VERIFIED only after all acceptance gates pass'
          print('KORA runtime-fabric contract: PASS')
          PY
      - name: Validate KORA activation and live-gate syntax
        run: |
          bash -n infra/runtime-fabric/activation/KORA-MAIL-ACTIVATE.sh
          bash -n infra/runtime-fabric/acceptance/KORA-MAIL-LIVE-GATE.sh
          echo 'KORA activation/live-gate syntax: PASS'
