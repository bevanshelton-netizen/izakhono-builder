name: Deploy FAISReady — IZAKHONO Owned Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'public/faisready/**'
      - 'faisready-site/**'
      - '.github/workflows/deploy-faisready-owned.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faisready-owned-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify owned deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials available."

      - name: Deploy FAISReady through IZAKHONO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.127.1 deploy --config wrangler.jsonc

      - name: Report deployment target
        run: |
          echo "FAISReady asset path: /faisready/"
          echo "Deployment engine: IZAKHONO Builder + Cloudflare Worker Assets"
