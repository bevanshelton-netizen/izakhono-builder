name: IZAKHONO Provisioner CI

on:
  push:
    branches: [main]
    paths:
      - 'provisioner/**'
      - '.github/workflows/provisioner-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'provisioner/**'
      - '.github/workflows/provisioner-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provisioner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: provisioner/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Provisioner tests
        run: npm test
