name: IZAKHONO NAV Android build

on:
  pull_request:
    paths:
      - "products/izakhono-nav/android/**"
      - "public/ai-core/nav/**"
      - ".github/workflows/nav-android-build.yml"
  push:
    branches:
      - main
      - "feat/nav-android-webview-hardening-v1"
    paths:
      - "products/izakhono-nav/android/**"
      - "public/ai-core/nav/**"
      - ".github/workflows/nav-android-build.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build debug APK
        working-directory: products/izakhono-nav/android
        run: gradle --no-daemon :app:assembleDebug
