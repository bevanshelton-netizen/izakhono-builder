name: IZAKHONO VOICE CI

on:
  push:
    branches: [main, 'feat/izakhono-voice-*']
    paths:
      - 'products/izakhono-voice/**'
      - '.github/workflows/izakhono-voice-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-voice/**'
      - '.github/workflows/izakhono-voice-ci.yml'

permissions:
  contents: read

jobs:
  voice-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck Twilio integration
        run: npx --yes typescript@5.9.2 --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler products/izakhono-voice/src/types.ts products/izakhono-voice/src/twilio-rest-adapter.ts products/izakhono-voice/src/twilio-webhook-security.ts products/izakhono-voice/src/twilio-media-stream-bridge.ts
      - name: Test Twilio webhook security and media bridge
        run: npx --yes tsx@4.20.3 products/izakhono-voice/src/twilio-webhook-security.test.ts && npx --yes tsx@4.20.3 products/izakhono-voice/src/twilio-media-stream-bridge.test.ts
