name: IZAKHONO VOICE CI

on:
  push:
    branches: [main, 'feat/izakhono-voice-*']
    paths:
      - 'products/izakhono-voice/**'
      - '.github/workflows/izakhono-voice-ci.yml'
  pull_request:
    paths:
      - 'products/izakhono-voice/**'
      - '.github/workflows/izakhono-voice-ci.yml'

permissions:
  contents: read

jobs:
  voice-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck telephony and GPT-Live integration
        run: npx --yes --package typescript@5.9.2 tsc --pretty false --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler products/izakhono-voice/src/types.ts products/izakhono-voice/src/twilio-rest-adapter.ts products/izakhono-voice/src/twilio-webhook-security.ts products/izakhono-voice/src/twilio-media-stream-bridge.ts products/izakhono-voice/src/gpt-live-session-factory.ts
      - name: Install owned runtime dependencies
        run: npm install --prefix products/izakhono-voice/runtime --ignore-scripts --no-audit --no-fund
      - name: Typecheck owned WebSocket runtime
        run: npm run --prefix products/izakhono-voice/runtime typecheck
      - name: Test owned runtime handshake security
        run: npm test --prefix products/izakhono-voice/runtime
      - name: Test webhook security, media bridge, and GPT-Live session
        run: npx --yes tsx@4.20.3 products/izakhono-voice/src/twilio-rest-adapter.test.ts && npx --yes tsx@4.20.3 products/izakhono-voice/src/twilio-webhook-security.test.ts && npx --yes tsx@4.20.3 products/izakhono-voice/src/twilio-media-stream-bridge.test.ts && npx --yes tsx@4.20.3 products/izakhono-voice/src/gpt-live-session-factory.test.ts
