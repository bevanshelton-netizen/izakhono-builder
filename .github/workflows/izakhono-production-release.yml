name: IZAKHONO Production Release

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative IZAKHONO manifest
        required: false
        default: .izakhono.json
      promote:
        description: Promote after all production gates pass
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      manifest_path:
        required: false
        type: string
        default: .izakhono.json
      promote:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: izakhono-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Contract + source validation
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.contract.outputs.name }}
      slug: ${{ steps.contract.outputs.slug }}
      context: ${{ steps.contract.outputs.context }}
      dockerfile: ${{ steps.contract.outputs.dockerfile }}
      port: ${{ steps.contract.outputs.port }}
      health: ${{ steps.contract.outputs.health }}
      route: ${{ steps.contract.outputs.route }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate through IZAKHONO Machine
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path || '.izakhono.json' }}
        run: |
          set -euo pipefail
          python scripts/izakhono/machine.py gate --manifest "$MANIFEST_PATH"
      - name: Extract release contract
        id: contract
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path || '.izakhono.json' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path, PurePosixPath
          f = Path(os.environ['MANIFEST_PATH'])
          data = json.loads(f.read_text(encoding='utf-8'))
          infra = data['infrastructure']
          context = str(data['build_context']).replace('\\','/')
          dockerfile = str(data['dockerfile_path']).replace('\\','/')
          for value, label in ((context,'build context'),(dockerfile,'Dockerfile')):
              p = PurePosixPath(value)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit(f'Unsafe {label} path')
          route = str(infra.get('current_public_route',''))
          status = str(infra.get('status_label',''))
          if status == 'OWNED LIVE VERIFIED' and not route.startswith('https://'):
              raise SystemExit('Owned live status requires HTTPS')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as o:
              o.write(f"name={data['name']}\nslug={data['slug']}\ncontext={context}\ndockerfile={dockerfile}\nport={int(data['container_port'])}\nhealth={data['health_path']}\nroute={route}\n")
          PY

  owned-release:
    name: Build + deploy on IZAKHONO-owned runtime
    needs: validate
    runs-on: [self-hosted, izakhono-owned, linux]
    environment: production
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable application image
        id: build
        env:
          APP_NAME: ${{ needs.validate.outputs.name }}
          APP_SLUG: ${{ needs.validate.outputs.slug }}
          BUILD_CONTEXT: ${{ needs.validate.outputs.context }}
          DOCKERFILE: ${{ needs.validate.outputs.dockerfile }}
        run: |
          set -euo pipefail
          image="${APP_SLUG}:izakhono-${GITHUB_SHA}"
          docker build --label "za.co.izakhono.product=${APP_NAME}" --label "za.co.izakhono.commit=${GITHUB_SHA}" --label "za.co.izakhono.channel=candidate" -f "$DOCKERFILE" -t "$image" "$BUILD_CONTEXT"
          digest="$(docker image inspect "$image" --format='{{.Id}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Prepare release receipt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p .izakhono/release
          cat > .izakhono/release/release.json <<JSON
          {
            "api_version": "izakhono.production/v1",
            "application": {"name": "${{ needs.validate.outputs.name }}", "slug": "${{ needs.validate.outputs.slug }}", "repository": "${{ github.repository }}"},
            "release": {"source_sha": "${{ github.sha }}", "artifact_digest": "${DIGEST}", "channel": "candidate"},
            "runtime": {"provider": "izakhono-owned", "target": "${RUNNER_NAME}", "port": ${{ needs.validate.outputs.port }}, "health_path": "${{ needs.validate.outputs.health }}"},
            "routes": {"public_https": "${{ needs.validate.outputs.route }}"}
          }
          JSON
      - name: Deploy through owned runtime adapter
        run: |
          test -x /opt/izakhono/bin/izakhono-release || { echo 'IZAKHONO owned runtime adapter is not installed on this node.' >&2; exit 20; }
          /opt/izakhono/bin/izakhono-release apply .izakhono/release/release.json "$image"

  production-health:
    name: Health + HTTPS gate
    needs: [validate, owned-release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify owned public route
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
          HEALTH: ${{ needs.validate.outputs.health }}
        run: |
          set -euo pipefail
          test -n "$ROUTE" && [[ "$ROUTE" == https://* ]] || exit 21
          curl --fail --silent --show-error --location --max-time 30 "${ROUTE%/}${HEALTH}" >/tmp/health
          cat /tmp/health

  acceptance:
    name: Production acceptance gate
    needs: [validate, production-health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed acceptance contract
        env:
          ROUTE: ${{ needs.validate.outputs.route }}
        run: |
          set -euo pipefail
          if [ -x scripts/izakhono/production-acceptance.sh ]; then
            scripts/izakhono/production-acceptance.sh "$ROUTE"
          else
            code=$(curl -sS -o /tmp/acceptance-body -w '%{http_code}' --max-time 30 "$ROUTE")
            cat /tmp/acceptance-body || true
            test "$code" -ge 200 && test "$code" -lt 400
          fi

  promote:
    name: Promote release to LIVE
    needs: [validate, owned-release, production-health, acceptance]
    if: ${{ inputs.promote == true }}
    runs-on: [self-hosted, izakhono-owned, linux]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Promote through owned runtime adapter
        run: |
          set -euo pipefail
          test -x /opt/izakhono/bin/izakhono-release
          /opt/izakhono/bin/izakhono-release promote --application '${{ needs.validate.outputs.slug }}' --source '${{ github.sha }}' --artifact '${{ needs.owned-release.outputs.digest }}'
          echo '[PASS] Release promoted. LIVE status is evidence-backed.'
