name: I-CONNECT Network Routing CI

on:
  push:
    branches: [main]
    paths:
      - 'products/i-connect/**'
      - '.github/workflows/i-connect-network-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/i-connect/**'
      - '.github/workflows/i-connect-network-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate network and security modules
        run: |
          set -euo pipefail
          node --check products/i-connect/api/network-route.js
          node --check products/i-connect/api/provisioning.js
          node --check products/i-connect/server.js
          node --check products/i-connect/network/mobile-operator-core.mjs
          node --check products/i-connect/network/emergency-communications-core.mjs
          node --check products/i-connect/network/fortress-device-security.mjs
          node --experimental-default-type=module products/i-connect/network/provider-router.test.mjs
          node --experimental-default-type=module products/i-connect/network/provisioning-orchestrator.test.mjs
          node --experimental-default-type=module products/i-connect/network/carrier-bridge-adapter.mjs
          node --test products/i-connect/network/mobile-operator-core.test.mjs
          node --test products/i-connect/network/emergency-communications-core.test.mjs
          node --test products/i-connect/network/fortress-device-security.test.mjs
          node --check products/i-connect/api/readiness.js
          node --test products/i-connect/api/readiness.test.js
          node --test products/i-connect/supabase/functions/i-connect-mobisim-adapter/index.test.mjs
          node --test products/i-connect/supabase/functions/i-connect-mobisim-events.test.mjs
          node --test products/i-connect/payments/ikhokha-reconciliation.test.mjs

      - name: Validate carrier-neutral contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'provider_swappable: true' products/i-connect/network/network-provider-manifest.yml
          grep -q 'provider_failure_must_not_change_customer_identity: true' products/i-connect/network/network-provider-manifest.yml
          grep -q 'audit_every_provider_switch: true' products/i-connect/network/network-provider-manifest.yml
          grep -q "providerIdentifierIsInternalOnly: true" products/i-connect/api/network-route.js
          echo '[PASS] Carrier-neutral identity and audit safeguards are present.'

      - name: Validate no hard-coded provider credentials
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REqi '(password|secret|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+["'"'"']' products/i-connect/network products/i-connect/api/network-route.js products/i-connect/api/provisioning.js
          echo '[PASS] No hard-coded provider credentials detected.'
