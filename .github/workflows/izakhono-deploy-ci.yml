name: IZAKHONO DEPLOY lifecycle CI

on:
  pull_request:
    paths:
      - "deploy-control/**"
      - "autonomy/node-registry.mjs"
      - "infra/runtime-fabric/controller/**"
      - ".github/workflows/izakhono-deploy-ci.yml"
  push:
    branches:
      - "feat/izakhono-deploy-owned-control-plane"
    paths:
      - "deploy-control/**"
      - "autonomy/node-registry.mjs"
      - "infra/runtime-fabric/controller/**"
      - ".github/workflows/izakhono-deploy-ci.yml"

permissions:
  contents: read

concurrency:
  group: izakhono-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deploy_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEPLOY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deploy_control_test
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL integration-test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Test lifecycle policy, target adapter, authorization and PostgreSQL transaction boundary
        run: node --test deploy-control/lifecycle.test.mjs deploy-control/target-adapter.test.mjs deploy-control/authorization.test.mjs deploy-control/transaction.test.mjs deploy-control/postgres.integration.test.mjs
      - name: Check NODE01 identity invariant
        run: python3 scripts/architecture/check-node01-identity.py
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL Python test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "psycopg[binary]==3.2.9"
      - name: Verify Runtime Fabric preserves DEPLOY metadata
        env:
          DEPLOY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deploy_control_test
          PYTHONPATH: infra/runtime-fabric/controller
        run: >-
          python -m pytest -q
          infra/runtime-fabric/controller/test_postgres_deployment_store.py
          infra/runtime-fabric/controller/test_database_preflight.py

  runtime-fabric-controller-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Runtime Fabric controller regressions
        env:
          PYTHONPATH: infra/runtime-fabric/controller
        run: >-
          python -m pytest -q
          infra/runtime-fabric/controller/test_activation_transaction.py
          infra/runtime-fabric/controller/test_deployment_state.py
          infra/runtime-fabric/controller/test_observability.py
          infra/runtime-fabric/controller/test_postgres_event_store.py
          infra/runtime-fabric/controller/test_recovery_reconciler.py
          infra/runtime-fabric/controller/test_recovery_supervisor.py
          infra/runtime-fabric/controller/test_recovery_worker.py
          infra/runtime-fabric/controller/test_runtime_fabric_controller.py
          infra/runtime-fabric/controller/test_state_observability_integration.py
          infra/runtime-fabric/controller/test_workload_activation.py

