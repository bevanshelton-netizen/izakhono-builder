name: FAISReady v1 Launch Build

on:
  pull_request:
    paths:
      - 'products/faisready-v1/**'
      - '.github/workflows/faisready-v1.yml'
  push:
    branches: [main]
    paths:
      - 'products/faisready-v1/**'
      - '.github/workflows/faisready-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required launch files
        run: |
          test -f products/faisready-v1/index.html
          test -f products/faisready-v1/styles.css
          test -f products/faisready-v1/app.js
          test -f products/faisready-v1/README.md
          test -f products/faisready-v1/RELEASE-CHECKLIST.md
          test -f products/faisready-v1/PAYMENT-INTEGRATION.md
          test -f products/faisready-v1/merch.json
          test -f products/faisready-v1/server.js
          test -f products/faisready-v1/Dockerfile
          test -f products/faisready-v1/.izakhono.json
          test -f products/faisready-v1/PROVISION-FAISREADY-OWNER.sh
          test -f products/faisready-v1/owner/index.html
          test -f products/faisready-v1/owner/owner.css
          test -f products/faisready-v1/owner/owner.js
          test -f products/faisready-v1/INSTALL-FAISREADY-V1.cmd
          test -f products/faisready-v1/assets/approved-photo-0.b64
          test -f products/faisready-v1/assets/approved-photo-1.b64
          test -f products/faisready-v1/assets/approved-photo-2.b64
          test -f products/faisready-v1/assets/approved-photo-3.b64
          test -f products/faisready-v1/assets/approved-photo-4.b64
          test -f products/faisready-v1/assets/approved-photo-5.b64
          test -f products/faisready-v1/assets/approved-photo-6.b64

      - name: Verify product claims and content
        shell: python
        run: |
          from pathlib import Path
          html = Path("products/faisready-v1/index.html").read_text(encoding="utf-8")
          js = Path("products/faisready-v1/app.js").read_text(encoding="utf-8")
          pay = Path("products/faisready-v1/PAYMENT-INTEGRATION.md").read_text(encoding="utf-8")
          required = [
              "FAISReady", "R399", "R299", "R549", "RE1", "RE3", "RE4", "RE5",
              "Buy RE5 Complete", "Employer / Team Enquiry",
              "Institutional Pilot", "RE5 LIVE", "OTHERS GATED"
          ]
          for item in required:
              assert item in html, item
          assert "localStorage" in js
          assert "text/csv" in js
          assert 'id="rainbowImage"' in html
          assert 'assets/approved-photo-' in js
          import base64
          chunks = [Path(f"products/faisready-v1/assets/approved-photo-{i}.b64").read_text(encoding="utf-8").strip() for i in range(7)]
          encoded = "".join(chunks)
          assert len(encoded) == 66492
          raw = base64.b64decode(encoded, validate=True)
          assert raw[:4] == b"RIFF"
          assert raw[8:12] == b"WEBP"
          assert len(raw) == 49868
          assert "RE5_DIRECT_CHECKOUT_LINKED=true" in pay
          assert "AUTOMATED_ENTITLEMENT=false" in pay
          assert "OTHER_CHECKOUTS_ACTIVE=false" in pay
          assert "https://pay.ikhokha.com/izakhono/buy/re5completeprepara" in html
          lowered = (html + js).lower()
          blocked = [
              "payfast.co.za/eng/process",
              "checkout.stripe.com",
              "we guarantee a pass",
              "guaranteed results",
              "endorsed by the fsca",
              "fsca-approved preparation",
          ]
          for item in blocked:
              assert item not in lowered, item
          print("FAISREADY_CONTENT_GATE=PASS")

      - name: Check JavaScript and owner-server syntax
        run: |
          node --check products/faisready-v1/app.js
          node --check products/faisready-v1/server.js
          node --check products/faisready-v1/owner/owner.js
          bash -n products/faisready-v1/PROVISION-FAISREADY-OWNER.sh

      - name: Verify owner and merchandise security boundaries
        shell: python
        run: |
          import json
          from pathlib import Path
          html = Path("products/faisready-v1/index.html").read_text(encoding="utf-8")
          app = Path("products/faisready-v1/app.js").read_text(encoding="utf-8")
          owner = Path("products/faisready-v1/owner/owner.js").read_text(encoding="utf-8")
          server = Path("products/faisready-v1/server.js").read_text(encoding="utf-8")
          manifest = json.loads(Path("products/faisready-v1/.izakhono.json").read_text(encoding="utf-8"))
          merch = json.loads(Path("products/faisready-v1/merch.json").read_text(encoding="utf-8"))
          assert 'id="shop"' in html
          assert '/owner/' in html
          assert '/api/merch/order' in app
          assert '/api/owner/signin' in owner
          assert 'CRM_ADMIN_TOKEN' not in owner
          assert 'FAISREADY_CORE_PROJECT_KEY' not in owner
          assert 'CRM_ADMIN_TOKEN' in server
          assert 'FAISREADY_CORE_PROJECT_KEY' in server
          assert manifest["infrastructure"]["policy"] == "owned-first-externally-reversible"
          assert manifest["commercial"]["readiness_required"] is True
          assert manifest["commercial"]["readiness_path"] == "/readiness"
          for item in merch["items"]:
              url = item.get("checkout_url")
              assert url is None or url.startswith("https://pay.ikhokha.com/")
          priced = {i["id"]: i["price"] for i in merch["items"] if i.get("price") is not None}
          assert priced["faisready-hoodie"] == 550
          assert priced["faisready-golfer"] == 250
          assert priced["faisready-tee"] == 190
          print("FAISREADY_OWNER_MERCH_GATE=PASS")

      - name: Verify one-click installer pin
        shell: python
        run: |
          from pathlib import Path
          cmd = Path("products/faisready-v1/INSTALL-FAISREADY-V1.cmd").read_text(encoding="utf-8")
          assert "fd840eda1d221b9e505434ee5f6f946c5e36b15e" in cmd
          assert "ffafed323524e0ab77895ac30d5d5e9218d04d6c" not in cmd
          assert "e62226ed68dfe906318661ac7f09ea71bf7cefe4" not in cmd
          assert "Payments remain disabled until separately verified." not in cmd
          assert "RE5 R299 iKhokha handoff is enabled in the validated release." in cmd
          assert "Automated entitlement remains disabled; payment alone does not grant access." in cmd
          assert "RE1, RE3, RE4 and bundle offers remain gated." in cmd
          assert "no FSCA endorsement and no pass guarantee" in cmd
          assert "merch.json" in cmd
          assert "owner.js" in cmd
          assert "if($count -lt 17)" in cmd
          assert "FAISREADY_V1_OWNER_BUILD=PASS" in cmd
          assert "/api/projects/FAISReady-v1/validate" in cmd
          assert "Add-MpPreference" not in cmd
          assert "Set-MpPreference" not in cmd
          print("FAISREADY_INSTALLER_GATE=PASS")

      - name: Package owner launch bundle
        run: |
          mkdir -p dist/FAISReady-v1
          cp -R products/faisready-v1/. dist/FAISReady-v1/
          cp products/faisready-v1/INSTALL-FAISREADY-V1.cmd dist/
          cd dist
          zip -r FAISREADY-V1-OWNER-LAUNCH.zip FAISReady-v1 INSTALL-FAISREADY-V1.cmd

      - name: Upload owner launch bundle
        uses: actions/upload-artifact@v4
        with:
          name: FAISREADY-V1-OWNER-LAUNCH
          path: dist/FAISREADY-V1-OWNER-LAUNCH.zip
          if-no-files-found: error
          retention-days: 30
