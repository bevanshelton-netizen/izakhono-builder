name: FAISReady v1 Launch Build

on:
  pull_request:
    paths:
      - 'products/faisready-v1/**'
      - '.github/workflows/faisready-v1.yml'
  push:
    branches: [main]
    paths:
      - 'products/faisready-v1/**'
      - '.github/workflows/faisready-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required launch files
        run: |
          test -f products/faisready-v1/index.html
          test -f products/faisready-v1/styles.css
          test -f products/faisready-v1/app.js
          test -f products/faisready-v1/README.md
          test -f products/faisready-v1/RELEASE-CHECKLIST.md
          test -f products/faisready-v1/PAYMENT-INTEGRATION.md
          test -f products/faisready-v1/INSTALL-FAISREADY-V1.cmd
          test -f products/faisready-v1/assets/rainbow-0.b64
          test -f products/faisready-v1/assets/rainbow-1.b64
          test -f products/faisready-v1/assets/rainbow-2.b64
          test -f products/faisready-v1/assets/rainbow-3.b64
          test -f products/faisready-v1/assets/rainbow-4.b64

      - name: Verify product claims and content
        shell: python
        run: |
          from pathlib import Path
          html = Path("products/faisready-v1/index.html").read_text(encoding="utf-8")
          js = Path("products/faisready-v1/app.js").read_text(encoding="utf-8")
          pay = Path("products/faisready-v1/PAYMENT-INTEGRATION.md").read_text(encoding="utf-8")
          required = [
              "FAISReady", "R399", "RE1", "RE3", "RE4", "RE5",
              "Join the R399 Launch List", "Employer / Team Enquiry",
              "Institutional Pilot", "Payments are intentionally disabled"
          ]
          for item in required:
              assert item in html, item
          assert "localStorage" in js
          assert "text/csv" in js
          assert 'id="rainbowImage"' in html
          assert 'assets/rainbow-' in js
          chunks = [Path(f"products/faisready-v1/assets/rainbow-{i}.b64").read_text(encoding="utf-8").strip() for i in range(5)]
          assert len("".join(chunks)) > 50000
          assert "PAYMENTS_ACTIVE=false" in pay
          lowered = (html + js).lower()
          blocked = [
              "payfast.co.za/eng/process",
              "checkout.stripe.com",
              "we guarantee a pass",
              "guaranteed results",
              "endorsed by the fsca",
              "fsca-approved preparation",
          ]
          for item in blocked:
              assert item not in lowered, item
          print("FAISREADY_CONTENT_GATE=PASS")

      - name: Check JavaScript syntax
        run: node --check products/faisready-v1/app.js

      - name: Verify one-click installer pin
        shell: python
        run: |
          from pathlib import Path
          cmd = Path("products/faisready-v1/INSTALL-FAISREADY-V1.cmd").read_text(encoding="utf-8")
          assert "830b2ccb9a67f92940bff99f706ecbea0f4f4dd8" in cmd
          assert "FAISREADY_V1_OWNER_BUILD=PASS" in cmd
          assert "/api/projects/FAISReady-v1/validate" in cmd
          assert "Add-MpPreference" not in cmd
          assert "Set-MpPreference" not in cmd
          print("FAISREADY_INSTALLER_GATE=PASS")

      - name: Package owner launch bundle
        run: |
          mkdir -p dist/FAISReady-v1
          cp products/faisready-v1/index.html dist/FAISReady-v1/
          cp products/faisready-v1/styles.css dist/FAISReady-v1/
          cp products/faisready-v1/app.js dist/FAISReady-v1/
          mkdir -p dist/FAISReady-v1/assets
          cp products/faisready-v1/assets/rainbow-*.b64 dist/FAISReady-v1/assets/
          cp products/faisready-v1/README.md dist/FAISReady-v1/
          cp products/faisready-v1/RELEASE-CHECKLIST.md dist/FAISReady-v1/
          cp products/faisready-v1/PAYMENT-INTEGRATION.md dist/FAISReady-v1/
          cp products/faisready-v1/INSTALL-FAISREADY-V1.cmd dist/
          cd dist
          zip -r FAISREADY-V1-OWNER-LAUNCH.zip FAISReady-v1 INSTALL-FAISREADY-V1.cmd

      - name: Upload owner launch bundle
        uses: actions/upload-artifact@v4
        with:
          name: FAISREADY-V1-OWNER-LAUNCH
          path: dist/FAISREADY-V1-OWNER-LAUNCH.zip
          if-no-files-found: error
          retention-days: 30
