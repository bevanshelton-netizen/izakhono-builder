name: IZAKHONO Build to Alpha

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Repository-relative IZAKHONO manifest path
        required: false
        type: string
        default: .izakhono.json
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative IZAKHONO manifest path
        required: false
        default: .izakhono.json

permissions:
  contents: read

concurrency:
  group: izakhono-alpha-${{ github.repository }}-${{ github.ref }}-${{ inputs.manifest_path || '.izakhono.json' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Read safe build contract
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.contract.outputs.name }}
      slug: ${{ steps.contract.outputs.slug }}
      context: ${{ steps.contract.outputs.context }}
      dockerfile: ${{ steps.contract.outputs.dockerfile }}
      port: ${{ steps.contract.outputs.port }}
      health: ${{ steps.contract.outputs.health }}
      preflight: ${{ steps.contract.outputs.preflight }}
      rehearsal: ${{ steps.contract.outputs.rehearsal }}
      windows_package: ${{ steps.contract.outputs.windows_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IZAKHONO manifest
        id: contract
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path || '.izakhono.json' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path, PurePosixPath

          raw_manifest = os.environ.get('MANIFEST_PATH', '.izakhono.json').replace('\\', '/')
          manifest_path = PurePosixPath(raw_manifest)
          if manifest_path.is_absolute() or '..' in manifest_path.parts:
              raise SystemExit('manifest_path must stay inside the repository')

          root = Path('.')
          manifest_file = root / manifest_path
          if not manifest_file.is_file():
              raise SystemExit(f'IZAKHONO manifest not found: {manifest_path}')

          data = json.loads(manifest_file.read_text(encoding='utf-8'))
          required = ('name','slug','build_context','dockerfile_path','container_port','health_path')
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit('Missing IZAKHONO fields: ' + ', '.join(missing))

          name = str(data['name']).strip()
          slug = str(data['slug']).strip()
          if not name or len(name) > 120:
              raise SystemExit('name must contain 1-120 characters')
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug):
              raise SystemExit('slug must use lowercase letters, digits and single hyphens')

          def safe_repo_path(key):
              raw = str(data[key]).replace('\\', '/')
              p = PurePosixPath(raw)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit(f'{key} must stay inside the repository')
              return raw

          context = safe_repo_path('build_context')
          dockerfile = safe_repo_path('dockerfile_path')
          if not (root / context).is_dir():
              raise SystemExit(f'Build context missing: {context}')
          if not (root / dockerfile).is_file():
              raise SystemExit(f'Dockerfile missing: {dockerfile}')

          port = int(data['container_port'])
          if not 1 <= port <= 65535:
              raise SystemExit('container_port out of range')
          health = str(data['health_path'])
          if not health.startswith('/') or '\n' in health or '\r' in health or len(health) > 200:
              raise SystemExit('health_path must be one short absolute HTTP path')

          alpha = data.get('alpha') or {}
          for key in ('preflight','rehearsal','windows_package'):
              if not isinstance(alpha.get(key, False), bool):
                  raise SystemExit(f'alpha.{key} must be boolean')
          preflight = bool(alpha.get('preflight', False))
          rehearsal = bool(alpha.get('rehearsal', False))
          windows_package = bool(alpha.get('windows_package', False))
          if rehearsal and not (root / 'scripts/izakhono/alpha-rehearsal.sh').is_file():
              raise SystemExit('alpha.rehearsal=true requires scripts/izakhono/alpha-rehearsal.sh')
          if windows_package and not (root / 'scripts/izakhono/package-alpha.ps1').is_file():
              raise SystemExit('alpha.windows_package=true requires scripts/izakhono/package-alpha.ps1')

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f"name={name}\n")
              f.write(f"slug={slug}\n")
              f.write(f"context={context}\n")
              f.write(f"dockerfile={dockerfile}\n")
              f.write(f"port={port}\n")
              f.write(f"health={health}\n")
              f.write(f"preflight={'true' if preflight else 'false'}\n")
              f.write(f"rehearsal={'true' if rehearsal else 'false'}\n")
              f.write(f"windows_package={'true' if windows_package else 'false'}\n")
          print(f"[PASS] IZAKHONO contract loaded for {name}")
          PY

  preflight:
    name: Project preflight
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Central fixed preflight policy
        if: needs.validate.outputs.preflight == 'true'
        shell: bash
        env:
          IZAKHONO_APP_NAME: ${{ needs.validate.outputs.name }}
          IZAKHONO_APP_SLUG: ${{ needs.validate.outputs.slug }}
          IZAKHONO_BUILD_CONTEXT: ${{ needs.validate.outputs.context }}
          IZAKHONO_DOCKERFILE: ${{ needs.validate.outputs.dockerfile }}
          IZAKHONO_CONTAINER_PORT: ${{ needs.validate.outputs.port }}
          IZAKHONO_HEALTH_PATH: ${{ needs.validate.outputs.health }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path

          name = os.environ['IZAKHONO_APP_NAME']
          slug = os.environ['IZAKHONO_APP_SLUG']
          context = Path(os.environ['IZAKHONO_BUILD_CONTEXT'])
          dockerfile = Path(os.environ['IZAKHONO_DOCKERFILE'])
          port = int(os.environ['IZAKHONO_CONTAINER_PORT'])
          health = os.environ['IZAKHONO_HEALTH_PATH']

          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug):
              raise SystemExit('[FAIL] Application slug is not deployment-safe.')
          if not context.is_dir() or not dockerfile.is_file():
              raise SystemExit('[FAIL] Build context or Dockerfile is missing.')
          if not 1 <= port <= 65535:
              raise SystemExit('[FAIL] Container port is invalid.')
          if not health.startswith('/') or '\n' in health or '\r' in health:
              raise SystemExit('[FAIL] Health path is invalid.')

          secret_patterns = [
              re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY', re.I),
              re.compile(r'service_role\s*[=:]\s*[^<\s]+', re.I),
              re.compile(r'ADMIN_SECRET\s*=\s*[^$<{\s][^\s]*', re.I),
              re.compile(r'sk-[A-Za-z0-9_-]{20,}', re.I),
          ]
          skip_dirs = {'.git', 'node_modules', '.next', 'dist', 'build', '.cache'}
          candidates = []
          if context.is_file():
              candidates.append(context)
          else:
              for p in context.rglob('*'):
                  if not p.is_file() or any(part in skip_dirs for part in p.parts):
                      continue
                  if p.stat().st_size > 2_000_000 or p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.ico','.zip','.gz','.pdf','.woff','.woff2'}:
                      continue
                  candidates.append(p)
          if dockerfile not in candidates:
              candidates.append(dockerfile)

          for p in candidates:
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in secret_patterns:
                  if pattern.search(text):
                      raise SystemExit(f'[FAIL] Obvious credential material detected in {p}.')

          docker_text = dockerfile.read_text(encoding='utf-8')
          if re.search(r'^\s*ADD\s+https?://', docker_text, re.I | re.M):
              raise SystemExit('[FAIL] Remote URL ADD is not allowed in the Alpha Dockerfile.')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('# IZAKHONO CENTRAL PREFLIGHT\n\n')
                  f.write(f'Application: **{name}**\n\n')
                  f.write(f'Build context: `{context}`\n\n')
                  f.write(f'Health gate: `{health}` on port `{port}`\n\n')
                  f.write('✅ Central fixed preflight passed. The caller repository supplied no executable preflight policy.\n')
          print(f'[PASS] Central IZAKHONO preflight passed for {name}.')
          PY

      - name: Record no-op preflight
        if: needs.validate.outputs.preflight != 'true'
        shell: bash
        run: echo '[PASS] Central preflight was not requested by this manifest.'

  container-gate:
    name: Build + health gate
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        shell: bash
        env:
          APP_NAME: ${{ needs.validate.outputs.name }}
          APP_SLUG: ${{ needs.validate.outputs.slug }}
          BUILD_CONTEXT: ${{ needs.validate.outputs.context }}
          DOCKERFILE: ${{ needs.validate.outputs.dockerfile }}
        run: |
          image="${APP_SLUG}:izakhono-alpha-${GITHUB_SHA::12}"
          docker build \
            --label "za.co.izakhono.product=${APP_NAME}" \
            --label "za.co.izakhono.commit=${GITHUB_SHA}" \
            --label "za.co.izakhono.channel=alpha" \
            -f "$DOCKERFILE" -t "$image" "$BUILD_CONTEXT"
          echo "IZAKHONO_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Health gate
        shell: bash
        env:
          APP_PORT: ${{ needs.validate.outputs.port }}
          HEALTH_PATH: ${{ needs.validate.outputs.health }}
        run: |
          docker run -d --name izakhono-alpha -p "127.0.0.1:18000:${APP_PORT}" "$IZAKHONO_IMAGE"
          trap 'docker logs izakhono-alpha || true; docker rm -f izakhono-alpha || true' EXIT
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:18000${HEALTH_PATH}" >/tmp/izakhono-health; then
              cat /tmp/izakhono-health
              echo '[PASS] IZAKHONO container health gate passed.'
              exit 0
            fi
            sleep 2
          done
          echo '[FAIL] IZAKHONO container did not become healthy.' >&2
          exit 1

  rehearsal:
    name: Database / application rehearsal
    if: needs.validate.outputs.rehearsal == 'true'
    needs: [validate, container-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repository-reviewed Alpha rehearsal
        shell: bash
        run: bash scripts/izakhono/alpha-rehearsal.sh

  windows-package:
    name: Package Windows Alpha kit
    if: needs.validate.outputs.windows_package == 'true'
    needs: [validate, container-gate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repository-reviewed Windows packager
        shell: pwsh
        run: .\scripts\izakhono\package-alpha.ps1
      - name: Require package output
        shell: pwsh
        run: |
          if (-not (Test-Path '.\dist\izakhono-alpha')) { throw 'Expected dist/izakhono-alpha output was not created.' }
          $files = Get-ChildItem '.\dist\izakhono-alpha' -File -Recurse
          if (-not $files) { throw 'Alpha package output is empty.' }
          Write-Host "[PASS] Alpha package output contains $($files.Count) file(s)."
      - name: Retain package when quota permits
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: izakhono-alpha-${{ needs.validate.outputs.slug }}
          path: dist/izakhono-alpha/**
          retention-days: 7

  result:
    name: One clear Alpha result
    if: always()
    needs: [validate, preflight, container-gate, rehearsal, windows-package]
    runs-on: ubuntu-latest
    steps:
      - name: PASS or FAIL
        env:
          VALIDATE: ${{ needs.validate.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          CONTAINER: ${{ needs.container-gate.result }}
          REHEARSAL: ${{ needs.rehearsal.result }}
          WINDOWS: ${{ needs.windows-package.result }}
        shell: bash
        run: |
          ok_optional() { [[ "$1" == success || "$1" == skipped ]]; }
          {
            echo '# IZAKHONO BUILD TO ALPHA'
            echo
            echo "Contract: **${VALIDATE}**"
            echo "Central preflight: **${PREFLIGHT}**"
            echo "Container + health: **${CONTAINER}**"
            echo "Rehearsal: **${REHEARSAL}**"
            echo "Windows package: **${WINDOWS}**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VALIDATE" == success && "$PREFLIGHT" == success && "$CONTAINER" == success ]] && ok_optional "$REHEARSAL" && ok_optional "$WINDOWS"; then
            echo '## ✅ ALPHA BUILD: PASS' >> "$GITHUB_STEP_SUMMARY"
            echo '[PASS] IZAKHONO Build to Alpha completed.'
            exit 0
          fi

          echo '## ❌ ALPHA BUILD: FAIL' >> "$GITHUB_STEP_SUMMARY"
          echo 'No promotion should occur until the failed gate is corrected.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
