name: IZAKHONO MAIL validation

on:
  push:
    paths:
      - 'products/izakhono-host/mail/**'
      - 'products/izakhono-host/docker-compose.owned.yml'
      - '.github/workflows/izakhono-mail.yml'
  pull_request:
    paths:
      - 'products/izakhono-host/mail/**'
      - 'products/izakhono-host/docker-compose.owned.yml'
      - '.github/workflows/izakhono-mail.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp products/izakhono-host/.env.example products/izakhono-host/.env
          mkdir -p products/izakhono-host/mail/secrets
          printf 'ci-roundcube-db-secret' > products/izakhono-host/mail/secrets/roundcube_db_password
          printf 'ci-roundcube-des-key' > products/izakhono-host/mail/secrets/roundcube_des_key
          docker compose --env-file products/izakhono-host/.env -f products/izakhono-host/docker-compose.owned.yml config >/dev/null
          docker compose --env-file products/izakhono-host/.env -f products/izakhono-host/mail/docker-compose.mail.yml config >/dev/null
      - name: Validate mail bridge and control-plane source
        run: |
          node --check products/izakhono-host/runtime/mail-bridge/server.mjs
          python3 -m compileall -q products/izakhono-host/runtime/mail-control-plane/api
      - name: Validate portfolio manifest
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('products/izakhono-host/mail/portfolio-mailboxes.yml').read_text()
          required = ['KORA NETWORK', 'I-CONNECT', 'FAISReady', 'DOXA-SURE', 'Edu-Build Institute', 'Allegro Vibez', 'IZAKHONO NAV', 'IZAKHONO HOST', 'FORTRESS']
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit(f'Missing platforms: {missing}')
          if 'password:' in p.lower() or 'smtp_pass:' in p.lower():
              raise SystemExit('Secret-like mailbox credentials found in manifest')
          print('portfolio manifest: PASS')
          PY
