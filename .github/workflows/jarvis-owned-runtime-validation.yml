name: J.A.R.V.I.S. owned-runtime source validation

on:
  pull_request:
    branches: [main]
    paths:
      - "products/izakhono-jarvis/**"
      - "products/izakhono-host/docker-compose.owned.yml"
      - "products/izakhono-host/bootstrap-owned.sh"
      - "migrations/00[2-3]*_jarvis_*.sql"
      - ".github/workflows/jarvis-owned-runtime-validation.yml"
  push:
    branches: [main]
    paths:
      - "products/izakhono-jarvis/**"
      - "migrations/00[2-3]*_jarvis_*.sql"
      - ".github/workflows/jarvis-owned-runtime-validation.yml"

permissions:
  contents: read

jobs:
  source-validation:
    name: Validate J.A.R.V.I.S. source contracts (not deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: jarvis_test_only
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test -d jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jarvis_test:jarvis_test_only@localhost:5432/jarvis_test
      DATABASE_SSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install isolated J.A.R.V.I.S. runtime dependencies
        working-directory: products/izakhono-jarvis/runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test bounded worker and supervisor
        run: npm run jarvis:worker:test

      - name: Test owner-controlled workforce queue
        run: npm run jarvis:workforce:test

      - name: Test PostgreSQL SQL adapter
        working-directory: products/izakhono-jarvis/runtime
        run: npm test

      - name: Validate J.A.R.V.I.S. PostgreSQL schema and route integration
        working-directory: products/izakhono-jarvis/runtime
        env:
          JARVIS_ALLOW_SCHEMA_MIGRATION: "1"
        run: |
          node postgres-migrate.mjs
          npm run test:postgres

      - name: Build owned J.A.R.V.I.S. runtime image
        run: docker build -f products/izakhono-jarvis/runtime/Dockerfile -t izakhono-jarvis-api:ci .

      - name: Smoke-test the owned J.A.R.V.I.S. container against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --network host --name jarvis-api-ci \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DATABASE_SSLMODE=disable \
            -e JARVIS_OWNER_SECRET=ci-owner-secret-at-least-32-bytes-long \
            -e JARVIS_WORKER_TOKEN=ci-worker-token-at-least-32-bytes-long \
            izakhono-jarvis-api:ci
          trap 'docker rm -f jarvis-api-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs jarvis-api-ci
          exit 1

      - name: Validate original SQLite migration chain
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(pathlib.Path("migrations").glob("00[2-3]*_jarvis_*.sql"))
          expected = [f"{n:04d}" for n in range(25, 32)]
          actual = [p.name[:4] for p in migrations]
          if actual != expected:
              raise SystemExit(f"Expected migrations {expected}, found {actual}")
          for migration in migrations:
              db.executescript(migration.read_text())
              print(f"PASS {migration.name}")
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {
              "jarvis_tasks", "jarvis_context_items", "jarvis_task_context",
              "jarvis_action_proposals", "jarvis_proposal_decisions",
              "jarvis_audit_events", "jarvis_conversations", "jarvis_messages",
              "jarvis_orchestration_runs", "jarvis_orchestration_steps",
          }
          missing = required - tables
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))
          print("PASS all seven J.A.R.V.I.S. SQLite migrations applied in order")
          PY

      - name: Confirm owned-runtime source validation is not deployment
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'wrangler (deploy|d1 migrations apply)|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID' products/izakhono-jarvis/runner products/izakhono-jarvis/OWNED-RUNTIME-ARCHITECTURE.md; then
            echo "Unexpected Cloudflare deployment dependency in the owned-runtime worker boundary."
            exit 1
          fi
          echo "PASS source validation does not deploy or require Cloudflare credentials."
          echo "PostgreSQL integration runs against disposable CI only; production remains a separately gated operation."
