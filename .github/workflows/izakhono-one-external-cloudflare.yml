name: IZAKHONO ONE External Resilience

on:
  pull_request:
    paths:
      - 'products/izakhono-one/**'
      - 'RUN-IZAKHONO-ONE-NODE01.cmd'
      - '.github/workflows/izakhono-one-external-cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-one/**'
      - 'RUN-IZAKHONO-ONE-NODE01.cmd'
      - '.github/workflows/izakhono-one-external-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izakhono-one-external-resilience
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate IZAKHONO ONE source
        run: |
          node --check products/izakhono-one/server.mjs
          node --check products/izakhono-one/public/engine.js
          node --check products/izakhono-one/public/app.js
          node -e "const r=require('./products/izakhono-one/public/registry.json'); if(r.engine.tracking!==false) process.exit(1); if(!['search','service-discovery','routing','health','builder-integration'].every(x=>r.engine.capabilities.includes(x))) process.exit(1); const b=r.services.find(s=>s.slug==='izakhono-builder'); const expected='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub/builder'; if(!b||!b.featured||b.status!=='external-resilience'||b.publicUrl!==expected||b.integration?.externalRouteVerified!=='HTTPS_200_AND_VERIFIED_EXPERIENCE'||!b.integration?.engineIndependent) process.exit(1); if(r.services.some(s=>s.status==='gated' && s.publicUrl)) process.exit(1)"
          grep -q "IZAKHONO_BUILDER_INTERNAL_URL" products/izakhono-one/server.mjs
          grep -q "/api/builder/health" products/izakhono-one/server.mjs
          grep -q "IZAKHONO ONE.*SUPER APP" products/izakhono-one/public/index.html
      - name: Validate Cloudflare package
        run: npx wrangler deploy --dry-run --config products/izakhono-one/wrangler.external.jsonc

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check optional Cloudflare credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "IZAKHONO_ONE_CLOUDFLARE_GATE=READY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "IZAKHONO_ONE_CLOUDFLARE_GATE=OPTIONAL_CREDENTIALS_NOT_CONFIGURED"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        if: steps.gate.outputs.ready == 'true'
      - name: Deploy isolated Cloudflare resilience Worker
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy --config products/izakhono-one/wrangler.external.jsonc
      - name: Preserve verified Supabase resilience route
        if: steps.gate.outputs.ready != 'true'
        run: |
          echo "Cloudflare deployment was not attempted."
          echo "The independently probed Supabase BUILDER/SUPER APP resilience route remains the verified external path."
