name: Launch IZAKHONO Containers Alpha

on:
  push:
    branches: [main]
    paths:
      - "izakhono-containers/launch/**"
      - ".github/workflows/izakhono-containers-alpha-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "izakhono-containers-alpha-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: izakhono-containers/launch
      - id: deployment
        uses: actions/deploy-pages@v4
