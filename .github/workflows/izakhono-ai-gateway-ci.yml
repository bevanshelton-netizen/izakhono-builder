name: IZAKHONO AI GATEWAY CI

on:
  pull_request:
    paths:
      - 'products/izakhono-ai-gateway/**'
      - '.github/workflows/izakhono-ai-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-ai-gateway/**'
      - '.github/workflows/izakhono-ai-gateway-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile products/izakhono-ai-gateway/app.py products/izakhono-ai-gateway/test_gateway.py
      - name: Gateway tests
        run: python3 products/izakhono-ai-gateway/test_gateway.py

      - name: Windows activation script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem products/izakhono-ai-gateway -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Subscriber policy
        run: |
          set -euo pipefail
          grep -Fq 'usage_credit_gate' products/izakhono-ai-gateway/app.py
          grep -Fq 'message_quota' products/izakhono-ai-gateway/app.py
          grep -Fq 'subscription_required' products/izakhono-ai-gateway/app.py
          ! grep -R --line-number -E 'IZAKHONO_AI_GATEWAY_INTERNAL_KEY=.+' products/izakhono-ai-gateway
          ! grep -R --line-number -E 'IZAKHONO_AI_EXTERNAL_TEXT_API_KEY=[^<[:space:]][^[:space:]]+' products/izakhono-ai-gateway
          ! grep -R --line-number -E 'nvapi-[A-Za-z0-9_-]+' products/izakhono-ai-gateway
          grep -Fq 'ConvertFrom-SecureString' products/izakhono-ai-gateway/SET-EXTERNAL-AI-SECRET.ps1
          grep -Fq 'ConvertTo-SecureString' products/izakhono-ai-gateway/START-IZAKHONO-SUPER-AI-NODE01.ps1
          grep -Fq 'ACTIVATE-NVIDIA-NIM-DEV.cmd' products/izakhono-ai-gateway/README.md
          grep -Fq 'data_classification' products/izakhono-ai-gateway/app.py
          grep -Fq 'IZAKHONO_AI_OWNER_TEXT_URLS' products/izakhono-ai-gateway/app.py
          grep -Fq 'owner_runtime_allowed' products/izakhono-ai-gateway/app.py
          grep -Fq '/api/v1/runtimes' products/izakhono-ai-gateway/app.py
          grep -Fq 'OWNER-MODEL-POOL.env.example' products/izakhono-ai-gateway/README.md
          grep -Fq 'IZAKHONO_AI_MAX_INFLIGHT' products/izakhono-ai-gateway/app.py
          grep -Fq 'CapacityUnavailable' products/izakhono-ai-gateway/app.py
          grep -Fq 'capacity_unavailable' products/izakhono-ai-gateway/app.py
          grep -Fq 'owner_pool_begin' products/izakhono-ai-gateway/app.py
          grep -Fq 'Bounded queue and workload distribution' products/izakhono-ai-gateway/README.md
          grep -Fq 'IZAKHONO_AI_ROUTING_EWMA_ALPHA' products/izakhono-ai-gateway/app.py
          grep -Fq 'owner_candidate_score' products/izakhono-ai-gateway/app.py
          grep -Fq 'warm_owner_pool' products/izakhono-ai-gateway/app.py
          grep -Fq '/api/v1/warm' products/izakhono-ai-gateway/app.py
          grep -Fq 'WARM-OWNER-MODELS.cmd' products/izakhono-ai-gateway/README.md
          grep -Fq 'benchmark-aware routing' products/izakhono-ai-gateway/README.md
          grep -Fq 'izakhono-flow' products/izakhono-ai-gateway/app.py
          grep -Fq 'izakhono-flow' products/izakhono-ai-gateway/START-IZAKHONO-SUPER-AI-NODE01.ps1
          grep -Fq 'IZAKHONO FLOW advisory use' products/izakhono-ai-gateway/README.md
          grep -Fq 'izakhono.speech.generate.v1' products/izakhono-ai-gateway/app.py
          grep -Fq 'izakhono.video.scene.v1' products/izakhono-ai-gateway/app.py
          grep -Fq 'IZAKHONO_SPEECH_INTERNAL_KEY' products/izakhono-ai-gateway/app.py
          grep -Fq 'IZAKHONO_VIDEO_INTERNAL_KEY' products/izakhono-ai-gateway/app.py
          grep -Fq 'Portfolio-wide owned speech and video' products/izakhono-ai-gateway/README.md
          grep -Fq 'IZAKHONO_MEDIA_FABRIC_URL' products/izakhono-ai-gateway/app.py
          grep -Fq 'submit_media_fabric_job' products/izakhono-ai-gateway/app.py
          grep -Fq '/api/v1/media-jobs/' products/izakhono-ai-gateway/app.py
          grep -Fq 'durable_media_payloads' products/izakhono-ai-gateway/app.py
          grep -Fq 'Durable Media Runtime Fabric' products/izakhono-ai-gateway/README.md
          grep -Fq 'MEDIA_FABRIC_PRODUCTION_READY' products/izakhono-ai-gateway/START-IZAKHONO-SUPER-AI-NODE01.ps1
