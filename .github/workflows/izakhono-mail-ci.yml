name: IZAKHONO MAIL CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/mail-stack/**'
      - 'infra/izakhono-control-plane/controller/src/node01-mail-bridge.js'
      - 'infra/izakhono-control-plane/controller/src/node01-mail-bridge.test.js'
      - 'infra/izakhono-ci/**'
      - 'products/izakhono-mail/runtime-v1/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/izakhono-mail-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/mail-stack/**'
      - 'infra/izakhono-control-plane/controller/src/node01-mail-bridge.js'
      - 'infra/izakhono-control-plane/controller/src/node01-mail-bridge.test.js'
      - 'infra/izakhono-ci/**'
      - 'products/izakhono-mail/runtime-v1/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/izakhono-mail-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izakhono-mail-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail-validation:
    name: Mail validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate IZAKHONO MAIL engine
        run: npm run validate:mail

      - name: Validate NODE01 SMTP boundary
        run: node --check infra/mail-stack/engine/node01-mail-server.mjs

      - name: Validate NODE01 SMTP transaction
        run: node infra/mail-stack/engine/node01-mail-transaction.test.mjs

      - name: Validate NODE01 authenticated STARTTLS submission
        run: node infra/mail-stack/engine/node01-mail-submission-tls.test.mjs

      - name: Validate NODE01 outbound SMTP transport and reply loop
        run: node infra/mail-stack/engine/smtp-transport.test.mjs

      - name: Validate NODE01 real readiness probes
        run: |
          node --check infra/mail-stack/engine/node01-mail-probes.mjs
          node --check infra/mail-stack/engine/node01-mail-readiness-factory.mjs
          node infra/mail-stack/engine/node01-mail-probes.test.mjs
          node infra/mail-stack/engine/node01-mail-readiness-factory.test.mjs

      - name: Validate NODE01 mail security
        run: node infra/mail-stack/engine/node01-mail-security.test.mjs

      - name: Validate NODE01 durable runtime
        run: node infra/mail-stack/engine/node01-durable-mail-runtime.test.mjs

      - name: Validate NODE01 orchestrator
        run: node infra/mail-stack/engine/node01-mail-orchestrator.test.mjs

      - name: Validate NODE01 mail bridge
        run: node infra/izakhono-control-plane/controller/src/node01-mail-bridge.test.js

      - name: Validate transport and worker boundaries
        run: |
          node --check infra/mail-stack/engine/transport-engine.mjs
          node --check infra/mail-stack/engine/smtp-transport.mjs
          node --check infra/mail-stack/engine/mail-worker.mjs
          node --check infra/mail-stack/engine/mail-api.mjs

      - name: Validate runtime-v1 shell scripts
        working-directory: products/izakhono-mail/runtime-v1
        run: |
          for f in ops/*.sh; do bash -n "$f"; done

      - name: Validate runtime-v1 Docker Compose configuration
        working-directory: products/izakhono-mail/runtime-v1
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/ci-mailbox-password-123456789/g; s/CHANGE_ME_DB_PASSWORD/ci-roundcube-db-password-123456789/g' .env
          docker compose config --quiet

      - name: Validate runtime-v1 required files
        working-directory: products/izakhono-mail/runtime-v1
        run: |
          test -f docker-compose.yml
          test -f Caddyfile
          test -f .env.example
          test -f ops/bootstrap.sh
          test -f ops/preflight.sh
          test -f ops/PROVIDER-ACCEPTANCE.sh
          test -f ops/PROVISION-CONTABO.md

      - name: Verify no production secrets are tracked
        run: |
          if git grep -n -E 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|MAILBOX_PASSWORD=[^C]|ROUNDCUBE_DB_PASSWORD=[^C]' -- products/izakhono-mail/runtime-v1; then
            echo 'Tracked production secret material detected.'
            exit 1
          fi

      - name: Run owned IZAKHONO CI
        run: node infra/izakhono-ci/run-ci.mjs

      - name: Report independent mail gate
        run: |
          echo '[PASS] IZAKHONO MAIL has an independent CI validation gate.'
          echo '[PASS] Validation covers NODE01 SMTP transactions, authenticated STARTTLS submission, outbound SMTP reply-loop transport, security, persistence, orchestration and real probe execution.'
          echo '[GATE] Real public-host SMTP/STARTTLS/provider acceptance remains evidence-gated.'
