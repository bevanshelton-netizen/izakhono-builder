name: IZAKHONO ONE Validation

on:
  push:
    paths:
      - 'products/izakhono-one/**'
      - '.github/workflows/izakhono-one.yml'
  pull_request:
    paths:
      - 'products/izakhono-one/**'
      - '.github/workflows/izakhono-one.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: products/izakhono-one/package.json
      - name: Node syntax check
        run: npm run check
      - name: Contract validation
        run: npm run contracts
      - name: Policy validation
        run: npm run policy
      - name: Smoke validation
        run: npm run test
