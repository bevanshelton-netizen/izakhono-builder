name: IZAKHONO ONE Foundation

on:
  push:
    paths:
      - 'products/izakhono-one/**'
      - '.github/workflows/izakhono-one.yml'
  pull_request:
    paths:
      - 'products/izakhono-one/**'
      - '.github/workflows/izakhono-one.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/izakhono-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
