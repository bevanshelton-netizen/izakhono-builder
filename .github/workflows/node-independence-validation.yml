name: NODE Independence Validation

on:
  push:
    branches: [main, 'feat/node-independence-v1']
    paths:
      - 'infra/node-independence/**'
      - 'docs/NODE-INDEPENDENCE-V1.md'
      - '.github/workflows/node-independence-validation.yml'
  pull_request:
    paths:
      - 'infra/node-independence/**'
      - 'docs/NODE-INDEPENDENCE-V1.md'
      - '.github/workflows/node-independence-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate node registry
        run: python - <<'PY'
          import json
          from pathlib import Path
          p = Path('infra/node-independence/node-registry.v1.json')
          d = json.loads(p.read_text())
          nodes = d['nodes']
          assert len(nodes) >= 4, 'N+3 node capacity is required'
          ids = {n['id'] for n in nodes}
          assert {'NODE01','NODE02','NODE03','NODE04'} <= ids
          assert d['rules']['never_wait_for_primary'] is True
          assert d['rules']['preserve_external_fallback'] is True
          assert d['rules']['promotion_requires_health'] is True
          for n in nodes:
              assert n['health_url'].startswith('http')
              assert n['enabled'] is True
          print('NODE Independence registry: PASS')
          print('Nodes:', ', '.join(sorted(ids)))
        PY
      - name: Compile guardian
        run: python -m py_compile infra/node-independence/guardian.py
      - name: Static safety check
        run: |
          ! grep -RniE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' infra/node-independence docs/NODE-INDEPENDENCE-V1.md
