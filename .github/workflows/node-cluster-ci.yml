name: IZAKHONO Node Cluster CI

on:
  pull_request:
    paths:
      - "infra/node-cluster/**"
      - ".github/workflows/node-cluster-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/node-cluster/**"
      - ".github/workflows/node-cluster-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n infra/node-cluster/bootstrap-primary.sh
          bash -n infra/node-cluster/join-replica.sh
          bash -n infra/node-cluster/backup.sh
          bash -n infra/node-cluster/verify-cluster.sh

      - name: Architecture invariants
        run: |
          grep -q "preferredPrimary: node01" infra/node-cluster/topology.yaml
          grep -q "minimumHealthy: 2" infra/node-cluster/topology.yaml
          grep -q "publicIngressOnlyThrough: IZAKHONO_EDGE" infra/node-cluster/topology.yaml
          grep -q "secrets-encryption: true" infra/node-cluster/bootstrap-primary.sh
          grep -q "wireguard-native" infra/node-cluster/bootstrap-primary.sh
          grep -q "NODE 04 is intentionally a worker/DR node" infra/node-cluster/join-replica.sh

      - name: Secret hygiene
        run: |
          ! grep -R -E 'K3S_TOKEN=.{8,}|RESTIC_PASSWORD_FILE=.*password[^[:space:]]+' infra/node-cluster/cluster.env.example

      - name: Cluster build proof
        run: |
          echo "IZAKHONO_NODE_CLUSTER_SOFTWARE=PASS"
          echo "PHYSICAL_NODE_VALIDATION=PENDING"
