name: IZAKHONO Forge CI

on:
  pull_request:
    paths:
      - 'apps/izakhono-forge/**'
      - '.github/workflows/izakhono-forge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/izakhono-forge/**'
      - '.github/workflows/izakhono-forge-ci.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-forge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/izakhono-forge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build Forge
        run: npm run build
