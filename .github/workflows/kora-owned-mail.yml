name: KORA Owned Mail Release

on:
  push:
    paths:
      - 'infra/mail-stack/kora/**'
      - 'infra/mail-stack/engine/node01-mail-production-probes.mjs'
      - 'infra/runtime-fabric/workloads/kora-mail.json'
      - 'infra/runtime-fabric/activation/KORA-MAIL-ACTIVATE.sh'
      - 'infra/runtime-fabric/acceptance/KORA-MAIL-LIVE-GATE.sh'
      - '.github/workflows/kora-owned-mail.yml'
  workflow_dispatch:

concurrency:
  group: kora-owned-mail-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and validate KORA mail release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workload contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('infra/runtime-fabric/workloads/kora-mail.json')
          data = json.loads(p.read_text())
          assert data['workload'] == 'kora-mail'
          assert data['hostname'] == 'mail.streamkoraafrica.com'
          assert data['identity'] == 'info@streamkoraafrica.com'
          assert data['runtime']['mode'] == 'node-agnostic'
          assert data['runtime']['preferred_nodes'] == ['node01', 'node02', 'node03', 'node04']
          assert data['acceptance']['promotion'] == 'LIVE_VERIFIED only after all acceptance gates pass'
          print('KORA mail workload contract: PASS')
          PY

      - name: Validate shell scripts
        run: |
          bash -n infra/mail-stack/kora/PROVISION-KORA-MAIL.sh
          bash -n infra/mail-stack/kora/VERIFY-KORA-MAIL.sh
          bash -n infra/runtime-fabric/activation/KORA-MAIL-ACTIVATE.sh
          bash -n infra/runtime-fabric/acceptance/KORA-MAIL-LIVE-GATE.sh
          echo 'KORA mail shell syntax: PASS'

      - name: Validate production probe syntax
        run: node --check infra/mail-stack/engine/node01-mail-production-probes.mjs

      - name: Build deployment bundle
        run: |
          mkdir -p dist/kora-mail/runtime-fabric/activation dist/kora-mail/runtime-fabric/acceptance
          cp -r infra/mail-stack/kora dist/kora-mail/
          cp infra/mail-stack/engine/node01-mail-production-probes.mjs dist/kora-mail/
          cp infra/runtime-fabric/workloads/kora-mail.json dist/kora-mail/
          cp infra/runtime-fabric/activation/KORA-MAIL-ACTIVATE.sh dist/kora-mail/runtime-fabric/activation/
          cp infra/runtime-fabric/acceptance/KORA-MAIL-LIVE-GATE.sh dist/kora-mail/runtime-fabric/acceptance/
          tar -C dist -czf kora-mail-release.tar.gz kora-mail
          sha256sum kora-mail-release.tar.gz | tee kora-mail-release.sha256

      - name: Publish release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kora-mail-release
          path: |
            kora-mail-release.tar.gz
            kora-mail-release.sha256

      - name: State activation boundary
        run: |
          echo 'Release package validated.'
          echo 'Runtime activation is node-fabric controlled, not GitHub-hosted.'
          echo 'The bundle contains node-agnostic activation and LIVE promotion gates.'
          echo 'No DNS, MX, TLS, mailbox or public-route changes are performed by this CI job.'
          echo 'LIVE_VERIFIED remains blocked until real external send, receive, reply and authentication evidence exists.'
