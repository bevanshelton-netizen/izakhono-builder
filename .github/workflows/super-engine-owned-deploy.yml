name: IZAKHONO Super Engine Owned Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-super-engine/**'
      - 'infra/app-fabric-runtime/super-engine.compose.yml'
      - 'infra/runtime/**'
      - '.github/workflows/super-engine-owned-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-super-engine-owned-production
  cancel-in-progress: false

env:
  IMAGE: izakhono/super-engine
  RELEASE_ROUTE: https://super-engine.izakhono.co.za

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Super Engine
        run: npm run super-engine:payment:typecheck
      - name: Run Super Engine tests
        run: npm run super-engine:payment:test
      - name: Build container
        run: docker build -f products/izakhono-super-engine/Dockerfile -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name izakhono-super-engine-smoke -p 8787:8787 "$IMAGE:${GITHUB_SHA}"
          trap 'docker stop izakhono-super-engine-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs izakhono-super-engine-smoke
          exit 1
      - name: Generate immutable release receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_id=$(docker image inspect "$IMAGE:${GITHUB_SHA}" --format '{{.Id}}')
          digest="sha256:${image_id#sha256:}"
          node - <<'NODE'
          const fs = require('fs');
          const receipt = {
            schema: 'izakhono.release/v1',
            application: { slug: 'izakhono-super-engine' },
            runtime: { port: 8787, healthPath: '/health', network: 'izakhono-edge' },
            routes: { public_https: process.env.RELEASE_ROUTE },
            release: { source: process.env.SOURCE_SHA, artifact_digest: process.env.ARTIFACT_DIGEST },
          };
          if (!receipt.routes.public_https.startsWith('https://')) throw new Error('HTTPS route required');
          if (!/^sha256:[a-f0-9]{64}$/.test(receipt.release.artifact_digest)) throw new Error('Immutable artifact digest required');
          fs.mkdirSync('release-artifacts', { recursive: true });
          fs.writeFileSync('release-artifacts/super-engine.release.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
        env:
          ARTIFACT_DIGEST: ${{ env.IMAGE }}
      - name: Validate release receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f release-artifacts/super-engine.release.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('release-artifacts/super-engine.release.json', 'utf8'));
          if (c.schema !== 'izakhono.release/v1') throw new Error('invalid release schema');
          if (c.application.slug !== 'izakhono-super-engine') throw new Error('invalid application');
          if (c.runtime.port !== 8787 || c.runtime.healthPath !== '/health') throw new Error('invalid runtime contract');
          if (c.runtime.network !== 'izakhono-edge') throw new Error('invalid owned network');
          if (!c.routes.public_https.startsWith('https://')) throw new Error('HTTPS route required');
          if (c.release.source !== process.env.SOURCE_SHA) throw new Error('source provenance mismatch');
          if (!/^sha256:[a-f0-9]{64}$/.test(c.release.artifact_digest)) throw new Error('invalid immutable digest');
          NODE
      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: super-engine-release-receipt-${{ github.sha }}
          path: release-artifacts/super-engine.release.json

  owned-runtime:
    needs: build
    runs-on: [self-hosted, izakhono-owned, linux]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require owned runtime marker
        shell: bash
        run: |
          set -euo pipefail
          test "${IZAKHONO_OWNED_RUNTIME:-}" = "true" || {
            echo "IZAKHONO_OWNED_RUNTIME=true is required on the owned production runner."
            exit 10
          }
      - name: Deploy Super Engine candidate
        shell: bash
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          export IZAKHONO_SUPER_ENGINE_TAG="$TAG"
          docker compose -f infra/app-fabric-runtime/super-engine.compose.yml up -d --build super_engine
      - name: Verify Super Engine health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker inspect --format '{{.State.Health.Status}}' super_engine 2>/dev/null | grep -q healthy; then
              docker inspect --format '{{json .State.Health}}' super_engine
              exit 0
            fi
            sleep 2
          done
          docker logs super_engine || true
          exit 1
      - name: Verify service endpoint
        run: curl -fsS http://127.0.0.1:8787/health
