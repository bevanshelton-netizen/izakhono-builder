name: IZAKHONO Super Engine Owned Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-super-engine/**'
      - 'infra/app-fabric-runtime/super-engine.compose.yml'
      - 'infra/runtime/**'
      - '.github/workflows/super-engine-owned-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-super-engine-owned-production
  cancel-in-progress: false

env:
  IMAGE: izakhono/super-engine
  RELEASE_ROUTE: https://super-engine.izakhono.co.za
  ARTIFACT_NAME: izakhono-super-engine-image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Super Engine
        run: npm run super-engine:payment:typecheck
      - name: Run Super Engine tests
        run: npm run super-engine:payment:test
      - name: Build container
        run: docker build -f products/izakhono-super-engine/Dockerfile -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name izakhono-super-engine-smoke -p 8787:8787 "$IMAGE:${GITHUB_SHA}"
          trap 'docker stop izakhono-super-engine-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs izakhono-super-engine-smoke
          exit 1
      - name: Export exact tested image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE:${GITHUB_SHA}" >/dev/null
          docker save "$IMAGE:${GITHUB_SHA}" -o izakhono-super-engine-image.tar
          sha256sum izakhono-super-engine-image.tar > izakhono-super-engine-image.tar.sha256
      - name: Publish exact tested image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            izakhono-super-engine-image.tar
            izakhono-super-engine-image.tar.sha256
          if-no-files-found: error
          retention-days: 7

  owned-runtime:
    needs: build
    runs-on: [self-hosted, izakhono-owned, linux]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require owned runtime marker
        shell: bash
        run: |
          set -euo pipefail
          test "${IZAKHONO_OWNED_RUNTIME:-}" = "true" || {
            echo "IZAKHONO_OWNED_RUNTIME=true is required on the owned production runner."
            exit 10
          }
      - name: Retrieve exact tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/izakhono-super-engine-artifact
      - name: Verify and load exact tested image
        shell: bash
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/izakhono-super-engine-artifact
          sha256sum -c izakhono-super-engine-image.tar.sha256
          docker load -i izakhono-super-engine-image.tar
          docker image inspect "$IMAGE:$TAG" >/dev/null
          image_id=$(docker image inspect "$IMAGE:$TAG" --format '{{.Id}}')
          case "$image_id" in
            sha256:[a-f0-9]{64}) ;;
            *) echo "[FAIL] Loaded image ID is not immutable: $image_id" >&2; exit 1 ;;
          esac
          printf '%s\n' "$image_id" > /tmp/izakhono-super-engine-image-id
          echo "[PASS] Exact tested image loaded: $image_id"
      - name: Deploy exact tested candidate without rebuild
        shell: bash
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          export IZAKHONO_SUPER_ENGINE_TAG="$TAG"
          docker compose -f infra/app-fabric-runtime/super-engine.compose.yml up -d super_engine
      - name: Generate owned-runtime release receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo 'jq is required'; exit 1; }
          image_id=$(cat /tmp/izakhono-super-engine-image-id)
          digest="$image_id"
          mkdir -p /opt/izakhono/state/releases/izakhono-super-engine
          jq -n \
            --arg source "$SOURCE_SHA" \
            --arg digest "$digest" \
            --arg route "$RELEASE_ROUTE" \
            '{schema:"izakhono.release/v1",application:{slug:"izakhono-super-engine"},runtime:{port:8787,healthPath:"/health",network:"izakhono-edge"},routes:{public_https:$route},release:{source:$source,artifact_digest:$digest}}' \
            > /opt/izakhono/state/releases/izakhono-super-engine/candidate.json
      - name: Verify Super Engine container health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker inspect --format '{{.State.Health.Status}}' super_engine 2>/dev/null | grep -q healthy; then
              docker inspect --format '{{json .State.Health}}' super_engine
              exit 0
            fi
            sleep 2
          done
          docker logs super_engine || true
          exit 1
      - name: Verify local service endpoint
        run: curl -fsS http://127.0.0.1:8787/health
      - name: ACCEPTANCE — verify owned release and public HTTPS
        shell: bash
        env:
          IZAKHONO_SUPER_ENGINE_ROUTE: ${{ env.RELEASE_ROUTE }}
        run: sudo infra/runtime/VERIFY-OWNED-SUPER-ENGINE-RELEASE.sh
      - name: PROMOTE — record accepted release through owned release adapter
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -x /opt/izakhono/bin/izakhono-release || {
            echo '[FAIL] /opt/izakhono/bin/izakhono-release is not installed on the owned node.'
            exit 20
          }
          artifact=$(jq -r '.release.artifact_digest' /opt/izakhono/state/releases/izakhono-super-engine/candidate.json)
          test "$artifact" = "$(cat /tmp/izakhono-super-engine-image-id)" || {
            echo '[FAIL] Candidate artifact does not match the exact tested image.'
            exit 21
          }
          /opt/izakhono/bin/izakhono-release promote \
            --application izakhono-super-engine \
            --source "$SOURCE_SHA" \
            --artifact "$artifact"
          echo '[PASS] Owned release promoted after acceptance with exact artifact provenance'
