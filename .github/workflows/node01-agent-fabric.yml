name: NODE01 Agent Fabric

on:
  push:
    paths:
      - 'products/node01-agent-fabric/**'
      - '.github/workflows/node01-agent-fabric.yml'
  pull_request:
    paths:
      - 'products/node01-agent-fabric/**'
      - '.github/workflows/node01-agent-fabric.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/node01-agent-fabric
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI health
        run: PYTHONPATH=src python -m node01 --health
      - name: Integrated objective smoke test
        run: PYTHONPATH=src python -m node01 --objective "validate control plane" --integrated
