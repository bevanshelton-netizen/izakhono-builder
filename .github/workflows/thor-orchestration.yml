name: THOR orchestration tests

on:
  pull_request:
    paths:
      - "products/thor-control-plane/**"
      - ".github/workflows/thor-orchestration.yml"
  push:
    paths:
      - "products/thor-control-plane/**"
      - ".github/workflows/thor-orchestration.yml"

permissions:
  contents: read

jobs:
  thor-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Docker sandbox runtime
        run: docker info

      - name: Pull pinned sandbox image
        run: docker pull node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee

      - name: Run THOR orchestration and sandbox tests
        run: node --test products/thor-control-plane/src/*.test.mjs
