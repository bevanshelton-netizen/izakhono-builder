name: KORA Software NODE Runtime Gate

on:
  push:
    paths:
      - 'autonomy/**'
      - 'products/izakhono-host/**'
      - '.github/workflows/kora-software-node-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KORA_SOURCE_SHA: d15d4a4dbcc54a3569bf52715de1c7ddfa224049

jobs:
  kora-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IZAKHONO Builder
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instantiate Software NODE
        env:
          IZAKHONO_NODE_ID: github-software-node-kora
          IZAKHONO_NODE_SUBSTRATE: github-actions-software-node
        run: |
          set -euo pipefail
          node autonomy/software-node.mjs '{"operation":"instantiate"}' | tee /tmp/software-node.json
          node autonomy/software-node.mjs '{"operation":"heartbeat"}' | tee /tmp/node-heartbeat.json
          node autonomy/software-node.mjs '{"operation":"promote","requestId":"kora-runtime-gate"}' | tee /tmp/node-promotion.json

      - name: Build KORA portable image
        run: |
          set -euo pipefail
          git init /tmp/izakhono-downloads
          git -C /tmp/izakhono-downloads remote add origin https://github.com/bevanshelton-netizen/Downloads.git
          git -C /tmp/izakhono-downloads fetch --depth 1 origin "$KORA_SOURCE_SHA"
          git -C /tmp/izakhono-downloads checkout --detach FETCH_HEAD
          test "$(git -C /tmp/izakhono-downloads rev-parse HEAD)" = "$KORA_SOURCE_SHA"
          printf '{"repository":"bevanshelton-netizen/Downloads","commit":"%s"}\n' "$KORA_SOURCE_SHA" >/tmp/kora-source-revision.json
          docker build -t kora-network:portable /tmp/izakhono-downloads/kora-network
          docker image inspect kora-network:portable >/tmp/kora-image.json

      - name: Execute KORA workload on Software NODE
        env:
          IZAKHONO_NODE_ID: github-software-node-kora
          IZAKHONO_DRY_RUN: 'false'
          KORA_IMAGE: kora-network:portable
          KORA_CONTAINER_NAME: kora-software-node-gate
          KORA_PORT: '3000'
          KORA_HEALTH_ATTEMPTS: '30'
          KORA_HEALTH_DELAY_SECONDS: '2'
        run: |
          set -euo pipefail
          node autonomy/kora-workload-executor.mjs | tee /tmp/kora-runtime.json

      - name: Diagnose current public KORA routes without weakening acceptance
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 --output /dev/null --dump-header /tmp/kora-public-home.headers --write-out '%{http_code}\n' https://streamkoraafrica.com/ >/tmp/kora-public-home.status
          curl --silent --show-error --max-time 30 --output /tmp/kora-public-health.body --dump-header /tmp/kora-public-health.headers --write-out '%{http_code}\n' https://streamkoraafrica.com/api/health >/tmp/kora-public-health.status || echo 'curl_transport_error=true' >/tmp/kora-public-health.transport-error
          python - <<'PY'
          import json
          from pathlib import Path
          status=int(Path('/tmp/kora-public-health.status').read_text().strip() or '0')
          headers=Path('/tmp/kora-public-health.headers').read_text(errors='replace')
          body=Path('/tmp/kora-public-health.body').read_text(errors='replace')
          try:
              payload=json.loads(body)
          except Exception:
              payload=None
          print(f'Public homepage HTTP: {Path("/tmp/kora-public-home.status").read_text().strip()}')
          print(f'Public health HTTP: {status}')
          for line in headers.splitlines():
              if line.lower().startswith(('server:', 'via:', 'location:', 'cf-ray:', 'x-vercel-id:', 'x-powered-by:', 'cache-control:')):
                  print(line)
          print(f'Public health JSON ok: {payload.get("ok") if isinstance(payload, dict) else "not-json"}')
          print(f'Public health body preview: {body[:1000]!r}')
          if status != 200 or not isinstance(payload, dict) or payload.get('ok') is not True:
              raise SystemExit('Public KORA health route acceptance failed; diagnostic response retained as artifact.')
          print('[PASS] Current public KORA route is healthy. This does not prove routing to the Software NODE.')
          PY

      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kora-software-node-runtime-evidence
          path: |
            /tmp/software-node.json
            /tmp/node-heartbeat.json
            /tmp/node-promotion.json
            /tmp/kora-image.json
            /tmp/kora-source-revision.json
            /tmp/kora-runtime.json
            /tmp/kora-public-health.body
            /tmp/kora-public-health.headers
            /tmp/kora-public-health.status
            /tmp/kora-public-health.transport-error
            /tmp/kora-public-home.headers
            /tmp/kora-public-home.status
            autonomy/workload-execution.json
          if-no-files-found: warn
