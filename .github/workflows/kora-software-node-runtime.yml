name: KORA Software NODE Runtime Gate

on:
  push:
    paths:
      - 'autonomy/**'
      - 'products/izakhono-host/**'
      - '.github/workflows/kora-software-node-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kora-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IZAKHONO Builder
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instantiate ephemeral CI Software NODE
        env:
          IZAKHONO_NODE_ID: ci-software-node-kora
          IZAKHONO_NODE_SUBSTRATE: github-actions-ephemeral-ci
        run: |
          set -euo pipefail
          node autonomy/software-node.mjs '{"operation":"instantiate"}' | tee /tmp/software-node.json
          node autonomy/software-node.mjs '{"operation":"heartbeat"}' | tee /tmp/node-heartbeat.json

      - name: Build KORA portable image
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bevanshelton-netizen/Downloads.git /tmp/izakhono-downloads
          docker build -t kora-network:portable /tmp/izakhono-downloads/kora-network
          docker image inspect kora-network:portable >/tmp/kora-image.json

      - name: Smoke-test KORA workload on ephemeral CI runner
        env:
          IZAKHONO_NODE_ID: ci-software-node-kora
          IZAKHONO_DRY_RUN: 'false'
          IZAKHONO_KORA_CI_SMOKE_TEST: 'true'
          KORA_IMAGE: kora-network:portable
          KORA_CONTAINER_NAME: kora-ci-smoke
          KORA_PORT: '3000'
          KORA_HEALTH_ATTEMPTS: '30'
          KORA_HEALTH_DELAY_SECONDS: '2'
        run: |
          set -euo pipefail
          node autonomy/kora-workload-executor.mjs | tee /tmp/kora-runtime.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/kora-runtime.json'))
          if payload.get('status') != 'running-awaiting-acceptance-evidence':
              raise SystemExit('KORA ephemeral runtime did not actually start: ' + str(payload.get('reason') or payload.get('status')))
          required = {'image-built', 'container-started', 'health-200', 'runtime-healthy', 'service-connectivity', 'runtime-acceptance-recorded'}
          evidence = {item.get('name'): item.get('status') for item in payload.get('evidence', [])}
          missing = sorted(name for name in required if evidence.get(name) != 'passed')
          if missing:
              raise SystemExit('KORA ephemeral runtime evidence incomplete: ' + ', '.join(missing))
          print('[PASS] Ephemeral KORA container started and passed health/connectivity checks.')
          PY

      - name: Verify configured public KORA route (optional external check)
        env:
          KORA_PUBLIC_HEALTH_URL: ${{ vars.KORA_PUBLIC_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${KORA_PUBLIC_HEALTH_URL}" ]; then
            echo '[SKIPPED] KORA_PUBLIC_HEALTH_URL is not configured; public routing remains unverified.'
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 2 "${KORA_PUBLIC_HEALTH_URL}" >/tmp/kora-public-health.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/kora-public-health.json'))
          if payload.get('ok') is not True:
              raise SystemExit('Configured public KORA health endpoint did not return ok=true')
          print('[PASS] Configured public KORA health endpoint is healthy. This does not prove routing to an owned Software NODE.')
          PY

      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kora-ephemeral-ci-runtime-evidence
          path: |
            /tmp/software-node.json
            /tmp/node-heartbeat.json
            /tmp/kora-image.json
            /tmp/kora-runtime.json
            /tmp/kora-public-health.json
            autonomy/workload-execution.json
          if-no-files-found: warn
