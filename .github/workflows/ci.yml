name: IZAKHONO Builder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck + Wrangler dry run
        run: npm run validate

      - name: Validate generated Worker asset contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/secure.ts').read_text(encoding='utf-8')
          required = [
              "assets: { directory: './public', binding: 'ASSETS' }",
              "if (env.ASSETS) return env.ASSETS.fetch(req);",
              "name: 'static_asset_fallback'",
              "worker.includes('env.ASSETS.fetch(req)')",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Generated Worker static asset contract missing: ' + ', '.join(missing))
          print('[PASS] Generated Workers must route non-API requests through the ASSETS binding.')
          PY

      - name: Build generated Worker canary
        shell: bash
        run: |
          npx tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext fixtures/generated-worker-canary/src/index.ts
          npx wrangler deploy --dry-run --config fixtures/generated-worker-canary/wrangler.jsonc
          echo '[PASS] Generated Worker + static asset canary typechecks and passes Wrangler dry run.'

      - name: Validate repository autopilot contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          secure = Path('src/secure.ts').read_text(encoding='utf-8')
          repo = Path('src/repository.ts').read_text(encoding='utf-8')
          cf_token_ref = '$' + '{{ secrets.CLOUDFLARE_API_TOKEN }}'
          cf_account_ref = '$' + '{{ secrets.CLOUDFLARE_ACCOUNT_ID }}'

          secure_required = [
              'generatedRepositoryFiles',
              'validateRepositoryFiles',
              '/api/automation-capabilities',
              '/publish-repository',
              "next_gate: validation.passed ? 'repository_publish_ready'",
              'repository_ready: true',
              'versioned_preview_revision',
          ]
          repo_required = [
              "visibility: 'private'",
              'overwrite_existing: false',
              'GITHUB_AUTOMATION_TOKEN',
              'GITHUB_OWNER',
              "createPath = kind === 'org'",
              '/git/blobs',
              '/git/trees',
              '/git/commits',
              '/git/refs/heads/',
              cf_token_ref,
              cf_account_ref,
              'Repository already exists; IZAKHONO will not overwrite it.',
          ]

          missing = [f'secure:{x}' for x in secure_required if x not in secure]
          missing += [f'repository:{x}' for x in repo_required if x not in repo]
          if missing:
              raise SystemExit('Repository autopilot contract missing: ' + ', '.join(missing))
          if "'  pull_request_target:'" in repo or '"  pull_request_target:"' in repo:
              raise SystemExit('Generated preview workflow must not emit pull_request_target.')
          if "private: false" in repo:
              raise SystemExit('Repository publisher must not create public repositories by default.')
          print('[PASS] Repository autopilot is private-by-default, non-overwriting, CI-ready and credential-gated.')
          PY

      - name: Validate Fast Build templates
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path, PurePosixPath

          p = Path('templates/izakhono.manifest.example.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for key in ('name','slug','build_context','dockerfile_path','container_port','health_path'):
              if key not in data:
                  raise SystemExit(f'missing template field: {key}')
          for key in ('build_context','dockerfile_path'):
              q = PurePosixPath(str(data[key]))
              if q.is_absolute() or '..' in q.parts:
                  raise SystemExit(f'unsafe template path: {key}')
          if not 1 <= int(data['container_port']) <= 65535:
              raise SystemExit('template port out of range')
          if not str(data['health_path']).startswith('/'):
              raise SystemExit('template health_path must start with /')
          alpha = data.get('alpha') or {}
          for key in ('preflight','rehearsal','windows_package'):
              if not isinstance(alpha.get(key, False), bool):
                  raise SystemExit(f'alpha.{key} must be boolean')

          caller = Path('templates/call-izakhono-alpha.yml').read_text(encoding='utf-8')
          policy = r'bevanshelton-netizen/izakhono-builder/\.github/workflows/izakhono-build-to-alpha\.yml@([0-9a-f]{40})'
          match = re.search(policy, caller)
          if not match:
              raise SystemExit('Alpha caller template must pin the Builder policy to an immutable 40-character commit SHA.')
          if '@main' in caller or '@master' in caller:
              raise SystemExit('Alpha caller template must not follow a mutable branch.')
          print(f'[PASS] IZAKHONO Fast Build templates are valid; caller policy pin={match.group(1)}.')
          PY

      - name: Parse reusable workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/izakhono-build-to-alpha.yml').read_text(encoding='utf-8')
          required = [
              'workflow_call:',
              'Validate IZAKHONO manifest',
              'Project preflight',
              'Central fixed preflight policy',
              'caller repository supplied no executable preflight policy',
              'Build application',
              'Health gate',
              'Database / application rehearsal',
              'Package Windows Alpha kit',
              'One clear Alpha result',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Reusable Alpha workflow missing: ' + ', '.join(missing))
          if 'run: bash scripts/izakhono/alpha-preflight.sh' in text:
              raise SystemExit('Central Alpha workflow must not execute caller-provided preflight shell.')
          print('[PASS] Central IZAKHONO Build to Alpha trust boundary is present.')
          PY
