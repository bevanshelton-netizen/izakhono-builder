name: CONNECTA External Pages

on:
  push:
    branches: [main]
    paths:
      - 'products/izakhono-social/public-external/**'
      - '.github/workflows/connecta-external-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: connecta-external-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare CONNECTA Pages artifact
        run: |
          mkdir -p _site/connecta
          cp products/izakhono-social/public-external/index.html _site/connecta/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy CONNECTA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
