name: IZAKHONO HOST Build Boundary Contract

on:
  pull_request:
    paths:
      - "products/izakhono-host/BUILD-EXECUTION-BOUNDARY-V1.md"
      - "products/izakhono-host/runtime/compute-worker/**"
      - ".github/workflows/izakhono-host-build-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate documented isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          doc=products/izakhono-host/BUILD-EXECUTION-BOUNDARY-V1.md
          test -s "$doc"
          for required in \
            "No Docker socket" \
            "No privileged container" \
            "Rootless execution" \
            "Ephemeral workspace" \
            "Controlled egress" \
            "Artifact-only handoff" \
            "Fail closed" \
            "Required automated test matrix" \
            "B0 audit" \\
            "Definition of done"; do
            grep -Fq "$required" "$doc" || { echo "Missing build boundary invariant: $required" >&2; exit 1; }
          done

      - name: Confirm general compute worker remains non-shell and allowlisted
        shell: bash
        run: |
          set -euo pipefail
          worker=products/izakhono-host/runtime/compute-worker/worker.mjs
          grep -Fq "const CAPABILITIES=['health-check','sha256','echo'];" "$worker"
          grep -Fq "if(job.type==='health-check')" "$worker"
          ! grep -Eiq "child_process|execSync|spawn\(" "$worker"
          echo "[PASS] General compute worker retains its fixed task allow-list and no shell execution APIs."
