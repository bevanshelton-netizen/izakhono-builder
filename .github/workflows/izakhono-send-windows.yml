name: IZAKHONO SEND Windows EXE

on:
  pull_request:
    paths:
      - 'products/izakhono-send/**'
      - '.github/workflows/izakhono-send-windows.yml'
  push:
    branches: [main]
    paths:
      - 'products/izakhono-send/**'
      - '.github/workflows/izakhono-send-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and functional test
        run: python products/izakhono-send/test_send.py
      - name: Build standalone EXE
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --name IZAKHONO-SEND products/izakhono-send/app.py
      - name: Verify EXE version
        run: .\dist\IZAKHONO-SEND.exe --version
      - name: Verify real Windows activation
        shell: powershell
        run: |
          $env:IZAKHONO_SEND_NO_BROWSER="1"
          $p = Start-Process -FilePath ".\dist\IZAKHONO-SEND.exe" -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:8787/healthz" -TimeoutSec 2
                if ($r.ok -eq $true -and $r.service -eq "izakhono-send") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "IZAKHONO SEND did not activate on 127.0.0.1:8787" }
            $proof = Join-Path $env:LOCALAPPDATA "IzakhonoSend\activation-proof.json"
            if (-not (Test-Path $proof)) { throw "Activation proof was not created" }
            Get-Content $proof
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: SHA256
        shell: powershell
        run: Get-FileHash .\dist\IZAKHONO-SEND.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: IZAKHONO-SEND-WINDOWS
          path: |
            dist/IZAKHONO-SEND.exe
            products/izakhono-send/START-IZAKHONO-SEND.cmd
            products/izakhono-send/CHECK-IZAKHONO-SEND.cmd
          if-no-files-found: error
