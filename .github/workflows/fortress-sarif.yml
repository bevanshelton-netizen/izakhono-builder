name: fortress-sarif

on:
  push:
    paths:
      - 'products/fortress-security/**'
      - '.github/workflows/fortress-sarif.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'products/fortress-security/**'
      - '.github/workflows/fortress-sarif.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  fortress-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run fortress:typecheck
      - run: npm run fortress:test
      - name: Generate authorized-scope FORTRESS evidence
        env:
          FORTRESS_AUTHORIZED_SCAN: '1'
        run: npx --yes tsx@4.20.3 products/fortress-security/src/cli.ts products/fortress-security/scope.example.json --json fortress-report.json --sarif fortress.sarif --no-fail
      - name: Archive FORTRESS evidence
        uses: actions/upload-artifact@v4
        with:
          name: fortress-security-evidence
          path: |
            fortress-report.json
            fortress.sarif
          if-no-files-found: error
          retention-days: 30
