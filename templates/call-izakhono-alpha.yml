name: IZAKHONO Build to Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  alpha:
    # Immutable reviewed policy pin. Upgrade this SHA only through a reviewed Builder change.
    uses: bevanshelton-netizen/izakhono-builder/.github/workflows/izakhono-build-to-alpha.yml@efbb9fc15f95d9123a12079bf11f9d8a22769edc
    with:
      manifest_path: .izakhono.json
