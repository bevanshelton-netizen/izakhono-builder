<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7faf9">
<title>IZAKHONO NAV</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18302f;background:#f7faf9;--ink:#18302f;--muted:#6f8583;--teal:#168b80;--teal-soft:#e4f4f1;--line:#dce8e5;--card:#ffffffee}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf9}button,input{font:inherit}.app{height:100dvh;position:relative;overflow:hidden;background:#f7faf9}
.map{position:absolute;inset:0;background:#edf4f2;background-image:linear-gradient(rgba(42,103,96,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(42,103,96,.075) 1px,transparent 1px);background-size:46px 46px}
.map:before,.map:after{content:"";position:absolute;border-radius:999px;filter:blur(1px);opacity:.65}.map:before{width:150%;height:34%;left:-20%;top:34%;transform:rotate(-12deg);background:#fff;border-top:3px solid #d4e2df;border-bottom:3px solid #d4e2df}.map:after{width:130%;height:24%;left:24%;top:58%;transform:rotate(24deg);background:#fff;border-top:3px solid #d4e2df;border-bottom:3px solid #d4e2df}
.route{position:absolute;width:72%;height:6px;left:8%;top:51%;transform:rotate(-12deg);background:#8fcfc6;border-radius:9px;box-shadow:0 0 0 5px #8fcfc625}.route.r2{width:52%;left:42%;top:48%;transform:rotate(68deg);background:#b6dcd7}.you{position:absolute;left:50%;top:52%;width:24px;height:24px;margin:-12px;border-radius:50%;background:#168b80;border:5px solid white;box-shadow:0 0 0 9px #168b8022,0 4px 18px #168b8050;z-index:2}
.top{position:absolute;z-index:5;left:14px;right:14px;top:12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:14px;background:white;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 5px 18px #193d3812;color:var(--teal);font-weight:900}.brand strong{display:block;font-size:15px;letter-spacing:.08em}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.04em}.status{display:flex;align-items:center;gap:7px;background:#ffffffdc;border:1px solid var(--line);border-radius:999px;padding:9px 11px;color:#39736d;font-size:11px;font-weight:750;box-shadow:0 5px 18px #193d3810}.dot{width:7px;height:7px;border-radius:50%;background:#2ba795;box-shadow:0 0 0 4px #2ba7951d}
.center-label{position:absolute;z-index:3;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.center-label b{display:block;font-size:13px;color:#385754}.center-label span{display:block;margin-top:3px;font-size:10px;color:#8a9c9a}
.panel{position:absolute;z-index:6;left:12px;right:12px;bottom:12px;display:grid;gap:9px}.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px #193d3818}.search .glass{font-size:19px;color:#6d8582}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.search input::placeholder{color:#91a29f}.go{border:0;border-radius:14px;padding:11px 16px;background:var(--teal);color:white;font-weight:800;box-shadow:0 5px 14px #168b8030}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{border:1px solid var(--line);background:#ffffffeb;color:var(--ink);border-radius:17px;padding:11px 10px;min-height:72px;text-align:left;box-shadow:0 8px 24px #193d3810}.card b{display:block;font-size:12px;margin-bottom:4px}.card span{font-size:10px;line-height:1.3;color:var(--muted)}.icon{font-size:15px;margin-right:3px}.emergency{display:grid;grid-template-columns:1fr 1fr;gap:7px}.emergency button{border:1px solid #e8cccc;background:#fff8f8;color:#9a4c4c;border-radius:15px;padding:11px 8px;font-size:11px;font-weight:800;box-shadow:0 6px 18px #5c202010}.emergency button:last-child{border-color:#d8dff0;background:#f8faff;color:#51638d}
.toast{position:absolute;z-index:10;top:74px;left:50%;transform:translate(-50%,-8px);padding:10px 14px;border-radius:14px;background:#18302fee;color:white;font-size:11px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 28px #18302f25}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.top{left:24px;right:24px;top:20px}.panel{left:auto;right:24px;bottom:24px;width:420px}.cards{gap:9px}.card{min-height:76px}.center-label{top:45%}}
</style>
</head>
<body>
<div class="app">
<main class="map" aria-label="IZAKHONO NAV map"><div class="route"></div><div class="route r2"></div><div class="you" id="you"></div><div class="center-label"><b>Your journey, protected.</b><span>IZAKHONO safety intelligence</span></div></main>
<header class="top"><div class="brand"><div class="mark">◆</div><div><strong>IZAKHONO NAV</strong><small>SMART MOBILITY • SAFETY FIRST</small></div></div><div class="status"><i class="dot"></i><span id="status">Safety online</span></div></header>
<div class="toast" id="toast"></div>
<section class="panel">
<form class="search" id="searchForm"><span class="glass">⌕</span><input id="destination" autocomplete="off" placeholder="Where would you like to go?"><button class="go">GO</button></form>
<div class="cards">
<button class="card" id="locate"><b><span class="icon">⌖</span>My location</b><span>Use your phone's GPS</span></button>
<button class="card" id="safe"><b><span class="icon">◈</span>Safety Guardian</b><span>Protection while driving</span></button>
<button class="card" id="sports"><b><span class="icon">◉</span>Sports Audio</b><span>Listen hands-free</span></button>
</div>
<div class="emergency"><button id="emergency">Emergency assistance</button><button id="hijack">Hijacking response</button></div>
</section>
</div>
<script>
const toastEl=document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function locate(){if(!navigator.geolocation){toast('GPS is not available on this device.');return}toast('Finding your location…');navigator.geolocation.getCurrentPosition(p=>{document.getElementById('status').textContent='GPS connected';const x=Math.max(12,Math.min(88,50+(p.coords.longitude%1)*8));const y=Math.max(20,Math.min(78,52-(p.coords.latitude%1)*8));const el=document.getElementById('you');el.style.left=x+'%';el.style.top=y+'%';toast('Location acquired. You are ready to go.');},()=>toast('Location permission is unavailable. You can still use NAV.'))}
document.getElementById('locate').onclick=locate;
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=document.getElementById('destination').value.trim();toast(d?`Planning a route to ${d}`:'Enter a destination first.')};
document.getElementById('safe').onclick=()=>toast('Safety Guardian is active. Drive safely.');
document.getElementById('sports').onclick=()=>toast('Sports Audio is ready for hands-free listening.');
document.getElementById('emergency').onclick=()=>toast('Emergency assistance is ready. Use your device emergency service for immediate help.');
document.getElementById('hijack').onclick=()=>toast('Hijacking response is armed. Stay calm and follow your emergency protocol.');
</script>
</body>
</html>
