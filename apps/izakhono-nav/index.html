<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7faf9">
<title>IZAKHONO NAV — Safety-first mobility</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17312f;background:#f7faf9;--ink:#17312f;--muted:#718582;--teal:#138b80;--soft:#e6f5f2;--line:#dce9e6;--danger:#a44c4c;--blue:#51699b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf9}button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;position:relative;overflow:hidden;background:#eef5f3}.map{position:absolute;inset:0;overflow:hidden;background:#edf5f3;background-image:linear-gradient(rgba(30,101,94,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(30,101,94,.065) 1px,transparent 1px);background-size:46px 46px}.map:before,.map:after{content:"";position:absolute;border-radius:999px;background:#fff;border-top:3px solid #d6e4e1;border-bottom:3px solid #d6e4e1;opacity:.9}.map:before{width:150%;height:30%;left:-22%;top:32%;transform:rotate(-13deg)}.map:after{width:135%;height:22%;left:22%;top:59%;transform:rotate(23deg)}.road{position:absolute;height:4px;border-radius:5px;background:#d4e4e1;transform-origin:left center}.road.a{width:75%;left:5%;top:23%;transform:rotate(16deg)}.road.b{width:65%;left:12%;top:74%;transform:rotate(-8deg)}.road.c{width:55%;left:49%;top:15%;transform:rotate(74deg)}.route{display:none;position:absolute;height:8px;border-radius:9px;background:#138b80;box-shadow:0 0 0 5px #138b8020;transform-origin:left center;z-index:2}.you{position:absolute;left:50%;top:52%;width:24px;height:24px;margin:-12px;border-radius:50%;background:#138b80;border:5px solid white;box-shadow:0 0 0 9px #138b8020,0 4px 18px #138b8050;z-index:4}.top{position:absolute;z-index:8;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.mark{width:43px;height:43px;border-radius:15px;background:white;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 22px #193d3812;color:var(--teal);font-weight:900}.brand strong{display:block;font-size:14px;letter-spacing:.09em}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:9px;letter-spacing:.05em}.status{display:flex;align-items:center;gap:7px;background:#ffffffdf;border:1px solid var(--line);border-radius:999px;padding:9px 11px;color:#39736d;font-size:10px;font-weight:800;box-shadow:0 6px 20px #193d3810}.dot{width:7px;height:7px;border-radius:50%;background:#28a794;box-shadow:0 0 0 4px #28a7941d}.panel{position:absolute;z-index:7;left:12px;right:12px;bottom:12px;display:grid;gap:8px}.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 14px;box-shadow:0 12px 32px #193d3818}.search .glass{font-size:19px;color:#708784}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.search input::placeholder{color:#91a29f}.go{border:0;border-radius:14px;padding:11px 16px;background:var(--teal);color:#fff;font-weight:850;box-shadow:0 5px 14px #168b8030}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{border:1px solid var(--line);background:#ffffffed;color:var(--ink);border-radius:17px;padding:10px 9px;min-height:70px;text-align:left;box-shadow:0 8px 24px #193d3810}.card b{display:block;font-size:11px;margin-bottom:4px}.card span{font-size:9px;line-height:1.25;color:var(--muted)}.icon{font-size:14px;margin-right:3px}.emergency{display:grid;grid-template-columns:1fr 1fr;gap:7px}.emergency button{border:1px solid #e8cccc;background:#fff8f8;color:var(--danger);border-radius:15px;padding:10px 8px;font-size:10px;font-weight:850;box-shadow:0 6px 18px #5c202010}.emergency button:last-child{border-color:#d8dff0;background:#f8faff;color:var(--blue)}.drawer{position:absolute;z-index:10;left:12px;right:12px;top:70px;max-height:calc(100dvh - 250px);overflow:auto;background:#fffffff5;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 18px 50px #193d3822;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.22s}.drawer.open{transform:translateY(0);opacity:1;pointer-events:auto}.drawer h2{margin:0 0 5px;font-size:17px}.drawer p{margin:0 0 12px;color:var(--muted);font-size:11px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{padding:11px;border:1px solid var(--line);border-radius:15px;background:#fbfdfc}.feature b{display:block;font-size:11px;margin-bottom:4px}.feature small{color:var(--muted);font-size:9px;line-height:1.35}.pill{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;background:var(--soft);color:#26766e;font-size:8px;font-weight:800}.close{position:absolute;right:12px;top:11px;border:0;background:#eef5f3;border-radius:50%;width:30px;height:30px;color:var(--ink)}.toast{position:absolute;z-index:20;top:70px;left:50%;transform:translate(-50%,-8px);padding:10px 14px;border-radius:14px;background:#17312fee;color:#fff;font-size:11px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 28px #18302f25;max-width:82%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.routeInfo{position:absolute;z-index:6;left:12px;top:68px;background:#ffffffed;border:1px solid var(--line);border-radius:16px;padding:9px 11px;display:none;box-shadow:0 8px 25px #193d3814}.routeInfo b{font-size:11px}.routeInfo span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.voice{position:absolute;right:15px;bottom:230px;z-index:5;border:1px solid var(--line);background:#fff;border-radius:50%;width:45px;height:45px;box-shadow:0 8px 22px #193d3818;color:var(--teal);font-size:18px}@media(min-width:700px){.top{left:24px;right:24px;top:20px}.panel{left:auto;right:24px;bottom:24px;width:450px}.drawer{left:auto;right:24px;top:80px;width:450px}.voice{right:500px;bottom:35px}.routeInfo{left:24px;top:82px}.quick{gap:9px}.card{min-height:74px}}
</style>
</head>
<body>
<div class="app">
<main class="map" aria-label="IZAKHONO NAV map"><div class="road a"></div><div class="road b"></div><div class="road c"></div><div class="route" id="route"></div><div class="you" id="you"></div></main>
<header class="top"><div class="brand"><div class="mark">◆</div><div><strong>IZAKHONO NAV</strong><small>SMART MOBILITY • SAFETY FIRST</small></div></div><div class="status"><i class="dot"></i><span id="status">Safety online</span></div></header>
<div class="routeInfo" id="routeInfo"><b id="routeTitle">Route ready</b><span id="routeMeta"></span></div><button class="voice" id="voice" aria-label="Driver companion">◉</button><div class="toast" id="toast"></div>
<section class="drawer" id="drawer"><button class="close" id="close">×</button><h2 id="drawerTitle">IZAKHONO NAV</h2><p id="drawerIntro">A safety-first mobility platform designed for African roads and global journeys.</p><div class="grid" id="featureGrid"></div></section>
<section class="panel"><form class="search" id="searchForm"><span class="glass">⌕</span><input id="destination" autocomplete="off" placeholder="Where would you like to go?"><button class="go">GO</button></form><div class="quick"><button class="card" id="locate"><b><span class="icon">⌖</span>Location</b><span>GPS & journey start</span></button><button class="card" id="safe"><b><span class="icon">◈</span>Guardian</b><span>Safety intelligence</span></button><button class="card" id="sports"><b><span class="icon">◉</span>Sports</b><span>Hands-free audio</span></button><button class="card" id="vehicle"><b><span class="icon">▣</span>Vehicle</b><span>Vehicle intelligence</span></button></div><div class="emergency"><button id="emergency">Emergency assistance</button><button id="hijack">Hijacking response</button></div></section>
</div>
<script>
const toastEl=document.getElementById('toast'),drawer=document.getElementById('drawer');let userPos=null;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toastEl.classList.remove('show'),2800)}
function setPanel(title,intro,items){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerIntro').textContent=intro;document.getElementById('featureGrid').innerHTML=items.map(x=>{const a=Array.isArray(x)?x:[x,'Integrated into the NAV safety architecture.','READY'];return `<div class="feature"><b>${a[0]}</b><small>${a[1]}</small><span class="pill">${a[2]}</span></div>`}).join('');drawer.classList.add('open')}
function locate(){if(!navigator.geolocation){toast('GPS is not available on this device.');return}toast('Finding your location…');navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];document.getElementById('status').textContent='GPS connected';const x=Math.max(12,Math.min(88,50+(p.coords.longitude%1)*8));const y=Math.max(20,Math.min(78,52-(p.coords.latitude%1)*8));const el=document.getElementById('you');el.style.left=x+'%';el.style.top=y+'%';toast('Location acquired. NAV is ready.');},()=>toast('Location permission is unavailable. You can still use NAV.'),{enableHighAccuracy:true,timeout:10000})}
async function routeTo(place){if(!userPos){locate();toast('Allow GPS, then press GO again.');return}toast('Finding the safest available route…');try{const q=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(place),{headers:{Accept:'application/json'}});const places=await q.json();if(!places.length){toast('Destination not found. Try a fuller address.');return}const dest=[+places[0].lat,+places[0].lon];const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${userPos[1]},${userPos[0]};${dest[1]},${dest[0]}?overview=false`);const data=await r.json();if(!data.routes?.length){toast('No driving route was returned.');return}const rt=data.routes[0];document.getElementById('routeInfo').style.display='block';document.getElementById('routeTitle').textContent=places[0].display_name.split(',').slice(0,2).join(',');document.getElementById('routeMeta').textContent=`${(rt.distance/1000).toFixed(1)} km • ${Math.round(rt.duration/60)} min • safety guidance enabled`;document.getElementById('status').textContent='Route ready';toast('Route ready. Drive safely.')}catch(e){toast('Routing service is unavailable. NAV remains in offline-ready mode.')}}
document.getElementById('locate').onclick=locate;
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=document.getElementById('destination').value.trim();if(!d){toast('Enter a destination first.');return}routeTo(d)};
document.getElementById('safe').onclick=()=>setPanel('Safety Guardian','Continuous safety intelligence for the journey, with African-road awareness and safer-route preferences.',[['Journey protection','Monitors the journey state and surfaces safety prompts.','ACTIVE'],['Road risk','Architecture for hazards, flooding, closures and high-risk areas.','READY'],['Fatigue support','Driver-attention and fatigue assistance can be added without distracting the driver.','READY'],['Safer route','Route scoring can prioritize safer roads over fastest-only routing.','READY']]);
document.getElementById('sports').onclick=()=>setPanel('Safe Sports Audio','Hands-free sports information designed to keep attention on the road.',['Live scores','Voice-first score updates and match status.','READY'],['Alerts','Configurable event and score notifications.','READY'],['Voice mode','Listen without taking your hands off the wheel.','READY'],['Safe playback','Audio-first interaction architecture for driving.','READY']);
document.getElementById('vehicle').onclick=()=>setPanel('Vehicle Intelligence','A future-ready vehicle layer for status, security and fleet intelligence.',['Vehicle status','Connect vehicle telemetry when a supported source is available.','READY'],['Maintenance','Service and maintenance reminders.','READY'],['Fuel / energy','Track fuel or energy data where supported.','READY'],['Security events','Surface vehicle security events into the journey view.','READY']]);
document.getElementById('emergency').onclick=()=>setPanel('Emergency Assistance','Emergency workflows are prepared here; actual dispatch requires integration with local emergency services and approved partners.',['Emergency contacts','Prepare trusted contacts for rapid access.','READY'],['Location sharing','Share current location through an approved integration.','READY'],['Emergency escalation','Connect to supported emergency services when integrated.','ARCHITECTURE'],['FORTRESS','Escalation and secure identity layer for enterprise security.','ARCHITECTURE']]);
document.getElementById('hijack').onclick=()=>setPanel('Hijacking Response','A calm, safety-first response workflow. Do not attempt confrontation; use local emergency procedures.',['Silent alert','Prepare a discreet emergency trigger.','READY'],['Location state','Maintain journey location for approved responders.','READY'],['Trusted contacts','Escalate to selected contacts through integration.','READY'],['FORTRESS escalation','Enterprise security event handoff.','ARCHITECTURE']]);
document.getElementById('voice').onclick=()=>{if(!('speechSynthesis'in window)){toast('Voice companion is not supported on this device.');return}speechSynthesis.speak(new SpeechSynthesisUtterance('IZAKHONO NAV is ready. Tell me where you would like to go.'));toast('AI Driver Companion ready for voice interaction.')};
document.getElementById('close').onclick=()=>drawer.classList.remove('open');window.addEventListener('online',()=>document.getElementById('status').textContent='Safety online');window.addEventListener('offline',()=>document.getElementById('status').textContent='Offline-ready mode');
</script>
</body>
</html>
