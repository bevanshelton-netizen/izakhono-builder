/* IZAKHONO NAV cinematic cockpit profile — map and driving controls remain intact */
:root{color-scheme:dark;--ink:#f4f6ff;--muted:#aab5ca;--teal:#19dfff;--soft:#14263d;--line:rgba(70,194,255,.3);--danger:#ff737c;--blue:#f1c35d}

.leaflet-container{background:#081526}

.leaflet-bar a,.leaflet-bar a:hover{background:#0a1730!important;color:#38dfff!important;border-color:#275078!important}

@media(prefers-reduced-motion:no-preference){.mark{animation:navGlow 5s ease-in-out infinite alternate}@keyframes navGlow{to{filter:hue-rotate(18deg);box-shadow:0 0 28px #a54dff,0 0 42px #1bdfff55}}}

</style></head><body><div class="app"><main class="map" aria-label="IZAKHONO NAV live map"><div id="navMap" role="application" aria-label="Live road map"></div></main><header class="top"><div class="brand"><div class="mark">◆</div><div><strong>IZAKHONO NAV</strong><small>SMART MOBILITY • SAFETY FIRST</small></div></div><div class="status"><i class="dot"></i><span id="status">Loading live map</span></div></header><div class="routeInfo" id="routeInfo"><b id="routeTitle">Route ready</b><span id="routeMeta"></span></div><div class="guidance" id="guidance" aria-live="polite"><b id="guidanceTitle">Waiting for route</b><span id="guidanceMeta">Turn-by-turn guidance appears when a route is calculated.</span></div><div class="journey" id="journey"><b>ACTIVE JOURNEY</b><span id="journeyMeta">Waiting for route</span></div><button class="voice" id="voice" aria-label="Driver companion">◉</button><div class="toast" id="toast"></div><section class="drawer" id="drawer"><button class="close" id="close">×</button><h2 id="drawerTitle">IZAKHONO NAV</h2><p id="drawerIntro">A safety-first mobility platform designed for African roads and global journeys.</p><div class="grid" id="featureGrid"></div></section><section class="panel"><form class="search" id="searchForm"><span class="glass">⌕</span><input id="destination" autocomplete="off" placeholder="Where would you like to go?"><button class="go">GO</button></form><div class="quick"><button class="card" id="locate"><b><span class="icon">⌖</span>Location</b><span>GPS & journey start</span></button><button class="card" id="safe"><b><span class="icon">◈</span>Guardian</b><span>Safety intelligence</span></button><button class="card" id="sports"><b><span class="icon">◉</span>Sports</b><span>Hands-free audio</span></button><button class="card" id="vehicle"><b><span class="icon">▣</span>Vehicle</b><span>Vehicle intelligence</span></button></div><div class="emergency"><button id="emergency">Emergency assistance</button><button id="hijack">Hijacking response</button></div></section></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="./nav-hazard-engine.js"></script><script>
const toastEl=document.getElementById('toast'),drawer=document.getElementById('drawer');let userPos=null,navMap=null,userMarker=null,destinationMarker=null,activeRouteLayer=null,activeRouteLatLngs=[],routeSteps=[],routeStepIndex=0,watchId=null,lastRerouteAt=0,pendingDestination=null;const STORE='izakhono-nav-journey-v2';const HAZARD_FEED=window.IZAKHONO_HAZARD_FEED||'';
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toastEl.classList.remove('show'),2800)}
function setPanel(title,intro,items){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerIntro').textContent=intro;document.getElementById('featureGrid').innerHTML=items.map(x=>{const a=Array.isArray(x)?x:[x,'Integrated into the NAV safety architecture.','READY'];return `<div class="feature"><b>${a[0]}</b><small>${a[1]}</small><span class="pill">${a[2]}</span></div>`}).join('');drawer.classList.add('open')}
function saveJourney(data){try{localStorage.setItem(STORE,JSON.stringify({...data,savedAt:new Date().toISOString()}))}catch(e){}}function setRouteMeta(distance,eta,safety){const el=document.getElementById('routeMeta');el.replaceChildren(document.createTextNode(`${distance||'—'} • ${eta||'—'} • `));const span=document.createElement('span');span.className='safety';span.textContent=safety||'Safety guidance preserved';el.append(span)}
function restoreJourney(){try{const j=JSON.parse(localStorage.getItem(STORE)||'null');if(!j)return;if(j.destination){document.getElementById('destination').value=j.destination;document.getElementById('routeInfo').style.display='block';document.getElementById('routeTitle').textContent=j.destination;setRouteMeta(j.distance,j.eta,j.safety);document.getElementById('journey').style.display='block';document.getElementById('journeyMeta').textContent=`${j.distance||'—'} • ${j.eta||'—'} • saved ${new Date(j.savedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;document.getElementById('status').textContent=navigator.onLine?'Saved journey details':'Offline • saved journey only';toast(navigator.onLine?'Saved journey details restored. Recalculate the route for live guidance.':'Saved journey details restored. Live maps and routing need a connection.')}}catch(e){}}
function initMap(){if(!window.L){document.getElementById('status').textContent='Map library unavailable';return}navMap=L.map('navMap',{zoomControl:false,preferCanvas:true}).setView([-30.5,26.8],7);L.control.zoom({position:'topright'}).addTo(navMap);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',crossOrigin:true}).addTo(navMap);setTimeout(()=>navMap.invalidateSize(),150)}
function updatePosition(lat,lon,accuracy){userPos=[lat,lon];if(!navMap)return;const point=[lat,lon];if(!userMarker){userMarker=L.marker(point,{icon:L.divIcon({className:'nav-user-wrap',html:'<div class="nav-user-marker"></div>',iconSize:[20,20],iconAnchor:[10,10]}),title:'Your live location'}).addTo(navMap)}else userMarker.setLatLng(point);userMarker.bindPopup('Your location · GPS accuracy ±'+Math.round(accuracy||0)+' m');document.getElementById('status').textContent='GPS connected';if(activeRouteLayer){navMap.panTo(point,{animate:true,duration:.35})}else{navMap.setView(point,14)}advanceGuidance(point);renderGuidance();if(pendingDestination){const destination=pendingDestination;pendingDestination=null;routeTo(destination)}if(activeRouteLatLngs.length&&window.__navDestination&&Date.now()-lastRerouteAt>30000){let nearest=Infinity;for(let i=0;i<activeRouteLatLngs.length;i+=Math.max(1,Math.floor(activeRouteLatLngs.length/250))){nearest=Math.min(nearest,navMap.distance(point,activeRouteLatLngs[i]))}if(nearest>300){lastRerouteAt=Date.now();routeTo(window.__navDestination,true)}}}
function locate(){if(!navigator.geolocation){toast('GPS is not available on this device.');return}if(!navMap)initMap();toast('Acquiring GPS. Keep your eyes on the road.');if(watchId!==null){if(userPos&&navMap)navMap.setView(userPos,15,{animate:true});toast('Map centred on your live location.');return}watchId=navigator.geolocation.watchPosition(p=>{updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy);if(!window.__navGpsReady){window.__navGpsReady=true;toast('GPS acquired. Live position tracking is active.')}},()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;window.__navGpsReady=false;document.getElementById('status').textContent='GPS unavailable';toast('Location permission or GPS signal unavailable. Check device location settings when safely parked.')},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function showMapRoute(coords){if(!navMap)initMap();if(!navMap||!coords?.length)return;const latlngs=coords.map(c=>[c[1],c[0]]);activeRouteLatLngs=latlngs;if(activeRouteLayer)navMap.removeLayer(activeRouteLayer);activeRouteLayer=L.polyline(latlngs,{color:'#138b80',weight:6,opacity:.92,lineJoin:'round'}).addTo(navMap);const end=latlngs[latlngs.length-1];if(destinationMarker)navMap.removeLayer(destinationMarker);destinationMarker=L.marker(end,{icon:L.divIcon({className:'nav-destination-wrap',html:'<div class="nav-destination-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:'Destination'}).addTo(navMap);navMap.fitBounds(activeRouteLayer.getBounds(),{padding:[55,55],maxZoom:14})}
function stepText(step){const m=step&&step.maneuver||{},type=m.type||'continue',modifier=m.modifier?' '+m.modifier.replace(/_/g,' '):'',road=step.name?' onto '+step.name:'';const words={depart:'Start',turn:'Turn','new name':'Continue',continue:'Continue',merge:'Merge',fork:'Keep','on ramp':'Take the ramp','off ramp':'Take the exit',roundabout:'Enter the roundabout',rotary:'Enter the rotary',arrive:'Arrive at your destination'};return (words[type]||'Continue')+modifier+road}
function speakGuidance(text){if(!window.speechSynthesis||!text)return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.rate=0.95;utterance.volume=0.85;window.speechSynthesis.speak(utterance)}
function renderGuidance(){const box=document.getElementById('guidance');if(!routeSteps.length||routeStepIndex>=routeSteps.length){box.style.display='none';return}const step=routeSteps[routeStepIndex],loc=step.maneuver&&step.maneuver.location,remaining=loc&&userPos&&navMap?navMap.distance(userPos,[loc[1],loc[0]]):Math.max(0,step.distance||0),distance=Math.max(0,Math.round(remaining));document.getElementById('guidanceTitle').textContent=stepText(step);document.getElementById('guidanceMeta').textContent=distance>=1000?(distance/1000).toFixed(1)+' km ahead':distance+' m ahead';box.style.display='block'}
function advanceGuidance(point){if(!navMap||!routeSteps.length||routeStepIndex>=routeSteps.length)return;const step=routeSteps[routeStepIndex],loc=step.maneuver&&step.maneuver.location;if(!loc)return;const remaining=navMap.distance(point,[loc[1],loc[0]]);if(remaining<85){routeStepIndex++;if(routeStepIndex<routeSteps.length){const text=stepText(routeSteps[routeStepIndex]);renderGuidance();speakGuidance(text)}else{renderGuidance();speakGuidance('You have arrived at your destination.')}}}
async function loadVerifiedHazards(){if(!HAZARD_FEED)return {accepted:[],rejected:[]};try{const r=await fetch(HAZARD_FEED,{cache:'no-store'});if(!r.ok)throw new Error('hazard feed '+r.status);return window.IZAKHONONavHazards.parseHazards(await r.json());}catch(e){return {accepted:[],rejected:['feed-unavailable']}}}
async function routeTo(place,silent=false){if(!userPos){pendingDestination=place;locate();toast('Getting your location. Your destination will route automatically when GPS is ready.');return}window.__navDestination=place;if(!silent)toast('Finding the safest available route…');try{const q=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(place),{headers:{Accept:'application/json'}});const places=await q.json();if(!places.length){toast('Destination not found. Try a fuller address.');return}const dest=[+places[0].lat,+places[0].lon];const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${userPos[1]},${userPos[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true&alternatives=true`);const data=await r.json();if(!data.routes?.length){toast('No driving route was returned.');return}const hazardData=await loadVerifiedHazards();const ranked=window.IZAKHONONavHazards.rankRoutes(data.routes,hazardData.accepted);const rt=ranked[0];routeSteps=rt.legs?.[0]?.steps||[];routeStepIndex=routeSteps.length>1&&routeSteps[0].maneuver?.type==='depart'?1:0;renderGuidance();const distance=(rt.distance/1000).toFixed(1)+' km',eta=Math.round(rt.duration/60)+' min';showMapRoute(rt.geometry.coordinates);if(routeSteps.length){renderGuidance();if(!silent)speakGuidance(stepText(routeSteps[routeStepIndex]))}const safety=rt._nav;const hazardCount=safety.verifiedHazards;const safetyLabel=hazardData.accepted.length?`${safety.band} • ${safety.score}/100 • ${hazardCount} verified hazard${hazardCount===1?'':'s'}`:'PROVISIONAL • 0 verified hazards • no verified hazard feed connected';document.getElementById('routeInfo').style.display='block';document.getElementById('routeTitle').textContent=places[0].display_name.split(',').slice(0,2).join(',');setRouteMeta(distance,eta,safetyLabel);document.getElementById('journey').style.display='block';document.getElementById('journeyMeta').textContent=`${distance} • ${eta} • ${hazardData.accepted.length?'safety-ranked route':'fastest baseline; safety provisional'}`;document.getElementById('status').textContent=hazardData.accepted.length?'Safety-ranked route ready':'Route ready • safety provisional';saveJourney({destination:places[0].display_name.split(',').slice(0,2).join(','),distance,eta,safety:safetyLabel});if(!silent)toast(hazardData.accepted.length?'Route ranked using verified hazard inputs.':'Route ready. No verified hazard data is connected yet.');}catch(e){toast('Routing service unavailable. Saved journey details remain on this device; live maps and guidance require a connection.')}}
document.getElementById('locate').onclick=locate;document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=document.getElementById('destination').value.trim();if(!d){toast('Enter a destination first.');return}routeTo(d)};document.getElementById('safe').onclick=()=>setPanel('Safety Guardian','Continuous safety intelligence for the journey, with African-road awareness and safer-route preferences.',[['Journey protection','Monitors the journey state and surfaces safety prompts.','ACTIVE'],['Road risk','Verified hazards can influence route ranking, but no live hazard feed is currently connected.','NOT CONNECTED'],['Fatigue support','Driver-attention and fatigue assistance are not yet active in this build.','NOT ACTIVE'],['Safer route','Route ranking is provisional until verified hazard and road-condition feeds are connected.','PROVISIONAL']]);document.getElementById('sports').onclick=()=>setPanel('Safe Sports Audio','Hands-free sports information designed to keep attention on the road.',[['Live scores','Voice-first score updates and match status.','READY'],['Alerts','Configurable event and score notifications.','READY'],['Voice mode','Listen without taking your hands off the wheel.','READY'],['Safe playback','Audio-first interaction architecture for driving.','READY']]);document.getElementById('vehicle').onclick=()=>setPanel('Vehicle Intelligence','A future-ready vehicle layer for status, security and fleet intelligence.',[['Vehicle status','Connect vehicle telemetry when a supported source is available.','READY'],['Maintenance','Service and maintenance reminders.','READY'],['Fuel / energy','Track fuel or energy data where supported.','READY'],['Security events','Surface vehicle security events into the journey view.','READY']]);document.getElementById('emergency').onclick=()=>setPanel('Emergency Assistance','Emergency workflows are prepared here; actual dispatch requires integration with local emergency services and approved partners.',[['Emergency contacts','Prepare trusted contacts for rapid access.','READY'],['Location sharing','Share current location through an approved integration.','READY'],['Emergency escalation','Connect to supported emergency services when integrated.','ARCHITECTURE'],['FORTRESS','Escalation and secure identity layer for enterprise security.','ARCHITECTURE']]);document.getElementById('hijack').onclick=()=>setPanel('Hijacking Response','A calm, safety-first response workflow. Do not attempt confrontation; use local emergency procedures.',[['Silent alert','Prepare a discreet emergency trigger.','READY'],['Location state','Maintain journey location for approved responders.','READY'],['Trusted contacts','Escalate to selected contacts through integration.','READY'],['FORTRESS escalation','Enterprise security event handoff.','ARCHITECTURE']]);document.getElementById('voice').onclick=()=>{if(!('speechSynthesis'in window)){toast('Voice companion is not supported on this device.');return}speechSynthesis.speak(new SpeechSynthesisUtterance('IZAKHONO NAV is ready. Tell me where you would like to go.'));toast('AI Driver Companion ready for voice interaction.')};document.getElementById('close').onclick=()=>drawer.classList.remove('open');window.addEventListener('online',()=>{document.getElementById('status').textContent='Safety online';restoreJourney()});window.addEventListener('offline',()=>document.getElementById('status').textContent='Offline • saved journey only');restoreJourney();initMap();
</script><script src="./hey-nav-runtime.js"></script><script src="./hey-nav-ui-bridge.js"></script></body></html>
