<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071015">
  <title>IZAKHONO NAV</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5fbfa;background:#071015}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#071015}
    button,input{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;position:relative;background:#071015}
    header{height:72px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:absolute;z-index:5;inset:0 0 auto;background:linear-gradient(#071015dd,transparent)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}.shield{width:38px;height:38px;border-radius:12px;background:#0c272a;display:grid;place-items:center;border:1px solid #2bb6a7;color:#67e5d5}
    .status{font-size:11px;font-weight:700;letter-spacing:.08em;padding:8px 10px;border-radius:999px;background:#0c272a;border:1px solid #1e6861;color:#72eadb}
    .map{position:absolute;inset:0;background-color:#0a1518;background-image:linear-gradient(rgba(83,124,120,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(83,124,120,.10) 1px,transparent 1px),linear-gradient(35deg,transparent 46%,rgba(66,105,100,.18) 47%,rgba(66,105,100,.18) 49%,transparent 50%);background-size:44px 44px,44px 44px,170px 170px;overflow:hidden}
    .road{position:absolute;width:72%;height:18px;left:-8%;top:51%;transform:rotate(-17deg);background:#26383a;border-top:2px solid #536566;border-bottom:2px solid #536566;box-shadow:0 0 0 5px #0d1c1f}.road.r2{width:80%;top:66%;left:35%;transform:rotate(28deg)}.road.r3{width:55%;top:32%;left:42%;transform:rotate(83deg)}
    .you{position:absolute;left:50%;top:52%;width:28px;height:28px;margin:-14px;border-radius:50%;background:#64e4d3;border:5px solid #d8fffa;box-shadow:0 0 0 10px #64e4d330,0 0 35px #64e4d388;z-index:2}
    .panel{position:absolute;z-index:4;left:12px;right:12px;bottom:12px;display:grid;gap:10px}
    .search{display:flex;align-items:center;gap:10px;background:#0b181cdd;border:1px solid #294347;border-radius:18px;padding:12px;backdrop-filter:blur(12px)}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.search input::placeholder{color:#8da4a6}
    .go{border:0;border-radius:13px;padding:10px 15px;background:#61ddcd;color:#06201d;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #294347;background:#0b181ce8;color:#eaf8f6;border-radius:16px;padding:12px;min-height:66px;text-align:left}.card b{display:block;font-size:13px;margin-bottom:4px}.card span{font-size:11px;color:#8da4a6}.emergency{display:flex;gap:8px}.emergency button{flex:1;border:1px solid #563b3b;background:#201517;color:#ffdcdc;border-radius:15px;padding:12px;font-weight:800}.emergency button:first-child{border-color:#72494b}
    .toast{position:absolute;z-index:10;top:82px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#0b181cf2;border:1px solid #294347;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
    @media(min-width:700px){.panel{left:auto;right:24px;bottom:24px;width:410px}.cards{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="shield">◆</div><div>IZAKHONO NAV</div></div><div class="status" id="status">SAFETY ONLINE</div></header>
  <main class="map" aria-label="IZAKHONO NAV map"><div class="road"></div><div class="road r2"></div><div class="road r3"></div><div class="you" id="you"></div></main>
  <div class="toast" id="toast"></div>
  <section class="panel">
    <form class="search" id="searchForm"><span>⌕</span><input id="destination" autocomplete="off" placeholder="Where are you going?"><button class="go">GO</button></form>
    <div class="cards">
      <button class="card" id="locate"><b>📍 My location</b><span>Use GPS when available</span></button>
      <button class="card" id="safe"><b>🛡 Safety Guardian</b><span>Driving protection active</span></button>
      <button class="card" id="sports"><b>🏆 Safe Sports Audio</b><span>Audio mode ready</span></button>
    </div>
    <div class="emergency"><button id="emergency">🚨 EMERGENCY</button><button id="hijack">🔐 HIJACKING RESPONSE</button></div>
  </section>
</div>
<script>
const toastEl=document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function locate(){if(!navigator.geolocation){toast('GPS is not available on this device.');return}toast('Requesting your location…');navigator.geolocation.getCurrentPosition(p=>{document.getElementById('status').textContent='GPS LOCKED';const x=Math.max(12,Math.min(88,50+(p.coords.longitude%1)*8));const y=Math.max(20,Math.min(78,52-(p.coords.latitude%1)*8));const el=document.getElementById('you');el.style.left=x+'%';el.style.top=y+'%';toast('Location acquired. IZAKHONO NAV is ready.');},()=>toast('Location permission was unavailable. NAV remains usable.'))}
document.getElementById('locate').onclick=locate;
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=document.getElementById('destination').value.trim();toast(d?`Route requested: ${d}`:'Enter a destination first.')};
document.getElementById('safe').onclick=()=>toast('Safety Guardian is active. Stay focused on the road.');
document.getElementById('sports').onclick=()=>toast('Safe Sports Audio is ready for hands-free playback.');
document.getElementById('emergency').onclick=()=>toast('Emergency mode armed. Use your device emergency service when immediate help is required.');
document.getElementById('hijack').onclick=()=>toast('Hijacking Response armed. Keep hands free and follow your emergency protocol.');
</script>
</body>
</html>
