services:
  - type: web
    name: connecta
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    repo: https://github.com/bevanshelton-netizen/izakhono-builder
    branch: main
    rootDir: products/izakhono-social
    dockerfilePath: ./Dockerfile.external
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: connecta-media
      mountPath: /var/lib/connecta/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: connecta-db
          property: connectionString
      - key: CONNECTA_OWNER_KEY
        generateValue: true
      - key: CONNECTA_ENGINE_INSTANCE
        value: render-production
      - key: CONNECTA_ENGINE_VERSION
        value: "0.2.0"
      - key: CONNECTA_INTERNAL_ENGINE_PORT
        value: "4100"
      - key: CONNECTA_STORAGE_DRIVER
        value: local
      - key: MEDIA_ROOT
        value: /var/lib/connecta/media
      - key: CONNECTA_REGISTER_RATE_LIMIT
        value: "8"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: connecta-db
    plan: 0.5c-1g
    region: frankfurt
    databaseName: connecta
    user: connecta
    ipAllowList: []
