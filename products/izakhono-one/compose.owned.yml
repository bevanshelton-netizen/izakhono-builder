services:
  izakhono-one:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.owned
    environment:
      IZAKHONO_FLOW_INTERNAL_URL: ${IZAKHONO_FLOW_INTERNAL_URL:-http://izakhono-flow:8794}
    ports:
      - "8781:8781"
    networks:
      - izakhono_private
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8781/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  izakhono_private:
    external: true
    name: izakhono_private
