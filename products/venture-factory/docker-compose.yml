services:
  venture-factory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izakhono-venture-factory
    restart: unless-stopped
    environment:
      PORT: "9780"
      VENTURE_FACTORY_HOST: "0.0.0.0"
      VENTURE_FACTORY_DATA_DIR: "/data"
      VENTURE_FACTORY_OWNER_KEY: "${VENTURE_FACTORY_OWNER_KEY}"
      IZAKHONO_SUPER_AI_URL: "${IZAKHONO_SUPER_AI_URL:-http://host.docker.internal:9595}"
      IZAKHONO_SUPER_AI_INTERNAL_KEY: "${IZAKHONO_SUPER_AI_INTERNAL_KEY}"
      IZAKHONO_SUPER_AI_WORKFLOW_KEY: "${IZAKHONO_SUPER_AI_WORKFLOW_KEY}"
      IZAKHONO_BUILDER_URL: "${IZAKHONO_BUILDER_URL:-http://host.docker.internal:8787}"
      IZAKHONO_BUILDER_ADMIN_KEY: "${IZAKHONO_BUILDER_ADMIN_KEY}"
      VENTURE_FACTORY_CUSTOMER_MODE: "${VENTURE_FACTORY_CUSTOMER_MODE:-false}"
      IZAKHONO_ID_URL: "${IZAKHONO_ID_URL:-http://host.docker.internal:9696}"
      IZAKHONO_ID_INTERNAL_KEY: "${IZAKHONO_ID_INTERNAL_KEY}"
      IZAKHONO_ACCESS_URL: "${IZAKHONO_ACCESS_URL:-http://host.docker.internal:9494}"
      IZAKHONO_ACCESS_INTERNAL_KEY: "${IZAKHONO_ACCESS_INTERNAL_KEY}"
      VENTURE_FACTORY_ACCESS_ENTITY_ID: "${VENTURE_FACTORY_ACCESS_ENTITY_ID:-izakhono-africa}"
      IZAKHONO_PAY_URL: "${IZAKHONO_PAY_URL}"
      IZAKHONO_PAY_API_KEY: "${IZAKHONO_PAY_API_KEY}"
      IZAKHONO_PAY_APP_SLUG: "${IZAKHONO_PAY_APP_SLUG:-venture-factory}"
      VENTURE_FACTORY_PRICE_MINOR: "${VENTURE_FACTORY_PRICE_MINOR:-0}"
      VENTURE_FACTORY_ACCESS_PLAN: "${VENTURE_FACTORY_ACCESS_PLAN:-monthly}"
      VENTURE_FACTORY_ACCESS_PERIOD_DAYS: "${VENTURE_FACTORY_ACCESS_PERIOD_DAYS:-30}"
      VENTURE_FACTORY_PUBLIC_ORIGIN: "${VENTURE_FACTORY_PUBLIC_ORIGIN}"
      VENTURE_FACTORY_PUBLIC_PLANNING: "${VENTURE_FACTORY_PUBLIC_PLANNING:-false}"
    ports:
      - "127.0.0.1:9780:9780"
    volumes:
      - venture-factory-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  venture-factory-data:
