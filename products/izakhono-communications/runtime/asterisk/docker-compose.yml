services:
  izakhono-asterisk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ASTERISK_VERSION: "22.11.0"
        ASTERISK_SHA256: "3bd5ee040509a3d3cd9b1ba9520c18e6ec0a7e7981ca68c457dcd36ba3c54d94"
    restart: unless-stopped
    environment:
      IZAKHONO_SIP_BIND_ADDRESS: "0.0.0.0:5060"
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - asterisk-etc:/etc/asterisk
      - asterisk-lib:/var/lib/asterisk
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  asterisk-etc:
  asterisk-lib:
  asterisk-spool:
  asterisk-log:
