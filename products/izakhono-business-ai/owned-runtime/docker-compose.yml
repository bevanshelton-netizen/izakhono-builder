services:
  business-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izakhono-business-ai
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8787/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
