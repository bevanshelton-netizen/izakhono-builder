services:
  roundcube-db:
    image: mariadb:11.8
    container_name: izakhono-roundcube-db
    environment:
      MARIADB_ROOT_PASSWORD: ${ROUNDCUBE_DB_PASSWORD:?set ROUNDCUBE_DB_PASSWORD}
      MARIADB_DATABASE: roundcube
      MARIADB_USER: roundcube
      MARIADB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD:?set ROUNDCUBE_DB_PASSWORD}
    volumes:
      - ./roundcube-db:/var/lib/mysql
    networks: [mail-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u roundcube -p$$MARIADB_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10

  roundcube:
    image: roundcube/roundcubemail:1.6-apache
    container_name: izakhono-roundcube
    depends_on:
      roundcube-db:
        condition: service_healthy
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://${MAIL_HOSTNAME}
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://${MAIL_HOSTNAME}
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: roundcube-db
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD:?set ROUNDCUBE_DB_PASSWORD}
      ROUNDCUBEMAIL_SKIN: elastic
    ports:
      - "127.0.0.1:8088:80"
    networks: [mail-internal, izakhono-mail]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  mail-internal:
    internal: true
  izakhono-mail:
    external: true
    name: izakhono-mail
