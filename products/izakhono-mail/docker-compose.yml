services:
  dns:
    image: coredns/coredns:1.12.0
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./coredns/izakhono.db:/etc/coredns/izakhono.db:ro
    networks:
      izakhono:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:5353:53/udp"
      - "127.0.0.1:5353:53/tcp"

  mail:
    build: .
    restart: unless-stopped
    command: ["node", "src/server.mjs"]
    env_file:
      - path: ./owner.env
        required: false
    environment:
      MAIL_HOST: 0.0.0.0
      MAIL_PORT: 9899
      MAIL_DATABASE_PATH: /app/data/mail.sqlite
      MAIL_MIGRATION: /app/migrations/0001_mail.sql
    volumes:
      - mail-data:/app/data
    networks:
      izakhono:
        ipv4_address: 172.30.0.20
    ports:
      - "127.0.0.1:9899:9899"

  inbound:
    build: .
    restart: unless-stopped
    command: ["node", "src/inbound-smtp.mjs"]
    environment:
      MAIL_PRIVATE_DOMAIN: izakhono
      MAIL_DATABASE_PATH: /app/data/mail.sqlite
      MAIL_LOCAL_RECIPIENTS: bevan@izakhono
      MAIL_SMTP_LISTEN_HOST: 0.0.0.0
      MAIL_SMTP_LISTEN_PORT: 2525
    volumes:
      - mail-data:/app/data
    networks:
      izakhono:
        ipv4_address: 172.30.0.21
    ports:
      - "127.0.0.1:2525:2525"

  mailbox-api:
    build: .
    restart: unless-stopped
    command: ["node", "src/mailbox-api.mjs"]
    environment:
      MAIL_DATABASE_PATH: /app/data/mail.sqlite
      MAIL_PRIVATE_DOMAIN: izakhono
      MAIL_API_LISTEN_HOST: 0.0.0.0
      MAIL_API_LISTEN_PORT: 8787
    volumes:
      - mail-data:/app/data
    networks:
      izakhono:
        ipv4_address: 172.30.0.22
    ports:
      - "127.0.0.1:8787:8787"

  auth:
    build: .
    restart: unless-stopped
    command: ["node", "src/auth-api.mjs"]
    environment:
      MAIL_DATABASE_PATH: /app/data/mail.sqlite
      MAIL_AUTH_LISTEN_HOST: 0.0.0.0
      MAIL_AUTH_LISTEN_PORT: 8789
    volumes:
      - mail-data:/app/data
    networks:
      izakhono:
        ipv4_address: 172.30.0.24
    ports:
      - "127.0.0.1:8789:8789"

  webmail:
    build: .
    restart: unless-stopped
    command: ["node", "src/webmail.mjs"]
    environment:
      MAIL_DATABASE_PATH: /app/data/mail.sqlite
      MAIL_PRIVATE_DOMAIN: izakhono
      MAIL_WEBMAIL_LISTEN_HOST: 0.0.0.0
      MAIL_WEBMAIL_LISTEN_PORT: 8088
      MAIL_WEBMAIL_IDENTITY: bevan@izakhono
    volumes:
      - mail-data:/app/data
    networks:
      izakhono:
        ipv4_address: 172.30.0.23
    ports:
      - "127.0.0.1:8088:8088"

networks:
  izakhono:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mail-data:
