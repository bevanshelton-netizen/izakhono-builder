services:
  stalwart:
    image: stalwartlabs/stalwart:v1
    container_name: izakhono-mail-server
    init: true
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
      - "443:443"
      # First-run setup only. Keep private and reach it through an SSH tunnel.
      - "127.0.0.1:8080:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    stop_grace_period: 1m

volumes:
  stalwart-etc:
  stalwart-data:
