name = "izakhono-fortress-identity"
main = "src/worker.ts"
compatibility_date = "2026-11-12"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "izakhono-fortress-identity"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
FORTRESS_SESSION_ISSUER = "https://fortress.izakhono.internal"
FORTRESS_SESSION_AUDIENCE = "izakhono-creator"
FORTRESS_DEPLOY_AUDIENCE = "izakhono-deploy"
FORTRESS_DEPLOY_ACCESS_TTL_SECONDS = "300"
# Set exact Creator origin in FORTRESS_ALLOWED_ORIGINS.
# Set FORTRESS_SESSION_HMAC_SECRET, FORTRESS_BOOTSTRAP_SECRET and
# FORTRESS_DEPLOY_INTROSPECTION_SECRET with wrangler secret put.
# The deploy introspection secret is separate from the JWT signing secret.
