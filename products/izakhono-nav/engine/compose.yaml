services:
  nav-engine:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8788
      NAV_RUNTIME_ID: ${NAV_RUNTIME_ID:-NAV-RUNTIME-01}
      NAV_RUNTIME_CLASS: ${NAV_RUNTIME_CLASS:-owned}
      NAV_RELEASE_ID: ${NAV_RELEASE_ID:-IZAKHONO-NAV-ENGINE-v1.0.0}
      NAV_ROUTER_KIND: ${NAV_ROUTER_KIND:-valhalla}
      NAV_ROUTER_URL: ${NAV_ROUTER_URL:-}
      NAV_SEARCH_KIND: ${NAV_SEARCH_KIND:-nominatim}
      NAV_SEARCH_URL: ${NAV_SEARCH_URL:-}
      NAV_TILE_TEMPLATE: ${NAV_TILE_TEMPLATE:-}
      NAV_ALLOW_RESILIENCE: ${NAV_ALLOW_RESILIENCE:-false}
      NAV_ROUTER_RESILIENCE_URL: ${NAV_ROUTER_RESILIENCE_URL:-}
      NAV_SEARCH_RESILIENCE_URL: ${NAV_SEARCH_RESILIENCE_URL:-}
      NAV_TILE_RESILIENCE_TEMPLATE: ${NAV_TILE_RESILIENCE_TEMPLATE:-}
      NAV_ALLOWED_ORIGINS: ${NAV_ALLOWED_ORIGINS:-}
    ports:
      - "${NAV_ENGINE_PORT:-8788}:8788"
