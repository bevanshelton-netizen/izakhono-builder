<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YHVH Creator Space</title><style>body{margin:0;background:#090a0f;color:#fff;font:15px system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:28px}.card{background:#14161d;border:1px solid #292c35;border-radius:18px;padding:24px}h1{color:#d4af57}label{display:block;margin:15px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;background:#0b0d12;border:1px solid #353946;color:#fff;border-radius:9px;padding:12px}textarea{min-height:120px}button{margin-top:18px;background:#d4af57;color:#08090d;border:0;border-radius:9px;padding:13px 18px;font-weight:850}.notice{padding:14px;background:#201c11;border:1px solid #5d4b20;border-radius:10px;color:#e8d9a7}</style></head><body><div class="wrap"><a href="/">← YHVH Gospel TV</a><div class="card" style="margin-top:20px"><h1>YHVH CREATOR SPACE</h1><p>Create. Protect. Distribute. Earn.</p><div class="notice">Submission is free. Submission does not guarantee airtime. Creator ownership remains the default unless a separate written agreement says otherwise.</div><form id="f"><label>Your name / organisation</label><input name="name" required maxlength="120"><label>Programme / content title</label><input name="title" required maxlength="160"><label>Primary language</label><select name="language"><option>en</option><option>fr</option><option>pt</option><option>es</option><option>sw</option><option>zu</option><option>xh</option><option>yo</option><option>ha</option><option>ig</option><option>rw</option><option>ln</option><option>mul</option></select><label>Tell us about the content</label><textarea name="message" maxlength="4000"></textarea><button>Submit for review</button></form><p id="result"></p></div></div><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.currentTarget),b=Object.fromEntries(f);let r=await fetch('/api/control/submission',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+prompt('Owner token required for this MVP intake endpoint')},body:JSON.stringify(b)});let x=await r.json();document.querySelector('#result').textContent=x.ok?'Submitted: '+x.item.id:(x.error||'Submission failed')})</script></body></html>
