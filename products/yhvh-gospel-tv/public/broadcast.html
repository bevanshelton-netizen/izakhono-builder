<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YHVH Broadcast Encoder</title><style>body{margin:0;background:#08090d;color:#fff;font:15px system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:22px}.gold{color:#d4af57}.card{background:#14161d;border:1px solid #292c35;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.big{font-size:28px;font-weight:900}input,button{padding:11px;border-radius:9px;border:1px solid #363944}input{background:#0c0e13;color:#fff;width:100%;box-sizing:border-box}button{background:#d4af57;font-weight:800;cursor:pointer}button.stop{background:#ff5d67;color:#fff}video{width:100%;background:#000;border-radius:12px;margin-top:12px}.muted{color:#9aa3b2}pre{white-space:pre-wrap;color:#aeb4c0}</style></head><body><div class="wrap"><h1 class="gold">YHVH GOSPEL TV — BROADCAST ENCODER</h1><p class="muted">IZAKHONO-owned encoder control. Rights + QC + territory gates must pass before the encoder can start.</p><div class="card"><input id="token" type="password" placeholder="YHVH_CONTROL_TOKEN"><button onclick="auth()">AUTHENTICATE</button><span id="msg"></span></div><div class="grid"><div class="card"><div class="muted">ENCODER</div><div class="big" id="running">—</div></div><div class="card"><div class="muted">CLEARED MEDIA</div><div class="big" id="inputs">—</div></div><div class="card"><div class="muted">TERRITORY</div><div class="big" id="territory">—</div></div></div><div class="card"><button onclick="start()">START 24/7 ENCODER</button> <button class="stop" onclick="stop()">STOP ENCODER</button><p id="reason" class="muted"></p><video id="player" controls autoplay muted></video></div><div class="card"><h3>Encoder diagnostics</h3><pre id="diag">Authenticate to load.</pre></div></div><script>let token='';async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(p,o);const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');return j}async function auth(){token=document.getElementById('token').value.trim();try{await refresh();document.getElementById('msg').textContent=' ✓ AUTHENTICATED'}catch(e){document.getElementById('msg').textContent=' '+e.message}}async function refresh(){const j=await api('/api/control/broadcast');const b=j.broadcast;document.getElementById('running').textContent=b.running?'RUNNING':'STOPPED';document.getElementById('inputs').textContent=b.approvedInputCount;document.getElementById('territory').textContent=b.territory;document.getElementById('reason').textContent=b.manifestError||(!b.approvedInputCount?'Encoder blocked until at least one item is rights-CLEAR, QC-PASS, territory-cleared and physically present in the content vault.':'');document.getElementById('diag').textContent=JSON.stringify(b,null,2);if(b.hlsReady){const v=document.getElementById('player');if(!v.src)v.src='/hls/playlist.m3u8'}}async function start(){try{await api('/api/control/broadcast/start',{method:'POST',body:'{}'});await refresh()}catch(e){document.getElementById('reason').textContent=e.message;await refresh()}}async function stop(){try{await api('/api/control/broadcast/stop',{method:'POST',body:'{}'});await refresh()}catch(e){alert(e.message)}}setInterval(()=>{if(token)refresh().catch(()=>{})},10000);</script></body></html>
