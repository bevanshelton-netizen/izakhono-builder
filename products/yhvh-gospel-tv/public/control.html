<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YHVH Station Control</title><style>body{margin:0;background:#090a0f;color:#fff;font:15px system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.gold{color:#d4af57}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.card{background:#14161d;border:1px solid #292c35;border-radius:16px;padding:20px}.big{font-size:32px;font-weight:850}button{background:#d4af57;border:0;padding:11px 15px;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}input{background:#0c0e13;color:#fff;border:1px solid #363944;padding:11px;border-radius:9px;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;color:#aeb4c0}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1 class="gold">YHVH GOSPEL TV — CONTROL ROOM</h1><div>IZAKHONO-owned station operations</div></div><a href="/">Public TV</a></div><div class="card" style="margin-top:20px"><label>Owner control token</label><input id="token" type="password" placeholder="YHVH_CONTROL_TOKEN"><button onclick="load()">Authenticate</button><span id="auth"></span></div><div class="grid"><div class="card"><div>NOW</div><div class="big" id="now">—</div><p id="next">—</p></div><div class="card"><div>AUTOMATION</div><div class="big" id="auto">—</div><button onclick="setAutomation(true)">START</button><button onclick="setAutomation(false)">STOP</button></div><div class="card"><div>EMERGENCY SLATE</div><div class="big" id="emergency">—</div><button onclick="setEmergency(true)">ACTIVATE</button><button onclick="setEmergency(false)">CLEAR</button></div></div><div class="card" style="margin-top:15px"><h2>Audit</h2><pre id="audit">Authenticate to load.</pre></div></div><script>let t='';async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+t,'Content-Type':'application/json'};let r=await fetch(p,o);return r.json()}async function load(){t=document.querySelector('#token').value;let [s,c]=await Promise.all([fetch('/api/status').then(r=>r.json()),api('/api/control/state')]);if(!c.ok){document.querySelector('#auth').textContent=' Not authorized';return}document.querySelector('#auth').textContent=' ✓ Authorized';render(s,c)}function render(s,c){document.querySelector('#now').textContent=s.current.title;document.querySelector('#next').textContent='Next: '+s.next.title+' · '+s.next.time;document.querySelector('#auto').textContent=c.state.automation?'RUNNING':'STOPPED';document.querySelector('#emergency').textContent=c.state.emergency?'ACTIVE':'CLEAR';document.querySelector('#audit').textContent=JSON.stringify(c.audit,null,2)}async function action(p,b){let c=await api(p,{method:'POST',body:JSON.stringify(b)});if(c.ok)load();else alert(c.error||'Command failed')}function setAutomation(v){action('/api/control/automation',{enabled:v})}function setEmergency(v){action('/api/control/emergency',{enabled:v})}</script></body></html>
