services:
  yhvh-gospel-tv:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: yhvh-gospel-tv
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      YHVH_CONTENT_VAULT: /app/content-vault
      YHVH_HLS_DIR: /app/data/hls
      YHVH_BROADCAST_MANIFEST: /app/data/broadcast-inputs.json
      YHVH_DEFAULT_TERRITORY: ZA
      YHVH_CONTROL_TOKEN: ${YHVH_CONTROL_TOKEN:?Set YHVH_CONTROL_TOKEN in the host environment}
      YHVH_RTMP_URL: ${YHVH_RTMP_URL:-}
    volumes:
      - ./content-vault:/app/content-vault
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
