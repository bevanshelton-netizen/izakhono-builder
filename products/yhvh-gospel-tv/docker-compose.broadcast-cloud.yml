services:
  yhvh-gospel-tv:
    build: .
    restart: unless-stopped
    env_file:
      - .env.broadcast
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      YHVH_CONTENT_VAULT: /app/content-vault
      YHVH_HLS_DIR: /app/data/hls
      YHVH_BROADCAST_MANIFEST: /app/data/broadcast-inputs.json
    volumes:
      - ./runtime/content-vault:/app/content-vault
      - ./runtime/data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  yhvh-edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      yhvh-gospel-tv:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      YHVH_PUBLIC_DOMAIN: ${YHVH_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
