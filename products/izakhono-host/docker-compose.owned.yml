services:
  host-runtime:
    build: ./runtime/control-plane
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      HOST_RUNTIME_TOKEN: ${HOST_RUNTIME_TOKEN:?set HOST_RUNTIME_TOKEN}
      PLATFORM_TLS_HOSTS: ${PLATFORM_TLS_HOSTS:-mail.izakhonoafrica.co.za,webmail.izakhonoafrica.co.za}
    volumes:
      - host-runtime-data:/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  contact-gateway:
    build: ./runtime/contact-gateway
    restart: unless-stopped
    environment:
      PORT: 8090
      IZAKHONO_MAIL_API_URL: ${IZAKHONO_MAIL_API_URL:-http://mail-bridge:8091}
      IZAKHONO_MAIL_API_TOKEN: ${IZAKHONO_MAIL_API_TOKEN:-}
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  mail-bridge:
    build: ./runtime/mail-bridge
    restart: unless-stopped
    environment:
      PORT: 8091
      IZAKHONO_MAIL_API_TOKEN: ${IZAKHONO_MAIL_API_TOKEN:?set IZAKHONO_MAIL_API_TOKEN}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST to the private IZAKHONO MAIL node address}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks: [izakhono, izakhono-mail]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  mail-control-plane:
    build: ./runtime/mail-control-plane
    restart: unless-stopped
    environment:
      PORT: 8000
      STALWART_API_URL: ${STALWART_API_URL:-http://stalwart:8080}
      STALWART_API_KEY: ${STALWART_API_KEY:?set STALWART_API_KEY}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?set CONTROL_PLANE_TOKEN}
      MAIL_HANDOVER_ENCRYPTION_KEY: ${MAIL_HANDOVER_ENCRYPTION_KEY:?set MAIL_HANDOVER_ENCRYPTION_KEY}
      MAIL_HANDOVER_DB: /var/lib/izakhono-mail/handover.sqlite3
      MAIL_ALLOWED_DOMAINS: ${MAIL_ALLOWED_DOMAINS:-izakhonoafrica.co.za}
      MAIL_DOMAIN_VERIFICATION_TTL_SECONDS: ${MAIL_DOMAIN_VERIFICATION_TTL_SECONDS:-604800}
    volumes:
      - mail-control-plane-state:/var/lib/izakhono-mail
    ports:
      - "127.0.0.1:8082:8000"
    networks: [izakhono-mail]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s

  roundcube-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roundcube
      POSTGRES_USER: roundcube
      POSTGRES_PASSWORD_FILE: /run/secrets/roundcube_db_password
    volumes:
      - roundcube-db-data:/var/lib/postgresql/data
    secrets:
      - roundcube_db_password
    networks: [izakhono]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundcube -d roundcube"]
      interval: 15s
      timeout: 5s
      retries: 5

  roundcube:
    image: roundcube/roundcubemail:1.7.6-apache
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: roundcube-db
      ROUNDCUBEMAIL_DB_PORT: 5432
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.izakhonoafrica.co.za
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.izakhonoafrica.co.za
      ROUNDCUBEMAIL_SMTP_PORT: 465
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    extra_hosts:
      - "mail.izakhonoafrica.co.za:${MAIL_NODE_PRIVATE_IP:-host-gateway}"
    volumes:
      - roundcube-temp:/tmp/roundcube-temp
    secrets:
      - roundcube_db_password
      - roundcube_des_key
    networks: [izakhono]
    depends_on:
      roundcube-db:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
      STALWART_HTTP_UPSTREAM: ${STALWART_HTTP_UPSTREAM:-http://stalwart:8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./mail/mta-sts:/srv/mta-sts:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [izakhono, izakhono-mail]
    depends_on:
      host-runtime:
        condition: service_healthy
      contact-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/" ]
      interval: 15s
      timeout: 5s
      retries: 5

  authoritative-dns:
    image: coredns/coredns:1.12.1
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./runtime/authoritative-dns/Corefile:/etc/coredns/Corefile:ro
      - ./runtime/authoritative-dns/db.izakhono.local:/zones/db.izakhono.local:ro
    networks: [izakhono]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-izakhono}
      POSTGRES_USER: ${POSTGRES_USER:-izakhono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-izakhono} -d ${POSTGRES_DB:-izakhono}"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [izakhono]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  izakhono:
    driver: bridge
  izakhono-mail:
    name: izakhono-mail
    driver: bridge

volumes:
  host-runtime-data:
  caddy-data:
  caddy-config:
  postgres-data:
  minio-data:
  valkey-data:
  mail-control-plane-state:
  roundcube-db-data:
  roundcube-temp:

secrets:
  roundcube_db_password:
    file: ./mail/secrets/roundcube_db_password
  roundcube_des_key:
    file: ./mail/secrets/roundcube_des_key
