services:
  host-runtime:
    build: ./runtime/control-plane
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      HOST_RUNTIME_TOKEN: ${HOST_RUNTIME_TOKEN:?set HOST_RUNTIME_TOKEN}
    volumes:
      - host-runtime-data:/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  compute-manager:
    build: ./runtime/compute-manager
    restart: unless-stopped
    environment:
      PORT: 8082
      DATA_DIR: /data
      COMPUTE_ADMIN_TOKEN: ${COMPUTE_ADMIN_TOKEN:?set COMPUTE_ADMIN_TOKEN}
      COMPUTE_WORKER_TOKEN: ${COMPUTE_WORKER_TOKEN:?set COMPUTE_WORKER_TOKEN}
      COMPUTE_LEASE_MS: ${COMPUTE_LEASE_MS:-120000}
      DATABASE_URL: postgres://${POSTGRES_USER:-izakhono}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-izakhono}
    volumes:
      - compute-manager-data:/data
    networks: [izakhono]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  compute-worker:
    build: ./runtime/compute-worker
    restart: unless-stopped
    environment:
      COMPUTE_MANAGER_URL: http://compute-manager:8082
      COMPUTE_WORKER_TOKEN: ${COMPUTE_WORKER_TOKEN:?set COMPUTE_WORKER_TOKEN}
      WORKER_ID: ${COMPUTE_WORKER_ID:-izakhono-worker-01}
      WORKER_POLL_MS: ${COMPUTE_WORKER_POLL_MS:-3000}
    networks: [izakhono]
    depends_on:
      compute-manager:
        condition: service_healthy

  contact-gateway:
    build: ./runtime/contact-gateway
    restart: unless-stopped
    environment:
      PORT: 8090
      IZAKHONO_MAIL_API_URL: ${IZAKHONO_MAIL_API_URL:-http://mail-bridge:8091}
      IZAKHONO_MAIL_API_TOKEN: ${IZAKHONO_MAIL_API_TOKEN:-}
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  mail-bridge:
    build: ./runtime/mail-bridge
    restart: unless-stopped
    environment:
      PORT: 8091
      IZAKHONO_MAIL_API_TOKEN: ${IZAKHONO_MAIL_API_TOKEN:?set IZAKHONO_MAIL_API_TOKEN}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST to the private IZAKHONO MAIL node address}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks: [izakhono, izakhono-mail]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [izakhono]
    depends_on:
      host-runtime:
        condition: service_healthy
      contact-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/" ]
      interval: 15s
      timeout: 5s
      retries: 5

  authoritative-dns:
    image: coredns/coredns:1.12.1
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./runtime/authoritative-dns/Corefile:/etc/coredns/Corefile:ro
      - ./runtime/authoritative-dns/db.izakhono.local:/zones/db.izakhono.local:ro
    networks: [izakhono]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-izakhono}
      POSTGRES_USER: ${POSTGRES_USER:-izakhono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-izakhono} -d ${POSTGRES_DB:-izakhono}"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [izakhono]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks: [izakhono]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  izakhono:
    driver: bridge
  izakhono-mail:
    name: izakhono-mail
    driver: bridge

volumes:
  host-runtime-data:
  compute-manager-data:
  caddy-data:
  caddy-config:
  postgres-data:
  minio-data:
  valkey-data:
