services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: izakhono-mailserver
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.izakhonoafrica.co.za}
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?set STALWART_RECOVERY_ADMIN}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      # Admin/JMAP bootstrap listeners are loopback-only. Public HTTP/HTTPS belongs to HOST EDGE.
      - "127.0.0.1:18080:443"
      - "127.0.0.1:18081:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    networks:
      izakhono-mail:
        aliases:
          - ${MAIL_HOSTNAME:-mail.izakhonoafrica.co.za}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz/live >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

networks:
  izakhono-mail:
    external: true
    name: izakhono-mail

volumes:
  stalwart-etc:
    external: true
    name: izakhono-mail-etc
  stalwart-data:
    external: true
    name: izakhono-mail-data
