services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-izakhono}
      POSTGRES_USER: ${POSTGRES_USER:-izakhono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - mvp-postgres-data:/var/lib/postgresql/data
    networks: [host-private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-izakhono} -d ${POSTGRES_DB:-izakhono}"]
      interval: 10s
      timeout: 5s
      retries: 12

  compute-manager:
    build: ./runtime/compute-manager
    restart: unless-stopped
    environment:
      PORT: 8082
      DATA_DIR: /data
      COMPUTE_ADMIN_TOKEN: ${COMPUTE_ADMIN_TOKEN:?set COMPUTE_ADMIN_TOKEN}
      COMPUTE_LEASE_MS: 120000
      DATABASE_URL: postgres://${POSTGRES_USER:-izakhono}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-izakhono}
    volumes:
      - mvp-compute-manager-data:/data
    networks: [host-private]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  compute-worker:
    build: ./runtime/compute-worker
    restart: unless-stopped
    environment:
      COMPUTE_MANAGER_URL: http://compute-manager:8082
      WORKER_ID: ${COMPUTE_WORKER_ID:-izakhono-worker-01}
      WORKER_ENROLLMENT_TOKEN: ${COMPUTE_WORKER_ENROLLMENT_TOKEN:-}
      WORKER_DATA_DIR: /data
      WORKER_POLL_MS: 3000
    volumes:
      - mvp-compute-worker-data:/data
    networks: [host-private]
    depends_on:
      compute-manager:
        condition: service_healthy

  host-runtime:
    build: ./runtime/control-plane
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      HOST_RUNTIME_TOKEN: ${HOST_RUNTIME_TOKEN:?set HOST_RUNTIME_TOKEN}
    volumes:
      - mvp-host-runtime-data:/data
    ports:
      - "127.0.0.1:18080:8080"
    networks: [host-private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  host-private:
    driver: bridge

volumes:
  mvp-postgres-data:
  mvp-compute-manager-data:
  mvp-compute-worker-data:
  mvp-host-runtime-data:
