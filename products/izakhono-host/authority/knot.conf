server:
  listen: 0.0.0.0@53
  listen: ::@53
  rundir: /run/knot
  pidfile: /run/knot/knot.pid
  user: knot:knot
  identity: "IZAKHONO DNS Authority"
  version: ""

log:
  - target: syslog
    any: info

database:
  storage: /var/lib/knot

# Zones are rendered from IZAKHONO HOST records into this directory.
# Example:
# zone:
#   - domain: allegrovibez.com
#     file: zones/allegrovibez.com.zone
#     semantic-checks: on
#     zonefile-sync: -1
#     zonefile-load: whole

# Production hardening:
# - ns1 and ns2 must run in independent networks/regions
# - allow UDP and TCP 53 publicly
# - authoritative service must not provide recursion
# - enable DNSSEC only after parent DS/key-roll testing is complete
