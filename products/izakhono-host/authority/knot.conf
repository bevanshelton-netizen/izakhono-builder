server:
  listen: 0.0.0.0@53
  listen: ::@53
  rundir: /run/knot
  pidfile: /run/knot/knot.pid
  user: knot:knot
  identity: "IZAKHONO DNS Authority"
  version: ""

log:
  - target: syslog
    any: info

database:
  storage: /var/lib/knot

zone:
  - domain: allegrovibez.com
    file: zones/allegrovibez.com.zone
    notify: [ ns2.izakhono-authority.example ]
    semantic-checks: on
    zonefile-sync: -1
    zonefile-load: whole

# Production hardening:
# - publish the same zone set to ns1 and ns2 in independent networks
# - allow UDP/TCP 53 only from the public Internet to this service
# - disable recursion (Knot authoritative mode)
# - enable DNSSEC after the registrar/parent DS workflow is tested
