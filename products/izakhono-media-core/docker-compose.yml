services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8890:8890/udp"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
      - "9998:9998"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings

  media-core:
    build: .
    restart: unless-stopped
    environment:
      MEDIA_CORE_PORT: "8787"
      MEDIA_PUBLIC_HOST: "localhost"
      MEDIA_ADMIN_TOKEN: "CHANGE-ME"
      MEDIA_DATA_DIR: /app/data
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
