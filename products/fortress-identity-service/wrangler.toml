name = "izakhono-fortress-identity"
main = "src/index.ts"
compatibility_date = "2026-11-13"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "izakhono-fortress-identity"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
FORTRESS_SESSION_ISSUER = "https://fortress.izakhono.internal"
FORTRESS_SESSION_AUDIENCE = "izakhono-creator"
FORTRESS_ALLOWED_ORIGIN = "https://creator.izakhono.africa"
