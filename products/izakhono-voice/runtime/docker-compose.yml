services:
  izakhono-voice:
    build:
      context: ../../..
      dockerfile: products/izakhono-voice/runtime/Dockerfile
    image: izakhono/voice-runtime:local
    container_name: izakhono-voice
    restart: unless-stopped
    env_file:
      - /etc/izakhono/apps/izakhono-voice.env
    environment:
      IZAKHONO_VOICE_HOST: 0.0.0.0
      IZAKHONO_VOICE_PORT: 8962
      NODE_ENV: production
    ports:
      - "127.0.0.1:8962:8962"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8962/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
