services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: izakhono_sports
      POSTGRES_USER: izakhono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/core/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports: ["5432:5432"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://izakhono:${POSTGRES_PASSWORD:-change-me}@db:5432/izakhono_sports
      PORT: 8080
    depends_on: [db]
    ports: ["8080:8080"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
