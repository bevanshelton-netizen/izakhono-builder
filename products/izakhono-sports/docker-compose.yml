services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: izakhono_sports
      POSTGRES_USER: izakhono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./domain.sql:/docker-entrypoint-initdb.d/001-domain.sql:ro
      - ./security.sql:/docker-entrypoint-initdb.d/002-security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izakhono -d izakhono_sports"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ["5432"]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://izakhono:${POSTGRES_PASSWORD}@db:5432/izakhono_sports
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8080:8080"]

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports: ["3000:3000"]

volumes:
  pgdata:
