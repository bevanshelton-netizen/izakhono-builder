<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IZAKHONO PAY Mock Checkout</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#06130f;color:#fff}.box{width:min(92vw,520px);padding:30px;border:1px solid #ffffff22;border-radius:28px;background:#ffffff0d;box-shadow:0 30px 80px #0008}h1{font-size:38px;margin:0 0 10px}p{color:#a7b5c7;line-height:1.6}.ref{font-family:monospace;background:#020617;padding:12px;border-radius:12px;word-break:break-all}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}button{padding:15px;border:0;border-radius:14px;font-weight:900;cursor:pointer}.pay{background:linear-gradient(90deg,#34d399,#fbbf24);color:#052e16}.cancel{background:#ffffff10;color:white;border:1px solid #ffffff22}.note{font-size:12px;color:#fcd34d;margin-top:18px}</style></head><body><div class="box"><h1>Mock checkout</h1><p>This screen deliberately collects no card data. It exists to test IZAKHONO PAY's payment-intent and ledger flow safely.</p><div class="ref" id="ref">Loading intent…</div><div class="buttons"><button class="pay" onclick="finish('pay')">Simulate payment</button><button class="cancel" onclick="finish('cancel')">Cancel</button></div><div class="note">Mock mode can never move real money.</div></div><script>const q=new URLSearchParams(location.search),intent=q.get('intent'),token=q.get('token');document.querySelector('#ref').textContent=intent||'Missing intent';async function finish(outcome){const r=await fetch('/api/demo/mock-complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent_id:intent,token,outcome})});const d=await r.json();if(!r.ok){alert(d?.error?.message||'Failed');return}location.href='/?payment='+encodeURIComponent(d.status)+'&reference='+encodeURIComponent(d.reference)}</script></body></html>
